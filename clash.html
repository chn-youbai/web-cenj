<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Clash Verge 智能云控终端</title>
  <style>
    :root {
      --bg: #090d16;
      --card-bg: #0f172a;
      --card-border: rgba(56, 189, 248, 0.2);
      --primary: #0284c7;
      --primary-glow: rgba(2, 132, 199, 0.4);
      --accent: #38bdf8;
      --success: #10b981;
      --danger: #ef4444;
      --text: #f8fafc;
      --text-muted: #94a3b8;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      min-height: 100vh;
      padding: 1rem 0.75rem 2rem;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .container {
      max-width: 600px;
      width: 100%;
    }
    /* Header */
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0.75rem 0 1.2rem;
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
      margin-bottom: 1rem;
    }
    .header-title {
      display: flex;
      align-items: center;
      gap: 0.6rem;
      font-size: 1.25rem;
      font-weight: 800;
      color: var(--accent);
      letter-spacing: -0.5px;
    }
    .back-home-btn {
      color: var(--text-muted);
      text-decoration: none;
      font-size: 0.85rem;
      background: #1e293b;
      padding: 0.4rem 0.8rem;
      border-radius: 8px;
      display: inline-flex;
      align-items: center;
      gap: 0.3rem;
      transition: all 0.2s;
    }
    .back-home-btn:hover { color: #fff; background: #334155; }

    .header-action-btn {
      color: #cbd5e1;
      background: #1e293b;
      border: 1px solid #334155;
      font-size: 0.82rem;
      padding: 0.4rem 0.65rem;
      border-radius: 8px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 0.25rem;
      transition: all 0.2s;
    }
    .header-action-btn:hover { color: #fff; background: #334155; }

    /* Auth Modal & Password System (和账单一致的高级玻璃拟物风) */
    .auth-modal-backdrop {
      position: fixed;
      inset: 0;
      z-index: 99999;
      background: rgba(10, 15, 29, 0.88);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1rem;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }
    .auth-modal-backdrop.show {
      opacity: 1;
      pointer-events: auto;
    }
    .auth-modal-card {
      background: rgba(15, 23, 42, 0.95);
      border: 1px solid rgba(56, 189, 248, 0.3);
      border-radius: 24px;
      padding: 2.2rem 2rem;
      max-width: 420px;
      width: 100%;
      box-shadow: 0 25px 60px -15px rgba(0, 0, 0, 0.8), 0 0 40px rgba(2, 132, 199, 0.2);
      text-align: center;
      transform: scale(0.92) translateY(10px);
      transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
    }
    .auth-modal-backdrop.show .auth-modal-card {
      transform: scale(1) translateY(0);
    }
    .auth-title {
      font-size: 1.35rem;
      font-weight: 800;
      color: #fff;
      margin-bottom: 0.5rem;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
    }
    .auth-desc {
      font-size: 0.86rem;
      color: #94a3b8;
      line-height: 1.5;
      margin-bottom: 1.4rem;
    }
    .auth-input-wrap {
      position: relative;
      margin-bottom: 0.6rem;
    }
    .auth-input {
      width: 100%;
      box-sizing: border-box;
      padding: 0.85rem 1rem;
      background: rgba(30, 41, 59, 0.7);
      border: 1.5px solid rgba(255, 255, 255, 0.18);
      border-radius: 12px;
      color: #fff;
      font-size: 1.15rem;
      letter-spacing: 0.25em;
      text-align: center;
      outline: none;
      transition: border-color 0.25s, box-shadow 0.25s;
    }
    .auth-input:focus {
      border-color: #0284c7;
      box-shadow: 0 0 0 3px rgba(2, 132, 199, 0.25);
    }
    .auth-error {
      color: #ef4444;
      font-size: 0.82rem;
      min-height: 1.3rem;
      margin-bottom: 0.6rem;
    }
    .auth-remember-row {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      font-size: 0.85rem;
      color: #cbd5e1;
      margin-bottom: 1.3rem;
      cursor: pointer;
    }
    .auth-btn-row {
      display: flex;
      gap: 0.8rem;
    }
    .auth-submit-btn {
      flex: 1;
      padding: 0.8rem;
      border-radius: 9999px;
      background: linear-gradient(135deg, #0284c7, #06b6d4);
      color: white;
      font-size: 0.95rem;
      font-weight: 700;
      border: none;
      cursor: pointer;
      box-shadow: 0 8px 20px rgba(2, 132, 199, 0.35);
      transition: transform 0.2s, box-shadow 0.2s;
    }
    .auth-submit-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 12px 25px rgba(2, 132, 199, 0.45);
    }
    .auth-cancel-btn {
      padding: 0.8rem 1.4rem;
      border-radius: 9999px;
      background: rgba(255, 255, 255, 0.1);
      color: #cbd5e1;
      font-size: 0.95rem;
      border: 1px solid rgba(255, 255, 255, 0.15);
      cursor: pointer;
      transition: background 0.2s;
    }
    .auth-cancel-btn:hover {
      background: rgba(255, 255, 255, 0.18);
    }

    /* Tabs Bar */
    .tab-bar {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      background: #1e293b;
      padding: 0.3rem;
      border-radius: 12px;
      gap: 0.3rem;
      margin-bottom: 1rem;
    }
    .tab-btn {
      background: transparent;
      border: none;
      color: var(--text-muted);
      padding: 0.6rem 0.2rem;
      font-size: 0.85rem;
      font-weight: 700;
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.2s ease;
      text-align: center;
    }
    .tab-btn.active {
      background: var(--primary);
      color: #fff;
      box-shadow: 0 4px 12px var(--primary-glow);
    }

    /* Auth & Status Strip */
    .status-strip {
      background: #111827;
      border: 1px solid rgba(255,255,255,0.06);
      border-radius: 12px;
      padding: 0.8rem 1rem;
      margin-bottom: 1rem;
    }
    .auth-row {
      display: flex;
      gap: 0.5rem;
      margin-bottom: 0.6rem;
    }
    .pwd-input {
      flex: 1;
      background: #1f2937;
      border: 1px solid #374151;
      color: #fff;
      padding: 0.5rem 0.8rem;
      border-radius: 8px;
      font-size: 0.88rem;
      outline: none;
    }
    .btn {
      background: var(--primary);
      color: #fff;
      border: none;
      border-radius: 8px;
      padding: 0.5rem 1rem;
      font-size: 0.85rem;
      font-weight: 700;
      cursor: pointer;
      transition: transform 0.1s, opacity 0.2s;
    }
    .btn:active { transform: scale(0.97); }
    .btn-speed {
      background: linear-gradient(135deg, #10b981, #059669);
      box-shadow: 0 2px 10px rgba(16,185,129,0.3);
    }
    .pc-hb-bar {
      font-size: 0.82rem;
      color: #cbd5e1;
      background: #1f2937;
      padding: 0.5rem 0.8rem;
      border-radius: 8px;
      line-height: 1.4;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 0.4rem;
    }

    /* Cards & Content */
    .card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 14px;
      padding: 1.1rem;
      margin-bottom: 1rem;
    }
    .card-title {
      font-size: 0.95rem;
      font-weight: 700;
      color: #e2e8f0;
      margin-bottom: 0.8rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    /* Feedback Banner */
    .latest-feedback {
      background: #0b1120;
      border-left: 4px solid var(--primary);
      border-radius: 8px;
      padding: 0.7rem 0.9rem;
      font-size: 0.82rem;
      color: var(--text-muted);
      line-height: 1.5;
      margin-top: 1rem;
    }

    /* Subscriptions & Nodes */
    .item-card {
      background: #1e293b;
      border-radius: 10px;
      padding: 0.85rem;
      margin-bottom: 0.65rem;
      border: 1px solid #334155;
    }
    .item-card.active { border-color: var(--primary); }

    /* Speed Test Cards */
    .speed-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 0.75rem;
    }
    @media (min-width: 480px) {
      .speed-grid { grid-template-columns: 1fr 1fr; }
    }
    .speed-card {
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 12px;
      padding: 0.9rem;
      position: relative;
    }
    .speed-card.active-region { border-color: var(--primary); }
    .speed-badge {
      font-size: 0.9rem;
      font-weight: 800;
      padding: 0.2rem 0.6rem;
      border-radius: 6px;
      background: rgba(15,23,42,0.8);
    }
  </style>
</head>
<body>

<!-- 密码验证解锁遮罩/弹窗 (和账单一致) -->
<div class="auth-modal-backdrop" id="authModalBackdrop">
  <div class="auth-modal-card">
    <div class="auth-title">
      <span>🔐</span>
      <span>Clash 云控终端</span>
    </div>
    <div class="auth-desc">请输入独立访问密码以进入（初始默认密码：<strong>8888</strong>）</div>
    <div class="auth-input-wrap">
      <input type="password" id="clashAuthInput" class="auth-input" placeholder="输入密码" maxlength="20" autocomplete="current-password">
    </div>
    <div style="margin-bottom:0.8rem; display:flex; justify-content:center;">
      <button type="button" onclick="fillDefaultPwd()" style="background:rgba(2,132,199,0.15); border:1px solid rgba(56,189,248,0.3); color:#38bdf8; font-size:0.75rem; padding:0.25rem 0.65rem; border-radius:6px; cursor:pointer;">⚡ 点击一键填入默认密码 (8888)</button>
    </div>
    <div class="auth-error" id="authErrorMsg"></div>
    <label class="auth-remember-row">
      <input type="checkbox" id="authRememberCheck" checked>
      <span>记住解锁状态 (30天免密访问)</span>
    </label>
    <div class="auth-btn-row">
      <a href="./index.html" class="auth-cancel-btn" style="text-decoration:none; display:inline-flex; align-items:center; justify-content:center;">返回主页</a>
      <button class="auth-submit-btn" onclick="submitClashAuth()">解锁进入 🚀</button>
    </div>
  </div>
</div>

<!-- 修改访问密码弹窗 (和账单一致) -->
<div class="auth-modal-backdrop" id="changePwdModal">
  <div class="auth-modal-card" style="max-width:380px;">
    <div class="auth-title">
      <span>🔑</span>
      <span>修改访问密码</span>
    </div>
    <div class="auth-desc" style="margin-bottom:1rem;">修改后所有设备均需使用新密码访问</div>
    <div style="text-align:left; margin-bottom:0.8rem;">
      <label style="font-size:0.8rem; color:#cbd5e1; display:block; margin-bottom:0.3rem;">原访问密码：</label>
      <input type="password" id="pwdCurrentInput" class="auth-input" style="font-size:0.95rem; padding:0.6rem; letter-spacing:normal;" placeholder="当前密码 (默认8888)">
    </div>
    <div style="text-align:left; margin-bottom:1rem;">
      <label style="font-size:0.8rem; color:#cbd5e1; display:block; margin-bottom:0.3rem;">新密码 (至少4位)：</label>
      <input type="password" id="pwdNewInput" class="auth-input" style="font-size:0.95rem; padding:0.6rem; letter-spacing:normal;" placeholder="输入新的访问密码">
    </div>
    <div class="auth-error" id="changePwdErrorMsg"></div>
    <div class="auth-btn-row">
      <button class="auth-cancel-btn" onclick="closeChangePwdModal()">取消</button>
      <button class="auth-submit-btn" onclick="saveNewPassword()">确认修改</button>
    </div>
  </div>
</div>

<div class="container" id="mainAppContainer">
  <!-- Header -->
  <header class="header">
    <div class="header-title">
      <span>⚡</span>
      <span>Clash Verge 云控终端</span>
    </div>
    <div style="display:flex; gap:0.4rem; align-items:center;">
      <button class="header-action-btn" onclick="openChangePwdModal()" title="修改访问密码">🔑 密码</button>
      <button class="header-action-btn" onclick="logoutAuth()" title="退出锁定">🚪 锁定</button>
      <a href="./index.html" class="back-home-btn">← 主页</a>
    </div>
  </header>

  <!-- Navigation Tabs -->
  <nav class="tab-bar">
    <button class="tab-btn active" data-tab="hub" onclick="switchTab('hub')">⚡ 控制中枢</button>
    <button class="tab-btn" data-tab="speed" onclick="switchTab('speed')">🚀 常用测速</button>
    <button class="tab-btn" data-tab="subs" onclick="switchTab('subs')">📋 订阅管理</button>
    <button class="tab-btn" data-tab="nodes" onclick="switchTab('nodes')">🌍 全量节点</button>
  </nav>

  <!-- Auth & Status Strip -->
  <section class="status-strip">
    <div class="auth-row" style="display:flex; align-items:center; justify-content:space-between; margin-bottom:0.6rem;">
      <div style="display:flex; align-items:center; gap:0.4rem; color:#cbd5e1; font-weight:700; font-size:0.85rem;">
        <span style="display:inline-block; width:8px; height:8px; border-radius:50%; background:#10b981; box-shadow:0 0 8px #10b981;"></span>
        <span>已鉴权 (30天免密中)</span>
      </div>
      <div style="display:flex; gap:0.5rem;">
        <button class="btn" style="background:#1e293b; border:1px solid #334155; padding:0.4rem 0.8rem;" onclick="refreshStatus()">🔄 刷新状态</button>
        <button class="btn btn-speed" style="padding:0.4rem 0.8rem;" onclick="sendCommand('check_delay')">⚡ 测速刷新</button>
      </div>
    </div>
    <div id="clashStatusText" style="font-size:0.78rem; color:var(--text-muted); margin-bottom:0.4rem;">正在检测云端连接...</div>
    <div id="pcHbBar" class="pc-hb-bar">💻 电脑状态：检测中...</div>
  </section>

  <!-- Tab 1: 控制中枢 -->
  <main id="tabHub" class="tab-content">
    <!-- 快速换订阅 -->
    <div class="card">
      <div class="card-title">🔗 远程添加/更新订阅链接</div>
      <input type="text" id="newSubUrlInput" placeholder="粘贴新机场订阅链接 (https://...)" style="width:100%; background:#0b1120; border:1px solid #334155; border-radius:8px; padding:0.65rem 0.8rem; color:#fff; font-size:0.85rem; margin-bottom:0.75rem; outline:none;">
      <button onclick="submitNewSub()" style="width:100%; background:linear-gradient(135deg, #0284c7, #06b6d4); border:none; color:#fff; border-radius:8px; padding:0.7rem; font-weight:700; font-size:0.9rem; cursor:pointer;">🚀 极速下发电脑生效</button>
    </div>

    <!-- 常用地区快捷切节点 -->
    <div class="card">
      <div class="card-title">🌍 常用地区一键切换</div>
      <div style="display:grid; grid-template-columns:1fr 1fr; gap:0.6rem;">
        <button class="btn" style="background:#1e293b; border:1px solid #334155; padding:0.7rem;" onclick="sendCommand('switch_node', 'Singapore')">🇸🇬 新加坡节点</button>
        <button class="btn" style="background:#1e293b; border:1px solid #334155; padding:0.7rem;" onclick="sendCommand('switch_node', 'Hong Kong')">🇭🇰 香港节点</button>
        <button class="btn" style="background:#1e293b; border:1px solid #334155; padding:0.7rem;" onclick="sendCommand('switch_node', 'Japan')">🇯🇵 日本节点</button>
        <button class="btn" style="background:#1e293b; border:1px solid var(--primary); color:var(--accent); padding:0.7rem;" onclick="sendCommand('switch_node', 'auto_lowest')">⚡ 自动选最低延迟</button>
      </div>
    </div>

    <!-- 工具按钮组 -->
    <div style="display:flex; gap:0.6rem;">
      <button class="btn" style="flex:1; background:#334155; padding:0.65rem;" onclick="sendCommand('check_delay')">📡 快速测速</button>
      <button class="btn" style="flex:1; background:#0369a1; padding:0.65rem;" onclick="sendCommand('sync_all')">🔄 同步配置</button>
      <button class="btn" style="flex:1; background:#475569; padding:0.65rem;" onclick="sendCommand('restart')">⚙️ 重启内核</button>
    </div>
  </main>

  <!-- Tab 2: 常用测速 -->
  <main id="tabSpeed" class="tab-content" style="display:none;">
    <div class="card">
      <div class="card-title">
        <span>🚀 常用核心地区延迟看板</span>
        <button class="btn btn-speed" style="padding:0.35rem 0.75rem; font-size:0.78rem;" onclick="sendCommand('check_delay')">⚡ 测速刷新</button>
      </div>
      <div id="speedListContainer" class="speed-grid">
        <div style="color:var(--text-muted); font-size:0.85rem; padding:2rem 0; text-align:center; grid-column:span 2;">点击刷新状态获取常用测速...</div>
      </div>
    </div>
  </main>

  <!-- Tab 3: 订阅管理 -->
  <main id="tabSubs" class="tab-content" style="display:none;">
    <div class="card">
      <div class="card-title">
        <span>📋 电脑已配置的所有订阅</span>
        <button class="btn" style="padding:0.35rem 0.75rem; font-size:0.78rem; background:#334155;" onclick="sendCommand('sync_all')">更新列表</button>
      </div>
      <div id="subsListContainer">
        <div style="color:var(--text-muted); font-size:0.85rem; padding:2rem 0; text-align:center;">暂无订阅数据，正在获取...</div>
      </div>
    </div>
  </main>

  <!-- Tab 4: 全量节点 -->
  <main id="tabNodes" class="tab-content" style="display:none;">
    <div class="card">
      <div class="card-title">
        <span>🌍 按地区分类的全部节点 (点击即换)</span>
        <button class="btn btn-speed" style="padding:0.35rem 0.75rem; font-size:0.78rem;" onclick="sendCommand('check_delay')">测速刷新</button>
      </div>
      <div id="nodesListContainer">
        <div style="color:var(--text-muted); font-size:0.85rem; padding:2rem 0; text-align:center;">暂无节点数据，正在获取...</div>
      </div>
    </div>
  </main>

  <!-- Bottom Feedback -->
  <section id="latestFeedback" class="latest-feedback">
    最近指令反馈将显示在这里...
  </section>
</div>

<script>
  let currentTab = 'hub';

  function switchTab(tabName) {
    currentTab = tabName;
    document.querySelectorAll('.tab-btn').forEach(btn => {
      btn.classList.toggle('active', btn.getAttribute('data-tab') === tabName);
    });
    document.getElementById('tabHub').style.display = (tabName === 'hub') ? 'block' : 'none';
    document.getElementById('tabSpeed').style.display = (tabName === 'speed') ? 'block' : 'none';
    document.getElementById('tabSubs').style.display = (tabName === 'subs') ? 'block' : 'none';
    document.getElementById('tabNodes').style.display = (tabName === 'nodes') ? 'block' : 'none';
  }

  // ==================== 1. 访问鉴权与密码安全 (和账单系统一致) ====================
  const AUTH_KEY = 'clash_auth_token_v1';
  const PWD_STORAGE_KEY = 'clash_custom_password_v1';
  const DEFAULT_PASSWORD = '8888';

  function getStoredPassword() {
    return localStorage.getItem(PWD_STORAGE_KEY) || sessionStorage.getItem(PWD_STORAGE_KEY) || DEFAULT_PASSWORD;
  }

  function isAuthorized() {
    const token = localStorage.getItem(AUTH_KEY) || sessionStorage.getItem(AUTH_KEY);
    if (!token) return false;
    try {
      const data = JSON.parse(token);
      // 30 天免密
      if (Date.now() - data.time > 30 * 24 * 60 * 60 * 1000) {
        localStorage.removeItem(AUTH_KEY);
        sessionStorage.removeItem(AUTH_KEY);
        return false;
      }
      return true;
    } catch (e) {
      localStorage.removeItem(AUTH_KEY);
      sessionStorage.removeItem(AUTH_KEY);
      return false;
    }
  }

  function fillDefaultPwd() {
    const input = document.getElementById('clashAuthInput');
    if (input) {
      input.value = '8888';
      submitClashAuth();
    }
  }

  function checkAccessGate() {
    const backdrop = document.getElementById('authModalBackdrop');
    const mainApp = document.getElementById('mainAppContainer');
    const input = document.getElementById('clashAuthInput');
    const err = document.getElementById('authErrorMsg');

    if (isAuthorized()) {
      backdrop.classList.remove('show');
      mainApp.style.filter = '';
      refreshStatus();
      startAutoRefresh();
    } else {
      stopAutoRefresh();
      if (err) {
        err.style.color = '#ef4444';
        err.textContent = '';
      }
      if (input) input.value = '';
      backdrop.classList.add('show');
      mainApp.style.filter = 'blur(10px)';
      setTimeout(() => { if (input) input.focus(); }, 150);
    }
  }

  async function submitClashAuth() {
    const input = document.getElementById('clashAuthInput');
    const err = document.getElementById('authErrorMsg');
    const remember = document.getElementById('authRememberCheck').checked;
    const pwd = input ? input.value.trim() : '';

    if (!pwd) {
      if (err) {
        err.style.color = '#ef4444';
        err.textContent = '请输入访问密码';
      }
      return;
    }

    if (err) {
      err.style.color = '#38bdf8';
      err.textContent = '正在验证中...';
    }

    try {
      const res = await fetch(`/api/clash?pwd=${encodeURIComponent(pwd)}`);
      const data = await res.json();
      if (data.status === 'ok') {
        const payload = JSON.stringify({ time: Date.now() });
        if (remember) {
          localStorage.setItem(AUTH_KEY, payload);
          localStorage.setItem(PWD_STORAGE_KEY, pwd);
        } else {
          sessionStorage.setItem(AUTH_KEY, payload);
          sessionStorage.setItem(PWD_STORAGE_KEY, pwd);
        }
        if (err) {
          err.style.color = '#10b981';
          err.textContent = '验证成功，正在解锁...';
        }
        setTimeout(() => {
          checkAccessGate();
        }, 200);
      } else {
        if (err) {
          err.style.color = '#ef4444';
          err.textContent = '密码错误，请重新输入（初始密码：8888）';
        }
        if (input) input.select();
      }
    } catch (e) {
      if (err) {
        err.style.color = '#ef4444';
        err.textContent = '网络连接异常，请重试';
      }
    }
  }

  document.getElementById('clashAuthInput')?.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') submitClashAuth();
  });

  function openChangePwdModal() {
    document.getElementById('pwdCurrentInput').value = '';
    document.getElementById('pwdNewInput').value = '';
    const err = document.getElementById('changePwdErrorMsg');
    if (err) err.textContent = '';
    document.getElementById('changePwdModal').classList.add('show');
    setTimeout(() => { document.getElementById('pwdCurrentInput').focus(); }, 150);
  }

  function closeChangePwdModal() {
    document.getElementById('changePwdModal').classList.remove('show');
  }

  async function saveNewPassword() {
    const cur = document.getElementById('pwdCurrentInput').value.trim();
    const next = document.getElementById('pwdNewInput').value.trim();
    const err = document.getElementById('changePwdErrorMsg');

    if (!cur) {
      err.style.color = '#ef4444';
      err.textContent = '请输入原访问密码';
      return;
    }
    if (!next || next.length < 4) {
      err.style.color = '#ef4444';
      err.textContent = '新密码至少需要 4 位字符';
      return;
    }

    err.style.color = '#38bdf8';
    err.textContent = '正在保存至云端...';

    try {
      const res = await fetch('/api/clash', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ action: 'change_password', old_pwd: cur, new_pwd: next })
      });
      const data = await res.json();
      if (data.status === 'ok') {
        localStorage.setItem(PWD_STORAGE_KEY, next);
        closeChangePwdModal();
        alert('🎉 密码修改成功！请牢记新密码。');
        refreshStatus();
      } else {
        err.style.color = '#ef4444';
        err.textContent = data.message || '原访问密码错误';
      }
    } catch (e) {
      err.style.color = '#ef4444';
      err.textContent = '网络请求失败，请稍后重试';
    }
  }

  function logoutAuth() {
    if (confirm('确定退出锁定状态吗？退出后再次进入需要重新输入访问密码。')) {
      stopAutoRefresh();
      localStorage.removeItem(AUTH_KEY);
      sessionStorage.removeItem(AUTH_KEY);
      checkAccessGate();
    }
  }

  // 动态自动定时刷新系统 (进入页面后每 6 秒平滑同步一次)
  let autoRefreshTimer = null;
  function startAutoRefresh() {
    if (autoRefreshTimer) clearInterval(autoRefreshTimer);
    autoRefreshTimer = setInterval(() => {
      if (isAuthorized() && !document.hidden) {
        refreshStatus(true);
      }
    }, 6000);
  }

  function stopAutoRefresh() {
    if (autoRefreshTimer) {
      clearInterval(autoRefreshTimer);
      autoRefreshTimer = null;
    }
  }

  document.addEventListener('visibilitychange', () => {
    if (!document.hidden && isAuthorized()) {
      refreshStatus(true);
    }
  });

  function formatTime(isoStr) {
    if (!isoStr) return '';
    const d = new Date(isoStr);
    if (isNaN(d.getTime())) return isoStr;
    const pad = n => String(n).padStart(2, '0');
    return `${pad(d.getHours())}:${pad(d.getMinutes())}:${pad(d.getSeconds())}`;
  }

  let isStatusRefreshing = false;

  let isLastPCOnline = true;

  async function refreshStatus(isBackground = false) {
    if (isStatusRefreshing && isBackground) return;
    isStatusRefreshing = true;

    const pwd = getStoredPassword();
    const statusEl = document.getElementById('clashStatusText');
    const pcHbEl = document.getElementById('pcHbBar');
    const feedbackEl = document.getElementById('latestFeedback');

    if (!isBackground && statusEl) {
      statusEl.textContent = '🔄 同步中...';
    }

    try {
      const res = await fetch(`/api/clash?pwd=${encodeURIComponent(pwd)}`);
      if (res.status === 401) {
        // 关键防护：遇到401密码错误，立刻清除本地授权Token并停止定时器，防止死循环无限重试卡死页面
        localStorage.removeItem(AUTH_KEY);
        sessionStorage.removeItem(AUTH_KEY);
        stopAutoRefresh();
        checkAccessGate();
        isStatusRefreshing = false;
        return;
      }

      const data = await res.json();
      if (data.status === 'ok') {
        const isOnline = !!(data.heartbeat && data.heartbeat.status === 'online');
        isLastPCOnline = isOnline;

        if (statusEl && isBackground) {
          statusEl.innerHTML = '<span style="color:#10b981;">● 已连接云端中继 (秒级自动同步中)</span>';
        } else if (statusEl && !statusEl.innerHTML.includes('🚀') && !statusEl.innerHTML.includes('⚠️')) {
          statusEl.innerHTML = '<span style="color:#10b981;">● 已连接云端中继 (秒级自动同步中)</span>';
        }
        
        if (data.heartbeat && pcHbEl) {
          const hb = data.heartbeat;
          if (hb.status === 'online') {
            pcHbEl.innerHTML = `<span>💻 电脑状态：<strong style="color:#10b981;">● 在线</strong> (${hb.result.replace('在线 | ', '')})</span> <span style="font-size:0.75rem; color:#94a3b8;">${hb.diff_sec}秒前活跃</span>`;
          } else {
            const diffText = hb.diff_sec < 60 ? `${hb.diff_sec}秒前` : (hb.diff_sec < 3600 ? `${Math.round(hb.diff_sec/60)}分钟前` : `${Math.round(hb.diff_sec/3600)}小时前`);
            pcHbEl.innerHTML = `<span>💻 电脑状态：<strong style="color:#ef4444;">○ 离线 / 已关机</strong></span> <span style="font-size:0.75rem; color:#94a3b8;">(最后活跃于 ${diffText})</span>`;
          }
        } else if (pcHbEl) {
          pcHbEl.innerHTML = `💻 电脑状态：<span style="color:#94a3b8;">暂无心跳记录</span>`;
        }

        if (data.latest_command && feedbackEl) {
          const cmd = data.latest_command;
          const isDone = cmd.status === 'done';
          const isPending = cmd.status === 'pending';
          let badge = '';
          if (isDone) {
            badge = '<span style="color:#10b981;">✅ 完成</span>';
          } else if (isPending) {
            badge = isOnline ? '<span style="color:#f59e0b;">⏳ 电脑高速执行中</span>' : '<span style="color:#ef4444;">⏸️ 电脑离线等待中</span>';
          } else {
            badge = '<span style="color:#ef4444;">❌ 失败</span>';
          }
          
          const dispatchText = cmd.dispatched_at ? formatTime(cmd.dispatched_at) : (cmd.updated_at || '刚刚');
          let responseText = '';
          let durationText = '';

          if (cmd.responded_at) {
            responseText = formatTime(cmd.responded_at);
            if (cmd.dispatched_at) {
              const dur = Math.max(0, Math.round((new Date(cmd.responded_at) - new Date(cmd.dispatched_at)) / 1000));
              durationText = ` <span style="color:#60a5fa;">(耗时 ${dur}秒)</span>`;
            }
          } else if (isPending) {
            if (cmd.dispatched_at) {
              const wait = Math.max(0, Math.round((Date.now() - new Date(cmd.dispatched_at)) / 1000));
              if (isOnline) {
                responseText = `<span style="color:#fbbf24;">执行中... (已等 ${wait}秒)</span>`;
              } else {
                responseText = `<span style="color:#ef4444;">电脑离线，待电脑开机后自动执行 (已等 ${wait}秒)</span>`;
              }
            } else {
              responseText = isOnline ? '<span style="color:#fbbf24;">等待响应...</span>' : '<span style="color:#ef4444;">电脑离线中...</span>';
            }
          } else {
            responseText = cmd.updated_at || '-';
          }

          feedbackEl.innerHTML = `
            <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:0.35rem;">
              <span style="font-weight:700; color:#fff;">最近指令: [${cmd.command}]</span>
              <span style="font-weight:700; font-size:0.82rem;">${badge}</span>
            </div>
            <div style="font-size:0.76rem; color:#94a3b8; display:flex; flex-wrap:wrap; gap:0.9rem; margin-bottom:0.35rem; background:rgba(0,0,0,0.3); padding:0.35rem 0.6rem; border-radius:6px;">
              <span>📤 下发时间: <strong style="color:#e2e8f0;">${dispatchText}</strong></span>
              <span>📥 电脑回应: <strong style="color:#10b981;">${responseText}</strong>${durationText}</span>
            </div>
            <div style="color:#93c5fd; font-size:0.8rem; line-height:1.4;">${cmd.result || ''}</div>
          `;
        }

        renderSpeed(data.speed_data);
        renderSubs(data.profiles_data);
        renderNodes(data.nodes_data);
      } else {
        if (statusEl) {
          statusEl.innerHTML = `<span style="color:#ef4444;">❌ ${data.message || '密码错误'}</span>`;
        }
      }
    } catch (e) {
      if (!isBackground && statusEl) {
        statusEl.innerHTML = `<span style="color:#ef4444;">❌ 网络请求异常</span>`;
      }
    } finally {
      isStatusRefreshing = false;
    }
  }

  function renderSpeed(speedData) {
    const container = document.getElementById('speedListContainer');
    if (!speedData || !speedData.regions_summary || speedData.regions_summary.length === 0) {
      container.innerHTML = '<div style="color:var(--text-muted); font-size:0.85rem; padding:2rem 0; text-align:center; grid-column:span 2;">暂无常用测速数据，请点击右上角【⚡ 测速刷新】获取...</div>';
      return;
    }

    let html = '';
    speedData.regions_summary.forEach(reg => {
      const isBestValid = reg.best_delay && reg.best_delay !== '超时' && reg.best_delay !== '-';
      const delayColor = isBestValid ? (parseInt(reg.best_delay) < 100 ? '#10b981' : '#38bdf8') : '#ef4444';
      const safeNode = (reg.best_node || '').replace(/'/g, "\\'");

      html += `
        <div class="speed-card ${reg.active ? 'active-region' : ''}">
          <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:0.5rem;">
            <span style="font-size:1rem; font-weight:800; color:#fff;">${reg.label} <small style="font-size:0.75rem; color:#94a3b8; font-weight:normal;">(${reg.node_count}节点)</small></span>
            <span class="speed-badge" style="color:${delayColor}; border:1px solid ${delayColor}44;">${reg.best_delay}</span>
          </div>
          <div style="font-size:0.78rem; color:#94a3b8; margin-bottom:0.6rem; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;">
            最快: <span style="color:#cbd5e1;">${reg.best_node || '暂无'}</span>
          </div>
          ${reg.best_node ? `
            <button onclick="sendCommand('switch_node', '${safeNode}')" class="btn" style="width:100%; padding:0.4rem; font-size:0.78rem;">一键切此最快</button>
          ` : ''}
        </div>
      `;
    });
    container.innerHTML = html;
  }

  function renderSubs(profilesData) {
    const container = document.getElementById('subsListContainer');
    if (!profilesData || !profilesData.items || profilesData.items.length === 0) {
      container.innerHTML = '<div style="color:var(--text-muted); font-size:0.85rem; padding:2rem 0; text-align:center;">暂无订阅数据，正在获取...</div>';
      return;
    }

    let html = '';
    profilesData.items.forEach(p => {
      const activeBadge = p.is_active ? 
        '<span style="background:#0284c7; color:#fff; font-size:0.72rem; padding:0.2rem 0.5rem; border-radius:4px; font-weight:700;">当前生效中</span>' : 
        `<button onclick="sendCommand('switch_profile', '${p.uid}')" class="btn" style="padding:0.25rem 0.6rem; font-size:0.75rem; background:#334155;">切换到此订阅</button>`;

      html += `
        <div class="item-card ${p.is_active ? 'active' : ''}">
          <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:0.4rem;">
            <span style="font-weight:700; font-size:0.95rem; color:#fff;">${p.name || p.uid}</span>
            ${activeBadge}
          </div>
          <div style="font-size:0.8rem; color:var(--text-muted); line-height:1.5;">
            <div>流量：<span style="color:var(--accent);">${p.used_gb} GB</span> / ${p.total_gb > 0 ? p.total_gb + ' GB' : '不限'} | 到期：<span style="color:#e2e8f0;">${p.expire}</span></div>
            <div style="word-break:break-all; font-size:0.72rem; color:#64748b; margin-top:0.25rem;">${p.url || ''}</div>
          </div>
        </div>
      `;
    });
    container.innerHTML = html;
  }

  function renderNodes(nodesData) {
    const container = document.getElementById('nodesListContainer');
    if (!nodesData || !nodesData.regions) {
      container.innerHTML = '<div style="color:var(--text-muted); font-size:0.85rem; padding:2rem 0; text-align:center;">暂无节点数据，正在获取...</div>';
      return;
    }

    let html = '';
    const nowNode = nodesData.now || '';

    for (const [region, nodes] of Object.entries(nodesData.regions)) {
      if (!nodes || nodes.length === 0) continue;
      const count = nodes.length;
      const containsActive = nodes.some(n => n.name === nowNode);
      
      html += `
        <details ${containsActive ? 'open' : ''} style="background:#1e293b; border-radius:10px; margin-bottom:0.7rem; border:1px solid #334155; overflow:hidden;">
          <summary style="padding:0.7rem 0.9rem; font-size:0.9rem; font-weight:700; color:#cbd5e1; cursor:pointer; background:#182234; display:flex; justify-content:space-between; align-items:center; list-style:none;">
            <span>${region} (${count})</span>
            ${containsActive ? '<span style="color:var(--accent); font-size:0.75rem; font-weight:normal;">● 正在使用此区域</span>' : '<span style="color:#64748b; font-size:0.75rem;">展开 ▼</span>'}
          </summary>
          <div style="padding:0.6rem; max-height:260px; overflow-y:auto;">
      `;

      nodes.forEach(n => {
        const isCurrent = (n.name === nowNode);
        const safeName = n.name.replace(/'/g, "\\'");
        html += `
          <div onclick="sendCommand('switch_node', '${safeName}')" style="display:flex; justify-content:space-between; align-items:center; padding:0.5rem 0.7rem; margin-bottom:0.4rem; border-radius:6px; cursor:pointer; background:${isCurrent ? 'rgba(2, 132, 199, 0.25)' : '#0f172a'}; border:${isCurrent ? '1px solid var(--primary)' : '1px solid rgba(255,255,255,0.05)'};">
            <span style="font-size:0.85rem; color:${isCurrent ? 'var(--accent)' : '#e2e8f0'}; font-weight:${isCurrent ? '700' : '400'}; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; max-width:70%;">
              ${isCurrent ? '✔ ' : ''}${n.name}
            </span>
            <span style="font-size:0.78rem; color:${n.delay_num < 100 ? '#10b981' : (n.delay_num < 250 ? '#38bdf8' : '#94a3b8')}; font-weight:700;">
              ${n.delay}
            </span>
          </div>
        `;
      });

      html += `
          </div>
        </details>
      `;
    }
    container.innerHTML = html;
  }

  async function sendCommand(command, payload = '') {
    const pwd = getStoredPassword();
    const statusEl = document.getElementById('clashStatusText');

    statusEl.innerHTML = '⚡ 正在下发指令并触发电脑秒级响应...';

    try {
      const res = await fetch('/api/clash', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ pwd, action: 'dispatch_command', command, payload })
      });
      const data = await res.json();
      if (data.status === 'ok') {
        if (!isLastPCOnline) {
          statusEl.innerHTML = '<span style="color:#f59e0b;">⚠️ 指令已提交云端！电脑当前离线/已关机，待电脑开机联网后将自动秒级执行。</span>';
        } else {
          statusEl.innerHTML = '<span style="color:#10b981;">🚀 指令已直达云端！电脑秒级执行中...</span>';
        }
        refreshStatus(true);
        setTimeout(() => refreshStatus(true), 1200);
        setTimeout(() => refreshStatus(true), 2500);
        setTimeout(() => refreshStatus(true), 4500);
        setTimeout(() => refreshStatus(true), 7000);
      } else if (res.status === 401) {
        alert('访问密码已失效或已被修改，请重新解锁');
        localStorage.removeItem(AUTH_KEY);
        sessionStorage.removeItem(AUTH_KEY);
        checkAccessGate();
      } else {
        statusEl.innerHTML = `<span style="color:#ef4444;">❌ 失败: ${data.message}</span>`;
      }
    } catch (e) {
      statusEl.innerHTML = `<span style="color:#ef4444;">❌ 网络请求失败</span>`;
    }
  }

  function submitNewSub() {
    const url = document.getElementById('newSubUrlInput').value.trim();
    if (!url || !url.startsWith('http')) {
      alert('请输入有效的 http/https 订阅链接');
      return;
    }
    sendCommand('update_sub', url);
    document.getElementById('newSubUrlInput').value = '';
  }

  // 页面载入时执行安全门禁鉴权检查
  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', checkAccessGate);
  } else {
    checkAccessGate();
  }
</script>
</body>
</html>
