<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#faf9f5">
  <title>Clash Verge 智能云控终端</title>
  <link rel="icon" href="./OIP-C.jpg" type="image/jpeg">
  <script>
    (function(){try{var t=localStorage.getItem("cenj_theme_v1");var d=t==="dark"||(t!=="light"&&window.matchMedia("(prefers-color-scheme: dark)").matches);document.documentElement.dataset.theme=d?"dark":"light";if(d)document.documentElement.classList.add("dark");var m=document.querySelector('meta[name="theme-color"]');if(m)m.content=d?"#262624":"#faf9f5";}catch(e){}})();
  </script>
  <link rel="preconnect" href="https://fonts.loli.net" crossorigin>
  <link rel="stylesheet" href="https://fonts.loli.net/css2?family=Noto+Serif+SC:wght@400;500;600;700&display=swap">
  <link rel="stylesheet" href="./src/styles/base.css">
  <link rel="stylesheet" href="./src/styles/shell.css">
  <link rel="stylesheet" href="./src/styles/clash.css">
</head>
<body>

<!-- 密码验证解锁遮罩/弹窗 -->
<div class="auth-modal-backdrop" id="authModalBackdrop">
  <div class="auth-modal-card">
    <div class="auth-title">
      <span>🔐</span>
      <span>Clash 云控终端</span>
    </div>
    <div class="auth-desc">请输入管理员访问密码以解锁远程控制面板</div>
    <div class="auth-input-wrap">
      <input type="password" id="clashAuthInput" class="auth-input" placeholder="输入密码" maxlength="20" autocomplete="current-password">
    </div>
    <div class="auth-error" id="authErrorMsg"></div>
    <label class="auth-remember-row">
      <input type="checkbox" id="authRememberCheck" checked>
      <span>记住解锁状态 (30天免密访问)</span>
    </label>
    <div class="auth-btn-row">
      <a href="./index.html" class="auth-cancel-btn" style="text-decoration:none; display:inline-flex; align-items:center; justify-content:center;">返回主页</a>
      <button type="button" class="auth-submit-btn" id="btnClashUnlock">解锁进入 🚀</button>
    </div>
  </div>
</div>

<!-- 修改访问密码弹窗 -->
<div class="auth-modal-backdrop" id="changePwdModal">
  <div class="auth-modal-card" style="max-width:380px;">
    <div class="auth-title">
      <span>🔑</span>
      <span>修改访问密码</span>
    </div>
    <div class="auth-desc" style="margin-bottom:1rem;">修改后所有设备均需使用新密码访问</div>
    <div style="text-align:left; margin-bottom:0.8rem;">
      <label class="clash-field-label" style="font-size:0.8rem; display:block; margin-bottom:0.3rem;">原访问密码：</label>
      <input type="password" id="pwdCurrentInput" class="auth-input" style="font-size:0.95rem; padding:0.6rem; letter-spacing:normal;" placeholder="输入当前访问密码">
    </div>
    <div style="text-align:left; margin-bottom:1rem;">
      <label class="clash-field-label" style="font-size:0.8rem; display:block; margin-bottom:0.3rem;">新密码 (至少4位)：</label>
      <input type="password" id="pwdNewInput" class="auth-input" style="font-size:0.95rem; padding:0.6rem; letter-spacing:normal;" placeholder="输入新的访问密码">
    </div>
    <div class="auth-error" id="changePwdErrorMsg"></div>
    <div class="auth-btn-row">
      <button type="button" class="auth-cancel-btn" id="btnCloseChangePwd">取消</button>
      <button type="button" class="auth-submit-btn" id="btnSaveChangePwd">确认修改</button>
    </div>
  </div>
</div>

<div class="container" id="mainAppContainer">
  <!-- Header -->
  <header class="header">
    <div class="header-title">
      <span>⚡</span>
      <span>Clash Verge 云控终端</span>
    </div>
    <div style="display:flex; gap:0.4rem; align-items:center;">
      <button type="button" class="header-action-btn" id="btnOpenChangePwd" title="修改访问密码">🔑 密码</button>
      <button type="button" class="header-action-btn" id="btnLogoutClash" title="退出锁定">🚪 锁定</button>
    </div>
  </header>

  <!-- Navigation Tabs -->
  <nav class="tab-bar">
    <button type="button" class="tab-btn active" data-tab="hub">⚡ 控制中枢</button>
    <button type="button" class="tab-btn" data-tab="speed">🚀 常用测速</button>
    <button type="button" class="tab-btn" data-tab="subs">📋 订阅管理</button>
    <button type="button" class="tab-btn" data-tab="nodes">🌍 全量节点</button>
  </nav>

  <!-- Auth & Status Strip -->
  <section class="status-strip">
    <div class="auth-row" style="display:flex; align-items:center; justify-content:space-between; margin-bottom:0.6rem;">
      <div class="clash-auth-label" style="display:flex; align-items:center; gap:0.4rem; font-weight:700; font-size:0.85rem;">
        <span style="display:inline-block; width:8px; height:8px; border-radius:50%; background:var(--c-success); box-shadow:0 0 8px var(--c-success);"></span>
        <span>已鉴权 (30天免密中)</span>
      </div>
      <div style="display:flex; gap:0.5rem;">
        <button type="button" class="btn clash-secondary-btn" id="btnRefreshStatus" style="padding:0.4rem 0.8rem;">🔄 刷新状态</button>
        <button type="button" class="btn btn-speed" data-cmd="check_delay" style="padding:0.4rem 0.8rem;">⚡ 测速刷新</button>
      </div>
    </div>
    <div id="clashStatusText" style="font-size:0.78rem; color:var(--text-muted); margin-bottom:0.4rem;">正在检测云端连接...</div>
    <div id="pcHbBar" class="pc-hb-bar">💻 电脑状态：检测中...</div>
  </section>

  <!-- Tab 1: 控制中枢 -->
  <main id="tabHub" class="tab-content">
    <div class="card">
      <div class="card-title">🔗 远程添加/更新订阅链接</div>
      <input type="text" id="newSubUrlInput" class="clash-url-input" placeholder="粘贴新机场订阅链接 (https://...)" style="width:100%; border-radius:8px; padding:0.65rem 0.8rem; font-size:0.85rem; margin-bottom:0.75rem; outline:none;">
      <button type="button" id="btnSubmitSub1" class="clash-primary-btn" style="width:100%; border:none; border-radius:8px; padding:0.7rem; font-weight:700; font-size:0.9rem; cursor:pointer;">🚀 极速下发电脑生效</button>
    </div>

    <div class="card">
      <div class="card-title">🌍 常用地区一键切换</div>
      <div style="display:grid; grid-template-columns:1fr 1fr; gap:0.6rem;">
        <button type="button" class="btn clash-secondary-btn" style="padding:0.7rem;" data-cmd="switch_node" data-payload="Singapore">🇸🇬 新加坡节点</button>
        <button type="button" class="btn clash-secondary-btn" style="padding:0.7rem;" data-cmd="switch_node" data-payload="Hong Kong">🇭🇰 香港节点</button>
        <button type="button" class="btn clash-secondary-btn" style="padding:0.7rem;" data-cmd="switch_node" data-payload="Japan">🇯🇵 日本节点</button>
        <button type="button" class="btn clash-accent-btn" style="padding:0.7rem;" data-cmd="switch_node" data-payload="auto_lowest">⚡ 自动选最低延迟</button>
      </div>
    </div>

    <div style="display:flex; gap:0.6rem;">
      <button type="button" class="btn clash-secondary-btn" style="flex:1; padding:0.65rem;" data-cmd="check_delay">📡 快速测速</button>
      <button type="button" class="btn clash-primary-btn" style="flex:1; padding:0.65rem;" data-cmd="sync_all">🔄 同步配置</button>
      <button type="button" class="btn clash-secondary-btn" style="flex:1; padding:0.65rem;" data-cmd="restart">⚙️ 重启内核</button>
    </div>
  </main>

  <!-- Tab 2: 常用测速 -->
  <main id="tabSpeed" class="tab-content" style="display:none;">
    <div class="card">
      <div class="card-title">
        <span>🚀 常用核心地区延迟看板</span>
        <button type="button" class="btn btn-speed" style="padding:0.35rem 0.75rem; font-size:0.78rem;" data-cmd="check_delay">⚡ 测速刷新</button>
      </div>
      <div id="speedListContainer" class="speed-grid">
        <div style="color:var(--text-muted); font-size:0.85rem; padding:2rem 0; text-align:center; grid-column:span 2;">点击刷新状态获取常用测速...</div>
      </div>
    </div>
  </main>

  <!-- Tab 3: 订阅管理 -->
  <main id="tabSubs" class="tab-content" style="display:none;">
    <div class="card">
      <div class="card-title">🔗 在线导入新机场订阅</div>
      <input type="text" id="newSubUrlInput2" class="clash-url-input" placeholder="粘贴新机场订阅链接 (https://...)" style="width:100%; border-radius:8px; padding:0.65rem 0.8rem; font-size:0.85rem; margin-bottom:0.75rem; outline:none;">
      <button type="button" id="btnSubmitSub2" class="clash-primary-btn" style="width:100%; border:none; border-radius:8px; padding:0.7rem; font-weight:700; font-size:0.9rem; cursor:pointer;">🚀 导入并立即切换生效</button>
    </div>

    <div class="card">
      <div class="card-title">
        <span>📋 电脑已配置的所有订阅</span>
        <button type="button" class="btn clash-secondary-btn" style="padding:0.35rem 0.75rem; font-size:0.78rem;" data-cmd="sync_all">🔄 刷新列表</button>
      </div>
      <div id="subsListContainer">
        <div style="color:var(--text-muted); font-size:0.85rem; padding:2rem 0; text-align:center;">暂无订阅数据，正在获取...</div>
      </div>
    </div>
  </main>

  <!-- Tab 4: 全量节点 -->
  <main id="tabNodes" class="tab-content" style="display:none;">
    <div class="card">
      <div class="card-title">
        <span>🌍 按地区分类的全部节点 (点击即换)</span>
        <button type="button" class="btn btn-speed" style="padding:0.35rem 0.75rem; font-size:0.78rem;" data-cmd="check_delay">测速刷新</button>
      </div>
      <div id="nodesListContainer">
        <div style="color:var(--text-muted); font-size:0.85rem; padding:2rem 0; text-align:center;">暂无节点数据，正在获取...</div>
      </div>
    </div>
  </main>

  <!-- Bottom Feedback -->
  <section id="latestFeedback" class="latest-feedback">
    最近指令反馈将显示在这里...
  </section>
</div>

<script type="module" src="/src/pages/clash/main.ts"></script>
</body>
</html>
