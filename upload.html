<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>视频直传管理后台 - Cenj Video Portal</title>
  <link rel="icon" href="./favicon.ico">
  <style>
    :root {
      --bg: #090d16;
      --card-bg: rgba(22, 30, 49, 0.85);
      --card-border: rgba(255, 255, 255, 0.08);
      --primary: #38bdf8;
      --primary-hover: #0ea5e9;
      --text: #f1f5f9;
      --text-muted: #94a3b8;
      --danger: #ef4444;
      --success: #10b981;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      padding: 1rem 1rem 3rem 1rem;
      background-image: 
        radial-gradient(circle at 15% 15%, rgba(56, 189, 248, 0.12) 0%, transparent 40%),
        radial-gradient(circle at 85% 85%, rgba(99, 102, 241, 0.1) 0%, transparent 40%);
    }

    .container {
      max-width: 680px;
      margin: 0 auto;
    }

    /* 顶部导航 */
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 1.5rem;
      padding-bottom: 0.8rem;
      border-bottom: 1px solid var(--card-border);
    }
    .header-title {
      font-size: 1.25rem;
      font-weight: 700;
      color: #fff;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }
    .header-links a {
      color: var(--primary);
      text-decoration: none;
      font-size: 0.9rem;
      padding: 0.35rem 0.75rem;
      border-radius: 0.5rem;
      background: rgba(56, 189, 248, 0.1);
      transition: background 0.2s;
    }

    /* 模式切换 Tabs */
    .tabs {
      display: flex;
      gap: 0.5rem;
      background: rgba(15, 23, 42, 0.6);
      padding: 0.3rem;
      border-radius: 0.75rem;
      margin-bottom: 1.5rem;
      border: 1px solid var(--card-border);
    }
    .tab-btn {
      flex: 1;
      padding: 0.65rem 0;
      font-size: 0.92rem;
      font-weight: 600;
      color: var(--text-muted);
      background: none;
      border: none;
      border-radius: 0.5rem;
      cursor: pointer;
      transition: all 0.2s;
    }
    .tab-btn.active {
      color: #fff;
      background: rgba(56, 189, 248, 0.2);
      box-shadow: 0 2px 8px rgba(0,0,0,0.3);
    }

    /* 卡片通用样式 */
    .card {
      background: var(--card-bg);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid var(--card-border);
      border-radius: 1rem;
      padding: 1.5rem;
      margin-bottom: 1.5rem;
      box-shadow: 0 10px 30px -10px rgba(0,0,0,0.5);
    }

    /* 表单控件 */
    .form-group {
      margin-bottom: 1.2rem;
    }
    .form-label {
      display: block;
      font-size: 0.88rem;
      font-weight: 600;
      margin-bottom: 0.4rem;
      color: #e2e8f0;
    }
    .form-hint {
      font-size: 0.78rem;
      color: var(--text-muted);
      margin-top: 0.25rem;
    }
    .input-control {
      width: 100%;
      padding: 0.8rem 1rem;
      background: rgba(15, 23, 42, 0.7);
      border: 1px solid var(--card-border);
      border-radius: 0.6rem;
      color: #fff;
      font-size: 0.95rem;
      outline: none;
      transition: border 0.2s, box-shadow 0.2s;
    }
    .input-control:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(56, 189, 248, 0.2);
    }

    /* 文件选择器区域 */
    .upload-zone {
      border: 2px dashed rgba(56, 189, 248, 0.4);
      border-radius: 0.85rem;
      padding: 2rem 1rem;
      text-align: center;
      cursor: pointer;
      background: rgba(56, 189, 248, 0.04);
      transition: all 0.2s;
      position: relative;
    }
    .upload-zone:active, .upload-zone.dragover {
      border-color: var(--primary);
      background: rgba(56, 189, 248, 0.1);
    }
    .upload-zone input[type="file"] {
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      opacity: 0;
      cursor: pointer;
    }
    .upload-zone-icon {
      font-size: 2.5rem;
      margin-bottom: 0.5rem;
    }
    .upload-zone-text {
      font-size: 1rem;
      font-weight: 600;
      color: #fff;
    }

    /* 视频信息预览栏 */
    .video-preview-box {
      display: none;
      gap: 1rem;
      background: rgba(15, 23, 42, 0.8);
      border-radius: 0.75rem;
      padding: 0.8rem;
      margin-top: 1rem;
      border: 1px solid var(--card-border);
      align-items: center;
    }
    .preview-thumbnail {
      width: 100px;
      height: 65px;
      object-fit: cover;
      border-radius: 0.4rem;
      background: #000;
      border: 1px solid rgba(255,255,255,0.1);
    }
    .preview-details {
      flex: 1;
      font-size: 0.82rem;
      line-height: 1.5;
      color: var(--text-muted);
    }
    .preview-details strong {
      color: #fff;
      font-size: 0.92rem;
      display: block;
      margin-bottom: 0.2rem;
      word-break: break-all;
    }

    /* 上传进度条 */
    .progress-box {
      display: none;
      margin-top: 1.2rem;
      background: rgba(15, 23, 42, 0.7);
      padding: 1rem;
      border-radius: 0.75rem;
      border: 1px solid var(--card-border);
    }
    .progress-bar-bg {
      height: 10px;
      background: rgba(255, 255, 255, 0.1);
      border-radius: 5px;
      overflow: hidden;
      margin: 0.5rem 0;
    }
    .progress-bar-fill {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, #0284c7, #38bdf8);
      border-radius: 5px;
      transition: width 0.15s ease;
    }
    .progress-meta {
      display: flex;
      justify-content: space-between;
      font-size: 0.78rem;
      color: var(--text-muted);
    }

    /* 提交按钮 */
    .submit-btn {
      width: 100%;
      padding: 0.9rem;
      background: linear-gradient(135deg, #0284c7, #2563eb);
      color: #fff;
      border: none;
      border-radius: 0.75rem;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      box-shadow: 0 4px 15px rgba(2, 132, 199, 0.4);
      transition: opacity 0.2s, transform 0.1s;
    }
    .submit-btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
      box-shadow: none;
    }
    .submit-btn:active:not(:disabled) {
      transform: scale(0.98);
    }

    /* 视频列表管理视图 */
    .video-item {
      display: flex;
      gap: 1rem;
      padding: 1rem 0;
      border-bottom: 1px solid var(--card-border);
      align-items: center;
    }
    .video-item:last-child {
      border-bottom: none;
    }
    .video-item-thumb {
      width: 90px;
      height: 60px;
      border-radius: 0.4rem;
      object-fit: cover;
      background: #000;
    }
    .video-item-info {
      flex: 1;
      min-width: 0;
    }
    .video-item-title {
      font-size: 0.95rem;
      font-weight: 600;
      color: #fff;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      margin-bottom: 0.2rem;
    }
    .video-item-sub {
      font-size: 0.78rem;
      color: var(--text-muted);
    }
    .video-item-actions {
      display: flex;
      gap: 0.4rem;
    }
    .action-btn {
      padding: 0.4rem 0.7rem;
      border-radius: 0.4rem;
      font-size: 0.78rem;
      border: none;
      cursor: pointer;
      font-weight: 600;
    }
    .action-btn.del {
      background: rgba(239, 68, 68, 0.2);
      color: #f87171;
    }
    .action-btn.play {
      background: rgba(56, 189, 248, 0.2);
      color: var(--primary);
      text-decoration: none;
    }

    /* 鉴权弹窗 */
    .auth-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.85);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
      z-index: 1000;
    }
    .auth-modal {
      background: #1e293b;
      border: 1px solid var(--card-border);
      border-radius: 1rem;
      padding: 2rem 1.5rem;
      width: 100%;
      max-width: 380px;
      text-align: center;
      box-shadow: 0 20px 25px -5px rgba(0,0,0,0.5);
    }
    .auth-title {
      font-size: 1.3rem;
      font-weight: 700;
      margin-bottom: 0.5rem;
      color: #fff;
    }
    .auth-desc {
      font-size: 0.85rem;
      color: var(--text-muted);
      margin-bottom: 1.5rem;
    }
  </style>
</head>
<body>

  <!-- 密码保护遮罩 -->
  <div class="auth-overlay" id="authModal">
    <div class="auth-modal">
      <div style="font-size: 2.5rem; margin-bottom: 0.5rem;">🔐</div>
      <div class="auth-title">视频管理后台</div>
      <div class="auth-desc">请输入管理员独立密码（初始默认：8888）</div>
      <input type="password" id="authPassword" class="input-control" placeholder="输入访问密码" style="text-align: center; font-size: 1.2rem; letter-spacing: 2px; margin-bottom: 1rem;">
      <button class="submit-btn" onclick="checkAuth()">解锁管理 🚀</button>
    </div>
  </div>

  <div class="container">
    <div class="header">
      <div class="header-title">
        <span>🎬</span>
        <span>视频管理与直传</span>
      </div>
      <div class="header-links">
        <a href="./gallery.html">画廊主页 &rarr;</a>
      </div>
    </div>

    <!-- 模式选项卡 -->
    <div class="tabs">
      <button class="tab-btn active" id="tabUploadBtn" onclick="switchTab('upload')">📤 手机相册直传</button>
      <button class="tab-btn" id="tabDirectBtn" onclick="switchTab('direct')">🔗 直链/外链收录</button>
      <button class="tab-btn" id="tabManageBtn" onclick="switchTab('manage')">📋 已有视频列表</button>
    </div>

    <!-- TAB 1: 手机相册直接上传 -->
    <div id="tabUpload" class="tab-pane">
      <div class="card">
        <div class="form-group">
          <label class="form-label">1. 从手机挑选视频 (支持 50MB ~ 2GB)</label>
          <div class="upload-zone" id="uploadZone">
            <input type="file" id="videoFileInput" accept="video/mp4,video/quicktime,video/mov,video/*" onchange="handleFileSelect(event)">
            <div class="upload-zone-icon">📁</div>
            <div class="upload-zone-text" id="uploadZoneText">点击从手机相册挑选视频</div>
            <div class="form-hint">支持 MP4, MOV 格式，浏览器将自动捕获高清封面</div>
          </div>

          <!-- 抽帧信息预览 -->
          <div class="video-preview-box" id="previewBox">
            <img id="previewImg" class="preview-thumbnail" src="" alt="视频封面">
            <div class="preview-details">
              <strong id="previewFileName">视频文件名</strong>
              <div>时长: <span id="previewDuration" style="color: var(--primary);">00:00</span></div>
              <div>体积: <span id="previewFileSize">0 MB</span></div>
            </div>
          </div>
        </div>

        <div class="form-group">
          <label class="form-label">2. 视频标题与备注</label>
          <input type="text" id="uploadTitle" class="input-control" placeholder="例：大疆无人机海边日落航拍 4K">
        </div>

        <div class="form-group">
          <label class="form-label">3. GitHub 访问令牌 (首次填入自动保存)</label>
          <input type="password" id="ghToken" class="input-control" placeholder="ghp_xxxxxxxxxxxx (只需填一次)">
          <div class="form-hint">用于直传 GitHub 2GB Releases 资产库，仅保存在手机本机，绝不外泄。</div>
        </div>

        <!-- 进度条 -->
        <div class="progress-box" id="progressBox">
          <div class="progress-meta">
            <span id="progressStatus">正在准备上传...</span>
            <span id="progressPercent">0%</span>
          </div>
          <div class="progress-bar-bg">
            <div class="progress-bar-fill" id="progressBar"></div>
          </div>
          <div class="progress-meta">
            <span id="progressSpeed">0 KB/s</span>
            <span id="progressTransferred">0 MB / 0 MB</span>
          </div>
        </div>

        <button class="submit-btn" id="startUploadBtn" onclick="startDirectUpload()" style="margin-top: 1rem;">开始直传并发布 🚀</button>
      </div>
    </div>

    <!-- TAB 2: 直链录入 -->
    <div id="tabDirect" class="tab-pane" style="display: none;">
      <div class="card">
        <div class="form-group">
          <label class="form-label">视频标题</label>
          <input type="text" id="directTitle" class="input-control" placeholder="例：城市夜景延时摄影">
        </div>
        <div class="form-group">
          <label class="form-label">视频原始直链 (URL)</label>
          <input type="url" id="directAssetUrl" class="input-control" placeholder="https://github.com/.../video.mp4 或 123云盘直链">
          <div class="form-hint">直接下载/播放地址，系统将自动提供 HTTP Range 断点续传加速代理。</div>
        </div>
        <div class="form-group">
          <label class="form-label">视频封面图片地址</label>
          <input type="url" id="directPosterUrl" class="input-control" placeholder="https://web-cenj-photos.pages.dev/p/...webp 或留空">
        </div>
        <div class="form-group" style="display: flex; gap: 0.8rem;">
          <div style="flex: 1;">
            <label class="form-label">视频时长 (秒)</label>
            <input type="number" id="directDuration" class="input-control" placeholder="例：180">
          </div>
          <div style="flex: 1;">
            <label class="form-label">文件体积 (MB)</label>
            <input type="number" id="directSize" class="input-control" placeholder="例：450">
          </div>
        </div>
        <button class="submit-btn" onclick="submitDirectVideo()">立即收录到画廊 ✨</button>
      </div>
    </div>

    <!-- TAB 3: 已上架管理 -->
    <div id="tabManage" class="tab-pane" style="display: none;">
      <div class="card">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1rem;">
          <strong style="color: #fff; font-size: 1rem;">已上架视频清单 (<span id="manageCount">0</span>)</strong>
          <button class="action-btn play" onclick="loadManageVideos()">刷新列表 🔄</button>
        </div>
        <div id="manageList">
          <div style="text-align: center; color: var(--text-muted); padding: 2rem;">加载中...</div>
        </div>
      </div>
    </div>
  </div>

  <script>
    const AUTH_KEY = 'cenj_video_auth_pwd';
    const GH_TOKEN_KEY = 'cenj_video_gh_token';
    const GH_REPO = 'chn-youbai/web-cenj-videos'; // 专属大文件视频资产仓

    let adminPassword = localStorage.getItem(AUTH_KEY) || '';
    let selectedFile = null;
    let extractedPosterBlob = null;
    let extractedPosterDataUrl = '';
    let extractedDuration = 0;

    // 初始化密码与 Token
    if (adminPassword === '8888') {
      document.getElementById('authModal').style.display = 'none';
    }
    const savedToken = localStorage.getItem(GH_TOKEN_KEY);
    if (savedToken) {
      document.getElementById('ghToken').value = savedToken;
    }

    function checkAuth() {
      const pwd = document.getElementById('authPassword').value.trim();
      if (pwd === '8888') {
        adminPassword = pwd;
        localStorage.setItem(AUTH_KEY, pwd);
        document.getElementById('authModal').style.display = 'none';
      } else {
        alert('密码错误，请重新输入');
      }
    }

    function switchTab(name) {
      document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
      document.querySelectorAll('.tab-pane').forEach(p => p.style.display = 'none');

      if (name === 'upload') {
        document.getElementById('tabUploadBtn').classList.add('active');
        document.getElementById('tabUpload').style.display = 'block';
      } else if (name === 'direct') {
        document.getElementById('tabDirectBtn').classList.add('active');
        document.getElementById('tabDirect').style.display = 'block';
      } else if (name === 'manage') {
        document.getElementById('tabManageBtn').classList.add('active');
        document.getElementById('tabManage').style.display = 'block';
        loadManageVideos();
      }
    }

    // 格式化时长 (秒 -> 03:45)
    function formatDuration(sec) {
      sec = Math.round(sec);
      const m = Math.floor(sec / 60);
      const s = sec % 60;
      return `${m < 10 ? '0' : ''}${m}:${s < 10 ? '0' : ''}${s}`;
    }

    // 格式化体积
    function formatBytes(bytes) {
      if (!bytes || bytes === 0) return '0 MB';
      const mb = bytes / (1024 * 1024);
      if (mb >= 1000) return (mb / 1024).toFixed(2) + ' GB';
      return mb.toFixed(1) + ' MB';
    }

    // 选择手机视频时本地抽帧
    async function handleFileSelect(event) {
      const file = event.target.files[0];
      if (!file) return;

      selectedFile = file;
      document.getElementById('uploadZoneText').textContent = file.name;
      document.getElementById('uploadTitle').value = file.name.replace(/\.[^/.]+$/, "");

      document.getElementById('previewBox').style.display = 'flex';
      document.getElementById('previewFileName').textContent = file.name;
      document.getElementById('previewFileSize').textContent = formatBytes(file.size);
      document.getElementById('previewDuration').textContent = '计算中...';

      // 本地抽帧
      try {
        const v = document.createElement('video');
        v.preload = 'metadata';
        v.muted = true;
        v.playsInline = true;
        v.src = URL.createObjectURL(file);

        v.onloadedmetadata = () => {
          extractedDuration = Math.round(v.duration);
          document.getElementById('previewDuration').textContent = formatDuration(extractedDuration);
          v.currentTime = Math.min(1.0, v.duration / 2);
        };

        v.onseeked = () => {
          const canvas = document.createElement('canvas');
          const maxDim = 1280;
          let w = v.videoWidth;
          let h = v.videoHeight;
          if (w > maxDim || h > maxDim) {
            const scale = maxDim / Math.max(w, h);
            w = Math.round(w * scale);
            h = Math.round(h * scale);
          }
          canvas.width = w;
          canvas.height = h;
          canvas.getContext('2d').drawImage(v, 0, 0, w, h);

          extractedPosterDataUrl = canvas.toDataURL('image/jpeg', 0.85);
          document.getElementById('previewImg').src = extractedPosterDataUrl;

          canvas.toBlob((blob) => {
            extractedPosterBlob = blob;
          }, 'image/jpeg', 0.85);
        };
      } catch (err) {
        console.warn('本地抽帧失败:', err);
      }
    }

    // 开始手机直传 GitHub Releases
    async function startDirectUpload() {
      if (!selectedFile) {
        alert('请先选择手机视频文件');
        return;
      }
      const title = document.getElementById('uploadTitle').value.trim();
      if (!title) {
        alert('请输入视频标题');
        return;
      }
      const token = document.getElementById('ghToken').value.trim();
      if (!token) {
        alert('请填写 GitHub 访问令牌以授权直传');
        return;
      }
      localStorage.setItem(GH_TOKEN_KEY, token);

      const startBtn = document.getElementById('startUploadBtn');
      startBtn.disabled = true;
      const progressBox = document.getElementById('progressBox');
      const progressBar = document.getElementById('progressBar');
      const progressStatus = document.getElementById('progressStatus');
      const progressPercent = document.getElementById('progressPercent');
      const progressSpeed = document.getElementById('progressSpeed');
      const progressTransferred = document.getElementById('progressTransferred');
      progressBox.style.display = 'block';

      try {
        progressStatus.textContent = '1/3 获取或创建 Release 容器...';
        const tag = 'v_media';
        
        // 查找或创建 release
        let releaseResp = await fetch(`https://api.github.com/repos/${GH_REPO}/releases/tags/${tag}`, {
          headers: { 'Authorization': `Bearer ${token}`, 'Accept': 'application/vnd.github.v3+json' }
        });

        let uploadUrl = '';
        if (releaseResp.status === 404) {
          // 创建 release
          const createResp = await fetch(`https://api.github.com/repos/${GH_REPO}/releases`, {
            method: 'POST',
            headers: { 'Authorization': `Bearer ${token}`, 'Content-Type': 'application/json' },
            body: JSON.stringify({ tag_name: tag, name: 'Cenj Video Assets', draft: false, prerelease: false })
          });
          const createData = await createResp.json();
          uploadUrl = createData.upload_url;
        } else if (releaseResp.ok) {
          const relData = await releaseResp.json();
          uploadUrl = relData.upload_url;
        } else {
          throw new Error('访问 GitHub API 失败，请检查 Token 权限');
        }

        // 提取真正的 upload endpoint
        const targetUploadUrl = uploadUrl.replace('{?name,label}', `?name=${encodeURIComponent(selectedFile.name)}`);

        progressStatus.textContent = '2/3 正在直传视频 (0%)...';

        // 借助 XHR 监控上传速率与进度
        await new Promise((resolve, reject) => {
          const xhr = new XMLHttpRequest();
          xhr.open('POST', targetUploadUrl, true);
          xhr.setRequestHeader('Authorization', `Bearer ${token}`);
          xhr.setRequestHeader('Content-Type', selectedFile.type || 'application/octet-stream');

          let lastTime = Date.now();
          let lastLoaded = 0;

          xhr.upload.onprogress = (e) => {
            if (e.lengthComputable) {
              const percent = Math.round((e.loaded / e.total) * 100);
              progressBar.style.width = percent + '%';
              progressPercent.textContent = percent + '%';
              progressTransferred.textContent = `${formatBytes(e.loaded)} / ${formatBytes(e.total)}`;

              const now = Date.now();
              const dt = (now - lastTime) / 1000;
              if (dt >= 0.5) {
                const speedBps = (e.loaded - lastLoaded) / dt;
                progressSpeed.textContent = (speedBps / (1024 * 1024)).toFixed(1) + ' MB/s';
                lastTime = now;
                lastLoaded = e.loaded;
              }
            }
          };

          xhr.onload = () => {
            if (xhr.status >= 200 && xhr.status < 300) {
              const resp = JSON.parse(xhr.responseText);
              resolve(resp.browser_download_url);
            } else {
              reject(new Error(`上传失败 (状态码: ${xhr.status})`));
            }
          };

          xhr.onerror = () => reject(new Error('网络连接中断'));
          xhr.send(selectedFile);
        }).then(async (assetDownloadUrl) => {
          progressStatus.textContent = '3/3 写入 D1 数据库...';

          // 写入 D1 数据库
          const saveResp = await fetch('/api/videos', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json', 'X-Admin-Password': adminPassword },
            body: JSON.stringify({
              title: title,
              asset_url: assetDownloadUrl,
              poster_url: extractedPosterDataUrl || '',
              duration: extractedDuration,
              file_size: selectedFile.size,
              password: adminPassword
            })
          });

          if (!saveResp.ok) throw new Error('写入 D1 数据库失败');

          alert('🎉 视频直传发布成功！画廊专区已即刻上线。');
          location.href = './gallery.html';
        });

      } catch (err) {
        alert('上传出错: ' + err.message);
      } finally {
        startBtn.disabled = false;
      }
    }

    // 直链快速收录
    async function submitDirectVideo() {
      const title = document.getElementById('directTitle').value.trim();
      const assetUrl = document.getElementById('directAssetUrl').value.trim();
      const posterUrl = document.getElementById('directPosterUrl').value.trim();
      const duration = parseInt(document.getElementById('directDuration').value || '0', 10);
      const sizeMb = parseFloat(document.getElementById('directSize').value || '0');

      if (!title || !assetUrl) {
        alert('请至少填写视频标题和视频直链');
        return;
      }

      try {
        const res = await fetch('/api/videos', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json', 'X-Admin-Password': adminPassword },
          body: JSON.stringify({
            title: title,
            asset_url: assetUrl,
            poster_url: posterUrl,
            duration: duration,
            file_size: Math.round(sizeMb * 1024 * 1024),
            password: adminPassword
          })
        });

        const data = await res.json();
        if (res.ok && data.status === 'ok') {
          alert('✅ 视频收录成功！');
          document.getElementById('directTitle').value = '';
          document.getElementById('directAssetUrl').value = '';
          switchTab('manage');
        } else {
          alert('收录失败: ' + (data.message || '未知错误'));
        }
      } catch (e) {
        alert('提交出错: ' + e.message);
      }
    }

    // 加载已有视频列表
    async function loadManageVideos() {
      const box = document.getElementById('manageList');
      box.innerHTML = '<div style="text-align:center; color: var(--text-muted); padding: 1.5rem;">加载中...</div>';

      try {
        const res = await fetch('/api/videos?t=' + Date.now());
        const data = await res.json();
        const list = data.videos || [];
        document.getElementById('manageCount').textContent = list.length;

        if (list.length === 0) {
          box.innerHTML = '<div style="text-align:center; color: var(--text-muted); padding: 2rem;">暂未上传任何视频，点击上方“手机相册直传”开始添加</div>';
          return;
        }

        box.innerHTML = list.map(v => `
          <div class="video-item">
            <img class="video-item-thumb" src="${v.poster_url || './favicon.ico'}" alt="封面">
            <div class="video-item-info">
              <div class="video-item-title">${v.title}</div>
              <div class="video-item-sub">时长: ${formatDuration(v.duration)} · 体积: ${formatBytes(v.file_size)}</div>
            </div>
            <div class="video-item-actions">
              <a href="/api/video?id=${v.id}" target="_blank" class="action-btn play">播放</a>
              <button class="action-btn del" onclick="deleteVideo('${v.id}')">删除</button>
            </div>
          </div>
        `).join('');
      } catch (err) {
        box.innerHTML = '<div style="text-align:center; color:#f87171; padding: 1.5rem;">加载失败: ' + err.message + '</div>';
      }
    }

    // 删除视频
    async function deleteVideo(id) {
      if (!confirm('确定从画廊专区下架该视频吗？')) return;
      try {
        const res = await fetch(`/api/videos?id=${id}&password=${adminPassword}`, {
          method: 'DELETE',
          headers: { 'X-Admin-Password': adminPassword }
        });
        if (res.ok) {
          loadManageVideos();
        } else {
          alert('删除失败');
        }
      } catch (e) {
        alert('删除出错: ' + e.message);
      }
    }
  </script>
</body>
