<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>神秘小网站</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      background: radial-gradient(circle at 50% 25%, #1e293b, #0f172a);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      color: #f8fafc;
      padding: 1.5rem;
    }
    .card {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      padding: 2.5rem 3.2rem;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 28px;
      backdrop-filter: blur(20px);
      box-shadow: 0 25px 60px -15px rgba(0, 0, 0, 0.6);
      animation: float 4s ease-in-out infinite alternate;
      max-width: 580px;
      width: 100%;
    }
    @keyframes float {
      0% { transform: translateY(0px); }
      100% { transform: translateY(-8px); }
    }
    .avatar-row {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 1.2rem;
      margin-bottom: 1.5rem;
      width: 100%;
    }
    .avatar-item {
      position: relative;
      border-radius: 20px;
      overflow: hidden;
      width: 130px;
      height: 130px;
      flex-shrink: 0;
      box-shadow: 0 12px 30px rgba(0, 0, 0, 0.4);
      border: 2px solid rgba(255, 255, 255, 0.16);
      transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1), border-color 0.3s ease, box-shadow 0.3s ease;
    }
    .avatar-item:hover {
      transform: translateY(-4px) scale(1.05);
      border-color: rgba(56, 189, 248, 0.6);
      box-shadow: 0 16px 36px rgba(0, 0, 0, 0.55);
    }
    .avatar-img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }
    h1 {
      font-size: 3.8rem;
      font-weight: 800;
      letter-spacing: 0.1em;
      background: linear-gradient(135deg, #00dfd8, #007cf0, #7928ca);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 0.6rem;
    }
    p {
      color: #94a3b8;
      font-size: 1.1rem;
      margin-bottom: 1.2rem;
    }
    .badge {
      display: inline-flex;
      align-items: center;
      gap: 0.6rem;
      padding: 0.45rem 1.1rem;
      border-radius: 9999px;
      background: rgba(0, 124, 240, 0.15);
      color: #38bdf8;
      font-size: 0.85rem;
      font-weight: 600;
      border: 1px solid rgba(0, 124, 240, 0.3);
      margin-bottom: 0.5rem;
    }
    .dot {
      width: 8px;
      height: 8px;
      background-color: #00dfd8;
      border-radius: 50%;
      box-shadow: 0 0 10px #00dfd8;
    }
    .btn-group {
      display: flex;
      flex-direction: column;
      gap: 0.9rem;
      width: 100%;
      margin-top: 1.4rem;
    }
    .gallery-btn, .pan-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.6rem;
      padding: 0.85rem 1.8rem;
      border-radius: 9999px;
      color: #ffffff;
      font-size: 1rem;
      font-weight: 700;
      text-decoration: none;
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }
    .gallery-btn {
      background: linear-gradient(135deg, #007cf0, #00dfd8);
      box-shadow: 0 10px 25px rgba(0, 124, 240, 0.35);
    }
    .gallery-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 15px 30px rgba(0, 223, 216, 0.45);
      color: #ffffff;
    }
    .pan-btn {
      background: linear-gradient(135deg, #f59e0b, #ea580c);
      box-shadow: 0 10px 25px rgba(245, 158, 11, 0.35);
    }
    .pan-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 15px 30px rgba(234, 88, 12, 0.45);
      color: #ffffff;
    }
    @media (max-width: 480px) {
      .card {
        padding: 2rem 1.2rem;
      }
      .avatar-item {
        width: 90px;
        height: 90px;
        border-radius: 16px;
      }
      .avatar-row {
        gap: 0.6rem;
      }
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="avatar-row">
      <div class="avatar-item">
        <img src="./left_avatar.png" alt="图片1" class="avatar-img">
      </div>
      <div class="avatar-item">
        <img src="./OIP-C.jpg" alt="展示图片" class="avatar-img">
      </div>
      <div class="avatar-item">
        <img src="./right_avatar.jpg" alt="图片2" class="avatar-img">
      </div>
    </div>
    <h1>你好</h1>


    <!-- 快捷功能入口按钮组 -->
    <div class="btn-group">
      <a href="./gallery.html" class="gallery-btn">
        <span>🖼️ 查看精选图库</span>
        <span style="font-size: 0.85em; opacity: 0.9;">(23张) →</span>
      </a>
      <a href="./pan.html" class="pan-btn">
        <span>📁 资源网盘下载</span>
        <span style="font-size: 0.85em; opacity: 0.9;">(100MB极速) →</span>
      </a>
    </div>
  </div>
</body>
</html>
