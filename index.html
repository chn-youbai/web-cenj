<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>神秘小网站</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      background: radial-gradient(circle at 50% 25%, #0f172a, #030712);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      color: #f8fafc;
      padding: 1.5rem;
      overflow-x: hidden;
      perspective: 1000px;
      position: relative;
    }
    /* 反重力动态粒子全屏画布 */
    #gravityCanvas {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 1;
    }
    /* 鼠标交互聚光灯背景光晕 */
    .mouse-glow {
      position: fixed;
      width: 600px;
      height: 600px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(56, 189, 248, 0.12) 0%, rgba(139, 92, 246, 0.05) 45%, transparent 70%);
      pointer-events: none;
      transform: translate(-50%, -50%);
      z-index: 1;
      transition: opacity 0.3s ease;
      will-change: transform;
    }
    .card {
      position: relative;
      z-index: 10;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      padding: 2.5rem 3.2rem;
      background: rgba(15, 23, 42, 0.65);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 28px;
      backdrop-filter: blur(25px);
      box-shadow: 0 25px 60px -15px rgba(0, 0, 0, 0.7), 0 0 40px rgba(56, 189, 248, 0.08);
      max-width: 580px;
      width: 100%;
      transform-style: preserve-3d;
      transition: transform 0.15s ease-out, box-shadow 0.3s ease;
      will-change: transform;
    }
    .avatar-row {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 1.2rem;
      margin-bottom: 1.5rem;
      width: 100%;
    }
    .avatar-item {
      position: relative;
      border-radius: 20px;
      overflow: hidden;
      width: 130px;
      height: 130px;
      flex-shrink: 0;
      box-shadow: 0 12px 30px rgba(0, 0, 0, 0.4);
      border: 2px solid rgba(255, 255, 255, 0.16);
      transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1), border-color 0.3s ease, box-shadow 0.3s ease;
    }
    .avatar-item:hover {
      transform: translateY(-4px) scale(1.05);
      border-color: rgba(56, 189, 248, 0.6);
      box-shadow: 0 16px 36px rgba(0, 0, 0, 0.55);
    }
    .avatar-img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }
    h1 {
      font-size: 3.8rem;
      font-weight: 800;
      letter-spacing: 0.1em;
      background: linear-gradient(135deg, #00dfd8, #007cf0, #7928ca);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 0.6rem;
    }
    p {
      color: #94a3b8;
      font-size: 1.1rem;
      margin-bottom: 1.2rem;
    }
    .badge {
      display: inline-flex;
      align-items: center;
      gap: 0.6rem;
      padding: 0.45rem 1.1rem;
      border-radius: 9999px;
      background: rgba(0, 124, 240, 0.15);
      color: #38bdf8;
      font-size: 0.85rem;
      font-weight: 600;
      border: 1px solid rgba(0, 124, 240, 0.3);
      margin-bottom: 0.5rem;
    }
    .dot {
      width: 8px;
      height: 8px;
      background-color: #00dfd8;
      border-radius: 50%;
      box-shadow: 0 0 10px #00dfd8;
    }
    .btn-group {
      display: flex;
      flex-direction: column;
      gap: 0.9rem;
      width: 100%;
      margin-top: 1.4rem;
    }
    .gallery-btn, .pan-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.6rem;
      padding: 0.85rem 1.8rem;
      border-radius: 9999px;
      color: #ffffff;
      font-size: 1rem;
      font-weight: 700;
      text-decoration: none;
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }
    .gallery-btn {
      background: linear-gradient(135deg, #007cf0, #00dfd8);
      box-shadow: 0 10px 25px rgba(0, 124, 240, 0.35);
    }
    .gallery-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 15px 30px rgba(0, 223, 216, 0.45);
      color: #ffffff;
    }
    .pan-btn {
      background: linear-gradient(135deg, #f59e0b, #ea580c);
      box-shadow: 0 10px 25px rgba(245, 158, 11, 0.35);
    }
    .pan-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 15px 30px rgba(234, 88, 12, 0.45);
      color: #ffffff;
    }
    /* 点赞互动按钮 */
    .like-btn {
      position: relative;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.65rem;
      padding: 0.85rem 1.8rem;
      border-radius: 9999px;
      background: linear-gradient(135deg, #ec4899, #8b5cf6, #3b82f6);
      background-size: 200% 200%;
      color: #ffffff;
      font-size: 1rem;
      font-weight: 700;
      border: none;
      cursor: pointer;
      box-shadow: 0 10px 25px rgba(236, 72, 153, 0.35);
      transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
      user-select: none;
      -webkit-tap-highlight-color: transparent;
      outline: none;
      overflow: visible;
    }
    .like-btn:hover {
      transform: translateY(-2px) scale(1.02);
      box-shadow: 0 15px 32px rgba(236, 72, 153, 0.5);
    }
    .like-btn:active {
      transform: scale(0.95);
    }
    .like-btn.burst {
      animation: heartBeat 0.45s ease-in-out;
    }
    .like-icon {
      font-size: 1.25rem;
      display: inline-block;
      transition: transform 0.25s ease;
    }
    .like-btn.burst .like-icon {
      transform: scale(1.4) rotate(-15deg);
    }
    .like-badge {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 38px;
      padding: 0.2rem 0.65rem;
      border-radius: 9999px;
      background: rgba(0, 0, 0, 0.28);
      border: 1px solid rgba(255, 255, 255, 0.25);
      font-size: 0.9rem;
      font-weight: 800;
      color: #ffffff;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      letter-spacing: 0.03em;
    }
    /* 浮动飞出动画气泡 */
    .float-particle {
      position: absolute;
      pointer-events: none;
      font-size: 1.3rem;
      animation: floatUpFade 0.85s cubic-bezier(0.22, 1, 0.36, 1) forwards;
      z-index: 50;
      user-select: none;
    }
    @keyframes heartBeat {
      0% { transform: scale(1); }
      30% { transform: scale(1.12); }
      50% { transform: scale(0.97); }
      75% { transform: scale(1.05); }
      100% { transform: scale(1); }
    }
    @keyframes floatUpFade {
      0% {
        opacity: 1;
        transform: translate(0, 0) scale(0.8) rotate(0deg);
      }
      50% {
        opacity: 0.9;
        transform: translate(var(--tx, 0px), -45px) scale(1.3) rotate(var(--rot, 0deg));
      }
      100% {
        opacity: 0;
        transform: translate(var(--tx, 0px), -85px) scale(1) rotate(var(--rot, 0deg));
      }
    }
    @media (max-width: 480px) {
      .card {
        padding: 2rem 1.2rem;
      }
      .avatar-item {
        width: 90px;
        height: 90px;
        border-radius: 16px;
      }
      .avatar-row {
        gap: 0.6rem;
      }
    }
  </style>
</head>
<body>
  <!-- 反重力动态粒子全屏交互画布 -->
  <canvas id="gravityCanvas"></canvas>
  <!-- 鼠标交互光晕 -->
  <div class="mouse-glow" id="mouseGlow"></div>

  <div class="card" id="tiltCard">
    <div class="avatar-row">
      <div class="avatar-item">
        <img src="./left_avatar.png" alt="图片1" class="avatar-img">
      </div>
      <div class="avatar-item">
        <img src="./OIP-C.jpg" alt="展示图片" class="avatar-img">
      </div>
      <div class="avatar-item">
        <img src="./right_avatar.jpg" alt="图片2" class="avatar-img">
      </div>
    </div>
    <h1>你好</h1>


    <!-- 快捷功能入口按钮组 -->
    <div class="btn-group">
      <!-- 全网云端同步互动点赞按钮 -->
      <button class="like-btn" id="likeBtn" onclick="handleClick(event)">
        <span class="like-icon" id="likeIcon">💖</span>
        <span>为网站点赞</span>
        <span class="like-badge" id="likeCount">...</span>
      </button>

      <a href="./gallery.html" class="gallery-btn">
        <span>🖼️ 查看精选图库</span>
        <span style="font-size: 0.85em; opacity: 0.9;">(23张) →</span>
      </a>
      <a href="./pan.html" class="pan-btn">
        <span>📁 资源网盘下载</span>
        <span style="font-size: 0.85em; opacity: 0.9;">(100MB极速) →</span>
      </a>
    </div>
  </div>

  <script>
    // 计数器配置：优先调用 Cloudflare Pages 原生私有后端 /api/click，降级支持公共 API
    const LOCAL_API = '/api/click';
    const FALLBACK_API_BASE = 'https://countapi.mileshilliard.com/api/v1';
    const FALLBACK_KEY = 'web_cenj_shared_clicks_v1';

    const countEl = document.getElementById('likeCount');
    const likeBtn = document.getElementById('likeBtn');
    const likeIcon = document.getElementById('likeIcon');

    let currentVal = 0;
    const icons = ['💖', '🎉', '✨', '🔥', '👏', '🌟', '🚀', '💯'];

    // 格式化数字
    function formatCount(num) {
      return Number(num).toLocaleString();
    }

    // 初始化获取云端最新计次
    async function initCount() {
      try {
        const res = await fetch(`${LOCAL_API}?t=${Date.now()}`, { cache: 'no-store' });
        if (res.ok) {
          const data = await res.json();
          if (data && typeof data.value === 'number') {
            currentVal = data.value;
            countEl.textContent = formatCount(currentVal);
            return;
          }
        }
      } catch (e) {}

      // 备用降级逻辑
      try {
        const res = await fetch(`${FALLBACK_API_BASE}/get/${FALLBACK_KEY}?t=${Date.now()}`, { cache: 'no-store' });
        if (res.ok) {
          const data = await res.json();
          currentVal = data.value || 0;
          countEl.textContent = formatCount(currentVal);
        } else {
          countEl.textContent = '0';
        }
      } catch (err) {
        countEl.textContent = currentVal || '0';
      }
    }

    // 批量同步队列：防止快速连点丢失
    let pendingClicks = 0;
    let syncTimer = null;
    let isSyncing = false;

    async function flushClicks() {
      if (pendingClicks <= 0 || isSyncing) return;
      const countToSend = pendingClicks;
      pendingClicks = 0;
      isSyncing = true;

      try {
        const res = await fetch(LOCAL_API, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ amount: countToSend }),
          keepalive: true
        });
        if (res.ok) {
          const data = await res.json();
          if (data && typeof data.value === 'number') {
            currentVal = Math.max(currentVal, data.value + pendingClicks);
            countEl.textContent = formatCount(currentVal);
          }
        } else {
          // 若失败归还计数
          pendingClicks += countToSend;
        }
      } catch (e) {
        pendingClicks += countToSend;
      } finally {
        isSyncing = false;
        // 如果在发送期间又有新的点击，继续发送
        if (pendingClicks > 0) {
          syncTimer = setTimeout(flushClicks, 400);
        }
      }
    }

    // 页面跳转或切后台时，使用 sendBeacon / keepalive 立即刷入云端
    function flushOnLeave() {
      if (pendingClicks > 0) {
        const payload = JSON.stringify({ amount: pendingClicks });
        pendingClicks = 0;
        if (navigator.sendBeacon) {
          const blob = new Blob([payload], { type: 'application/json' });
          navigator.sendBeacon(LOCAL_API, blob);
        } else {
          fetch(LOCAL_API, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: payload,
            keepalive: true
          });
        }
      }
    }

    window.addEventListener('pagehide', flushOnLeave);
    window.addEventListener('beforeunload', flushOnLeave);
    document.addEventListener('visibilitychange', () => {
      if (document.visibilityState === 'hidden') {
        flushOnLeave();
      }
    });

    // 点击事件：动画特效 + 云端计数 +1
    function handleClick(e) {
      // 1. 瞬时界面反馈（视觉无延迟）
      currentVal++;
      pendingClicks++;
      countEl.textContent = formatCount(currentVal);

      // 2. 按钮波纹与弹跳动画
      likeBtn.classList.remove('burst');
      void likeBtn.offsetWidth; // 触发 reflow
      likeBtn.classList.add('burst');

      // 3. 产生漂浮粒子特效
      spawnParticle(e);

      // 4. 防抖批量同步：连点时 350ms 内合并批量提交，减少网络阻塞
      if (syncTimer) clearTimeout(syncTimer);
      syncTimer = setTimeout(flushClicks, 350);
    }

    // 漂浮飞升粒子特效
    function spawnParticle(e) {
      const rect = likeBtn.getBoundingClientRect();
      const p = document.createElement('span');
      p.className = 'float-particle';

      const randomEmoji = icons[Math.floor(Math.random() * icons.length)];
      p.textContent = randomEmoji;

      // 随机横向偏移 (-35px 到 +35px) 和随机旋转角度
      const tx = (Math.random() * 70 - 35) + 'px';
      const rot = (Math.random() * 60 - 30) + 'deg';
      p.style.setProperty('--tx', tx);
      p.style.setProperty('--rot', rot);

      // 定位在按钮中间偏上位置
      const clickX = e ? e.clientX - rect.left : rect.width / 2;
      p.style.left = `${clickX}px`;
      p.style.top = '10px';

      likeBtn.appendChild(p);

      // 动画结束后移除元素
      setTimeout(() => {
        p.remove();
      }, 850);
    }

    // 页面加载时拉取
    initCount();

    /* ========================================================
       🌌 Antigravity 官网风格鼠标交互特效引擎
       1. 鼠标悬停 3D 卡片倾斜与视差跟随 (3D Tilt & Parallax)
       2. 鼠标聚光灯光晕跟随 (Spotlight Glow)
       3. 动态反重力星尘粒子系统 (Floating Gravitational Particles)
          - 鼠标靠近时光速排斥 / 引力扩散 (Magnetic Repulsion)
          - 粒子连线形成动态神经网络星座 (Interactive Constellation)
       ======================================================== */

    // 1. 鼠标光晕与 3D 卡片倾斜效果
    const tiltCard = document.getElementById('tiltCard');
    const mouseGlow = document.getElementById('mouseGlow');
    let mouseX = window.innerWidth / 2;
    let mouseY = window.innerHeight / 2;

    window.addEventListener('mousemove', (e) => {
      mouseX = e.clientX;
      mouseY = e.clientY;

      // 移动光晕
      mouseGlow.style.left = `${mouseX}px`;
      mouseGlow.style.top = `${mouseY}px`;

      // 计算卡片 3D 偏转
      if (tiltCard) {
        const rect = tiltCard.getBoundingClientRect();
        const cardCenterX = rect.left + rect.width / 2;
        const cardCenterY = rect.top + rect.height / 2;
        const deltaX = (e.clientX - cardCenterX) / (window.innerWidth / 2);
        const deltaY = (e.clientY - cardCenterY) / (window.innerHeight / 2);

        // 最大倾斜角度 12 度
        const rotateY = deltaX * 10;
        const rotateX = -deltaY * 10;
        tiltCard.style.transform = `perspective(1000px) rotateX(${rotateX.toFixed(2)}deg) rotateY(${rotateY.toFixed(2)}deg) translateY(-4px)`;
      }
    });

    window.addEventListener('mouseleave', () => {
      if (tiltCard) {
        tiltCard.style.transform = 'perspective(1000px) rotateX(0deg) rotateY(0deg) translateY(0px)';
      }
    });

    // 2. 反重力动态粒子全屏交互引擎
    const canvas = document.getElementById('gravityCanvas');
    const ctx = canvas.getContext('2d');

    let width = (canvas.width = window.innerWidth);
    let height = (canvas.height = window.innerHeight);

    window.addEventListener('resize', () => {
      width = canvas.width = window.innerWidth;
      height = canvas.height = window.innerHeight;
      initParticles();
    });

    const particles = [];
    const PARTICLE_COUNT = Math.min(Math.floor((width * height) / 12000), 90);

    class Particle {
      constructor() {
        this.reset();
        this.y = Math.random() * height; // 初次随机高度
      }

      reset() {
        this.x = Math.random() * width;
        this.y = height + 10;
        // 反重力：向上缓慢漂浮
        this.vy = -(Math.random() * 0.7 + 0.3);
        this.vx = (Math.random() - 0.5) * 0.5;
        // 冲击外力速度
        this.blastVx = 0;
        this.blastVy = 0;
        this.baseSize = Math.random() * 2 + 1;
        this.size = this.baseSize;
        this.alpha = Math.random() * 0.5 + 0.2;
        this.color = Math.random() > 0.4 ? '56, 189, 248' : '168, 85, 247'; // 霓虹天蓝或浅紫
      }

      update() {
        // 自然向上浮动与冲击力衰减
        this.y += this.vy + this.blastVy;
        this.x += this.vx + this.blastVx;

        // 冲击波惯性物理阻尼衰减
        this.blastVx *= 0.92;
        this.blastVy *= 0.92;

        // 鼠标常规悬停交互：反重力排斥力场
        const dx = this.x - mouseX;
        const dy = this.y - mouseY;
        const dist = Math.sqrt(dx * dx + dy * dy);
        const maxDist = 130;

        if (dist < maxDist) {
          const force = (1 - dist / maxDist) * 3.5;
          const angle = Math.atan2(dy, dx);
          this.x += Math.cos(angle) * force;
          this.y += Math.sin(angle) * force;
          this.size = this.baseSize * 1.5;
        } else {
          this.size = this.baseSize;
        }

        // 飞出屏幕边缘后循环到底部重置
        if (this.y < -20 || this.x < -30 || this.x > width + 30 || this.y > height + 30) {
          this.reset();
        }
      }

      // 施加冲击波爆炸推力
      applyBlast(bx, by, power, maxRadius) {
        const dx = this.x - bx;
        const dy = this.y - by;
        const dist = Math.sqrt(dx * dx + dy * dy);
        if (dist < maxRadius && dist > 1) {
          const force = (1 - dist / maxRadius) * power;
          const angle = Math.atan2(dy, dx);
          this.blastVx += Math.cos(angle) * force;
          this.blastVy += Math.sin(angle) * force;
        }
      }

      draw() {
        ctx.beginPath();
        ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
        ctx.fillStyle = `rgba(${this.color}, ${this.alpha})`;
        ctx.shadowBlur = 8;
        ctx.shadowColor = `rgba(${this.color}, 0.8)`;
        ctx.fill();
        ctx.shadowBlur = 0;
      }
    }

    // 冲击波能量环系统
    const shockwaves = [];
    class Shockwave {
      constructor(x, y) {
        this.x = x;
        this.y = y;
        this.radius = 5;
        this.maxRadius = 240;
        this.speed = 10;
        this.alpha = 0.8;
      }
      update() {
        this.radius += this.speed;
        this.alpha = (1 - this.radius / this.maxRadius) * 0.8;
      }
      draw() {
        if (this.alpha <= 0) return;
        ctx.beginPath();
        ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
        ctx.strokeStyle = `rgba(56, 189, 248, ${this.alpha * 0.6})`;
        ctx.lineWidth = 2.5;
        ctx.shadowBlur = 12;
        ctx.shadowColor = 'rgba(56, 189, 248, 0.8)';
        ctx.stroke();
        ctx.shadowBlur = 0;
      }
    }

    // 监听全屏点击：若点击卡片外的空白区域，触发强力冲击波冲开粒子
    window.addEventListener('pointerdown', (e) => {
      // 判断点击是否在卡片内部（如果在卡片内，则保持卡片按钮的原有交互，不触发全屏冲击）
      if (tiltCard && tiltCard.contains(e.target)) {
        return;
      }

      const clickX = e.clientX;
      const clickY = e.clientY;

      // 1. 生成向外扩散的科技冲击波能量光环
      shockwaves.push(new Shockwave(clickX, clickY));

      // 2. 强力冲开四周的粒子（高能引力爆破）
      particles.forEach(p => {
        p.applyBlast(clickX, clickY, 22, 280);
      });

      // 3. 产生额外的冲击火花碎片
      for (let i = 0; i < 18; i++) {
        const spark = new Particle();
        spark.x = clickX + (Math.random() - 0.5) * 15;
        spark.y = clickY + (Math.random() - 0.5) * 15;
        const angle = Math.random() * Math.PI * 2;
        const speed = Math.random() * 12 + 4;
        spark.blastVx = Math.cos(angle) * speed;
        spark.blastVy = Math.sin(angle) * speed;
        spark.size = Math.random() * 2.5 + 1.2;
        spark.alpha = 0.9;
        particles.push(spark);
      }
    });

    function initParticles() {
      particles.length = 0;
      for (let i = 0; i < PARTICLE_COUNT; i++) {
        particles.push(new Particle());
      }
    }

    function renderParticles() {
      ctx.clearRect(0, 0, width, height);

      // 绘制并更新冲击波能量环
      for (let i = shockwaves.length - 1; i >= 0; i--) {
        shockwaves[i].update();
        shockwaves[i].draw();
        if (shockwaves[i].radius >= shockwaves[i].maxRadius) {
          shockwaves.splice(i, 1);
        }
      }

      // 限制粒子总数，防止爆炸碎片无限累积
      if (particles.length > PARTICLE_COUNT + 60) {
        particles.splice(0, particles.length - (PARTICLE_COUNT + 40));
      }

      // 绘制粒子间连线（距离近时产生连接星座效果）
      for (let i = 0; i < particles.length; i++) {
        for (let j = i + 1; j < particles.length; j++) {
          const dx = particles[i].x - particles[j].x;
          const dy = particles[i].y - particles[j].y;
          const dist = Math.sqrt(dx * dx + dy * dy);
          if (dist < 95) {
            ctx.beginPath();
            ctx.moveTo(particles[i].x, particles[i].y);
            ctx.lineTo(particles[j].x, particles[j].y);
            ctx.strokeStyle = `rgba(56, 189, 248, ${(1 - dist / 95) * 0.18})`;
            ctx.lineWidth = 0.8;
            ctx.stroke();
          }
        }
      }

      // 更新和绘制每个粒子
      for (let i = 0; i < particles.length; i++) {
        particles[i].update();
        particles[i].draw();
      }

      requestAnimationFrame(renderParticles);
    }

    initParticles();
    renderParticles();
  </script>
</body>
</html>
