<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#f5f5f7">
  <meta name="description" content="岑靖的个人小站：英语查词、智能过词、精选图库、资源网盘与外卖记账。">
  <title>神秘小网站 - by 岑靖</title>
  <link rel="stylesheet" href="./src/styles/base.css">
  <link rel="stylesheet" href="./src/styles/index.css">
</head>
<body>
  <main class="card" id="tiltCard">
    <header class="hero">
      <div class="avatar-row">
        <div class="avatar-item">
          <img src="./left_avatar.png" alt="头像" class="avatar-img">
        </div>
        <div class="avatar-item">
          <img src="./OIP-C.jpg" alt="展示图片" class="avatar-img" id="secretClashTrigger" style="cursor: pointer;">
        </div>
        <div class="avatar-item">
          <img src="./right_avatar.jpg" alt="头像" class="avatar-img" id="secretBoardTrigger" style="cursor: pointer;">
        </div>
      </div>
      <h1>你好</h1>
      <p class="hero-sub">神秘小网站 · by 岑靖</p>

      <!-- 全网云端同步互动点赞按钮 -->
      <button type="button" class="like-btn" id="likeBtn" aria-label="为网站点赞">
        <span class="like-icon" id="likeIcon" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg>
        </span>
        <span>为网站点赞</span>
        <span class="like-badge" id="likeCount">···</span>
      </button>
    </header>

    <!-- 快捷功能入口 -->
    <section aria-labelledby="grpStudy">
      <h2 class="group-title" id="grpStudy">学习</h2>
      <div class="list">
        <a href="./vocab.html" class="row" id="vocabLink">
          <span class="row-icon" style="--tint:#007aff" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg>
          </span>
          <span class="row-text">
            <span class="row-title">英语查词与词库</span>
            <span class="row-sub">高中 7 册 + 四六级全量 · 1.1 万词</span>
          </span>
          <svg class="chevron" viewBox="0 0 8 14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M1 1l6 6-6 6"/></svg>
        </a>

        <a href="./recite.html" class="row" id="reciteLink">
          <span class="row-icon" style="--tint:#34c759" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6L9 17l-5-5"/></svg>
          </span>
          <span class="row-text">
            <span class="row-title">智能过词</span>
            <span class="row-sub">2050 核心词 · 极速刷 / 快测 / 跨端漫游</span>
          </span>
          <svg class="chevron" viewBox="0 0 8 14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M1 1l6 6-6 6"/></svg>
        </a>
      </div>
    </section>

    <section aria-labelledby="grpMedia">
      <h2 class="group-title" id="grpMedia">资源</h2>
      <div class="list">
        <a href="./gallery.html" class="row" id="galleryLink">
          <span class="row-icon" style="--tint:#ff2d55" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="3"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="M21 15l-5-5L5 21"/></svg>
          </span>
          <span class="row-text">
            <span class="row-title">精选图库</span>
            <span class="row-sub">照片与在线视频</span>
          </span>
          <span class="row-meta">121</span>
          <svg class="chevron" viewBox="0 0 8 14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M1 1l6 6-6 6"/></svg>
        </a>

        <a href="./pan.html" class="row" id="panLink">
          <span class="row-icon" style="--tint:#30b0c7" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><path d="M7 10l5 5 5-5"/><path d="M12 15V3"/></svg>
          </span>
          <span class="row-text">
            <span class="row-title">资源网盘</span>
            <span class="row-sub">高速直链下载</span>
          </span>
          <svg class="chevron" viewBox="0 0 8 14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M1 1l6 6-6 6"/></svg>
        </a>
      </div>
    </section>

    <section aria-labelledby="grpTools">
      <h2 class="group-title" id="grpTools">工具</h2>
      <div class="list">
        <button type="button" class="row" id="takeoutBtn">
          <span class="row-icon" style="--tint:#ff9500" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 2v20l2-1 2 1 2-1 2 1 2-1 2 1 2-1 2 1V2l-2 1-2-1-2 1-2-1-2 1-2-1-2 1-2-1z"/><path d="M8 8h8M8 12h8M8 16h5"/></svg>
          </span>
          <span class="row-text">
            <span class="row-title">账单</span>
            <span class="row-sub">外卖记账与多人分摊</span>
          </span>
          <span class="row-meta" aria-label="需要密码">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="11" width="16" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg>
          </span>
          <svg class="chevron" viewBox="0 0 8 14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M1 1l6 6-6 6"/></svg>
        </button>

        <a href="./showcase.html" class="row" id="showcaseLink">
          <span class="row-icon" style="--tint:#8e8e93" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 21h18"/><path d="M5 21V10M9 21V10M15 21V10M19 21V10"/><path d="M2 10l10-7 10 7z"/></svg>
          </span>
          <span class="row-text">
            <span class="row-title">技术展馆</span>
            <span class="row-sub">核心架构与技术原理</span>
          </span>
          <svg class="chevron" viewBox="0 0 8 14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M1 1l6 6-6 6"/></svg>
        </a>
      </div>
    </section>

    <footer class="foot">© 岑靖</footer>
  </main>

  <!-- 密码验证解锁弹窗 -->
  <div class="auth-modal-backdrop" id="authModalBackdrop" role="dialog" aria-modal="true" aria-labelledby="authTitle">
    <div class="auth-modal-card">
      <div class="auth-title" id="authTitle">
        <span>账单</span>
      </div>
      <div class="auth-desc">请输入独立管理密码以解锁进入账单系统</div>
      <div class="auth-input-wrap">
        <input type="password" id="takeoutAuthInput" class="auth-input" placeholder="输入密码" maxlength="32" autocomplete="current-password">
      </div>
      <div class="auth-error" id="authErrorMsg" aria-live="polite"></div>
      <label class="auth-remember-row">
        <input type="checkbox" id="authRememberCheck" checked>
        <span>30 天内免密访问</span>
      </label>
      <div class="auth-btn-row">
        <button type="button" class="auth-cancel-btn" id="authCancelBtn">取消</button>
        <button type="button" class="auth-submit-btn" id="authSubmitBtn">解锁</button>
      </div>
    </div>
  </div>

  <script type="module" src="./src/pages/index/main.ts"></script>
</body>
</html>
