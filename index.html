<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>神秘小网站</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      background: radial-gradient(circle at 50% 25%, #1e293b, #0f172a);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      color: #f8fafc;
      padding: 1.5rem;
    }
    .card {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      padding: 2.5rem 3.2rem;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 28px;
      backdrop-filter: blur(20px);
      box-shadow: 0 25px 60px -15px rgba(0, 0, 0, 0.6);
      animation: float 4s ease-in-out infinite alternate;
      max-width: 580px;
      width: 100%;
    }
    @keyframes float {
      0% { transform: translateY(0px); }
      100% { transform: translateY(-8px); }
    }
    .avatar-row {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 1.2rem;
      margin-bottom: 1.5rem;
      width: 100%;
    }
    .avatar-item {
      position: relative;
      border-radius: 20px;
      overflow: hidden;
      width: 130px;
      height: 130px;
      flex-shrink: 0;
      box-shadow: 0 12px 30px rgba(0, 0, 0, 0.4);
      border: 2px solid rgba(255, 255, 255, 0.16);
      transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1), border-color 0.3s ease, box-shadow 0.3s ease;
    }
    .avatar-item:hover {
      transform: translateY(-4px) scale(1.05);
      border-color: rgba(56, 189, 248, 0.6);
      box-shadow: 0 16px 36px rgba(0, 0, 0, 0.55);
    }
    .avatar-img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }
    h1 {
      font-size: 3.8rem;
      font-weight: 800;
      letter-spacing: 0.1em;
      background: linear-gradient(135deg, #00dfd8, #007cf0, #7928ca);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 0.6rem;
    }
    p {
      color: #94a3b8;
      font-size: 1.1rem;
      margin-bottom: 1.2rem;
    }
    .badge {
      display: inline-flex;
      align-items: center;
      gap: 0.6rem;
      padding: 0.45rem 1.1rem;
      border-radius: 9999px;
      background: rgba(0, 124, 240, 0.15);
      color: #38bdf8;
      font-size: 0.85rem;
      font-weight: 600;
      border: 1px solid rgba(0, 124, 240, 0.3);
      margin-bottom: 0.5rem;
    }
    .dot {
      width: 8px;
      height: 8px;
      background-color: #00dfd8;
      border-radius: 50%;
      box-shadow: 0 0 10px #00dfd8;
    }
    .btn-group {
      display: flex;
      flex-direction: column;
      gap: 0.9rem;
      width: 100%;
      margin-top: 1.4rem;
    }
    .gallery-btn, .pan-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.6rem;
      padding: 0.85rem 1.8rem;
      border-radius: 9999px;
      color: #ffffff;
      font-size: 1rem;
      font-weight: 700;
      text-decoration: none;
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }
    .gallery-btn {
      background: linear-gradient(135deg, #007cf0, #00dfd8);
      box-shadow: 0 10px 25px rgba(0, 124, 240, 0.35);
    }
    .gallery-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 15px 30px rgba(0, 223, 216, 0.45);
      color: #ffffff;
    }
    .pan-btn {
      background: linear-gradient(135deg, #f59e0b, #ea580c);
      box-shadow: 0 10px 25px rgba(245, 158, 11, 0.35);
    }
    .pan-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 15px 30px rgba(234, 88, 12, 0.45);
      color: #ffffff;
    }
    /* 点赞互动按钮 */
    .like-btn {
      position: relative;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.65rem;
      padding: 0.85rem 1.8rem;
      border-radius: 9999px;
      background: linear-gradient(135deg, #ec4899, #8b5cf6, #3b82f6);
      background-size: 200% 200%;
      color: #ffffff;
      font-size: 1rem;
      font-weight: 700;
      border: none;
      cursor: pointer;
      box-shadow: 0 10px 25px rgba(236, 72, 153, 0.35);
      transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
      user-select: none;
      -webkit-tap-highlight-color: transparent;
      outline: none;
      overflow: visible;
    }
    .like-btn:hover {
      transform: translateY(-2px) scale(1.02);
      box-shadow: 0 15px 32px rgba(236, 72, 153, 0.5);
    }
    .like-btn:active {
      transform: scale(0.95);
    }
    .like-btn.burst {
      animation: heartBeat 0.45s ease-in-out;
    }
    .like-icon {
      font-size: 1.25rem;
      display: inline-block;
      transition: transform 0.25s ease;
    }
    .like-btn.burst .like-icon {
      transform: scale(1.4) rotate(-15deg);
    }
    .like-badge {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 38px;
      padding: 0.2rem 0.65rem;
      border-radius: 9999px;
      background: rgba(0, 0, 0, 0.28);
      border: 1px solid rgba(255, 255, 255, 0.25);
      font-size: 0.9rem;
      font-weight: 800;
      color: #ffffff;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      letter-spacing: 0.03em;
    }
    /* 浮动飞出动画气泡 */
    .float-particle {
      position: absolute;
      pointer-events: none;
      font-size: 1.3rem;
      animation: floatUpFade 0.85s cubic-bezier(0.22, 1, 0.36, 1) forwards;
      z-index: 50;
      user-select: none;
    }
    @keyframes heartBeat {
      0% { transform: scale(1); }
      30% { transform: scale(1.12); }
      50% { transform: scale(0.97); }
      75% { transform: scale(1.05); }
      100% { transform: scale(1); }
    }
    @keyframes floatUpFade {
      0% {
        opacity: 1;
        transform: translate(0, 0) scale(0.8) rotate(0deg);
      }
      50% {
        opacity: 0.9;
        transform: translate(var(--tx, 0px), -45px) scale(1.3) rotate(var(--rot, 0deg));
      }
      100% {
        opacity: 0;
        transform: translate(var(--tx, 0px), -85px) scale(1) rotate(var(--rot, 0deg));
      }
    }
    @media (max-width: 480px) {
      .card {
        padding: 2rem 1.2rem;
      }
      .avatar-item {
        width: 90px;
        height: 90px;
        border-radius: 16px;
      }
      .avatar-row {
        gap: 0.6rem;
      }
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="avatar-row">
      <div class="avatar-item">
        <img src="./left_avatar.png" alt="图片1" class="avatar-img">
      </div>
      <div class="avatar-item">
        <img src="./OIP-C.jpg" alt="展示图片" class="avatar-img">
      </div>
      <div class="avatar-item">
        <img src="./right_avatar.jpg" alt="图片2" class="avatar-img">
      </div>
    </div>
    <h1>你好</h1>


    <!-- 快捷功能入口按钮组 -->
    <div class="btn-group">
      <!-- 全网云端同步互动点赞按钮 -->
      <button class="like-btn" id="likeBtn" onclick="handleClick(event)">
        <span class="like-icon" id="likeIcon">💖</span>
        <span>为网站点赞</span>
        <span class="like-badge" id="likeCount">...</span>
      </button>

      <a href="./gallery.html" class="gallery-btn">
        <span>🖼️ 查看精选图库</span>
        <span style="font-size: 0.85em; opacity: 0.9;">(23张) →</span>
      </a>
      <a href="./pan.html" class="pan-btn">
        <span>📁 资源网盘下载</span>
        <span style="font-size: 0.85em; opacity: 0.9;">(100MB极速) →</span>
      </a>
    </div>
  </div>

  <script>
    // 计数器配置：优先调用 Cloudflare Pages 原生私有后端 /api/click，降级支持公共 API
    const LOCAL_API = '/api/click';
    const FALLBACK_API_BASE = 'https://countapi.mileshilliard.com/api/v1';
    const FALLBACK_KEY = 'web_cenj_shared_clicks_v1';

    const countEl = document.getElementById('likeCount');
    const likeBtn = document.getElementById('likeBtn');
    const likeIcon = document.getElementById('likeIcon');

    let currentVal = 0;
    const icons = ['💖', '🎉', '✨', '🔥', '👏', '🌟', '🚀', '💯'];

    // 格式化数字
    function formatCount(num) {
      return Number(num).toLocaleString();
    }

    // 初始化获取云端最新计次
    async function initCount() {
      try {
        // 先尝试自己的私有 Cloudflare API
        const res = await fetch(LOCAL_API);
        if (res.ok) {
          const data = await res.json();
          if (data && typeof data.value === 'number') {
            currentVal = data.value;
            countEl.textContent = formatCount(currentVal);
            return;
          }
        }
      } catch (e) {}

      // 备用降级逻辑
      try {
        const res = await fetch(`${FALLBACK_API_BASE}/get/${FALLBACK_KEY}`);
        if (res.ok) {
          const data = await res.json();
          currentVal = data.value || 0;
          countEl.textContent = formatCount(currentVal);
        } else {
          countEl.textContent = '0';
        }
      } catch (err) {
        countEl.textContent = currentVal || '0';
      }
    }

    // 点击事件：动画特效 + 云端计数 +1
    async function handleClick(e) {
      // 1. 瞬时界面反馈（先自增，视觉无延迟）
      currentVal++;
      countEl.textContent = formatCount(currentVal);

      // 2. 按钮波纹与弹跳动画
      likeBtn.classList.remove('burst');
      void likeBtn.offsetWidth; // 触发 reflow
      likeBtn.classList.add('burst');

      // 3. 产生漂浮粒子特效
      spawnParticle(e);

      // 4. 同步请求自己私有的 Cloudflare 后端接口
      try {
        const res = await fetch(LOCAL_API, { method: 'POST' });
        if (res.ok) {
          const data = await res.json();
          if (data && typeof data.value === 'number') {
            currentVal = Math.max(currentVal, data.value);
            countEl.textContent = formatCount(currentVal);
            return;
          }
        }
      } catch (e) {}

      // 备用同步请求
      try {
        const res = await fetch(`${FALLBACK_API_BASE}/hit/${FALLBACK_KEY}`);
        if (res.ok) {
          const data = await res.json();
          if (data && typeof data.value === 'number') {
            currentVal = Math.max(currentVal, data.value);
            countEl.textContent = formatCount(currentVal);
          }
        }
      } catch (err) {}
    }

    // 漂浮飞升粒子特效
    function spawnParticle(e) {
      const rect = likeBtn.getBoundingClientRect();
      const p = document.createElement('span');
      p.className = 'float-particle';

      const randomEmoji = icons[Math.floor(Math.random() * icons.length)];
      p.textContent = randomEmoji;

      // 随机横向偏移 (-35px 到 +35px) 和随机旋转角度
      const tx = (Math.random() * 70 - 35) + 'px';
      const rot = (Math.random() * 60 - 30) + 'deg';
      p.style.setProperty('--tx', tx);
      p.style.setProperty('--rot', rot);

      // 定位在按钮中间偏上位置
      const clickX = e ? e.clientX - rect.left : rect.width / 2;
      p.style.left = `${clickX}px`;
      p.style.top = '10px';

      likeBtn.appendChild(p);

      // 动画结束后移除元素
      setTimeout(() => {
        p.remove();
      }, 850);
    }

    // 页面加载时拉取
    initCount();
  </script>
</body>
</html>
