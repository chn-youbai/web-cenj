<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CENJ · 学习与空间</title>
  <link rel="icon" type="image/svg+xml" href="./favicon.svg">
  <script>(function(){try{var t=localStorage.getItem('cenj-theme');if(t==='dark'||(!t&&window.matchMedia('(prefers-color-scheme:dark)').matches))document.documentElement.setAttribute('data-theme','dark');}catch(e){}})();</script>
  <link rel="stylesheet" href="./src/styles/tokens.css">
  <link rel="stylesheet" href="./src/styles/shell.css">
  <link rel="stylesheet" href="./src/styles/index.css">
</head>
<body>
  <div class="app-shell">
    <main class="app-main">
      <div class="workspace-stage">
        <header class="workspace-topbar">
          <div class="topbar-meta">
            <span class="topbar-kicker">EDITION · CENJ</span>
          </div>
          <div class="topbar-actions">
            <button type="button" class="like-btn" id="likeBtn" aria-label="点赞支持">
              <svg class="like-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"></path>
              </svg>
              <span class="like-count" id="likeCount">0</span>
            </button>
          </div>
        </header>

        <section class="claude-centerpiece" aria-label="快速工作台">
          <div class="greeting-block">
            <h1 class="greeting-title" id="greetingTitle">你好</h1>
            <p class="greeting-subtitle">查词、跳转页面，或输入 <code>/bill</code> · <code>/msg</code> · <code>/clash</code> 直达工具</p>
          </div>

          <div class="omnibox-shell">
            <form class="omnibox-card" id="omniboxForm" autocomplete="off">
              <div class="omnibox-input-row">
                <span class="omnibox-search-icon" aria-hidden="true">
                  <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="11" cy="11" r="8"></circle>
                    <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
                  </svg>
                </span>
                <input
                  type="search"
                  id="omniboxInput"
                  class="omnibox-input"
                  placeholder="输入英文单词、页面名称，或 /bill、/msg、/clash …"
                  aria-label="全局搜索或指令跳转"
                >
                <button type="button" class="omnibox-clear-btn" id="omniboxClearBtn" hidden aria-label="清空输入">
                  <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
                    <line x1="18" y1="6" x2="6" y2="18"></line>
                    <line x1="6" y1="6" x2="18" y2="18"></line>
                  </svg>
                </button>
                <button type="submit" class="omnibox-submit-btn" aria-label="执行搜索或跳转">
                  <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <line x1="5" y1="12" x2="19" y2="12"></line>
                    <polyline points="12 5 19 12 12 19"></polyline>
                  </svg>
                </button>
              </div>
              <div class="omnibox-results" id="omniboxResults" hidden></div>
            </form>

            <div class="omnibox-chips" aria-label="快捷示例">
              <button type="button" class="omni-chip" data-omni-chip="ephemeral">ephemeral</button>
              <button type="button" class="omni-chip" data-omni-chip="serendipity">serendipity</button>
              <button type="button" class="omni-chip" data-omni-chip="/bill">/bill</button>
              <button type="button" class="omni-chip" data-omni-chip="/msg">/msg</button>
              <button type="button" class="omni-chip" data-omni-chip="/clash">/clash</button>
              <span class="omni-kbd-hint">按 <kbd>⌘K</kbd> 随时唤起</span>
            </div>
          </div>
        </section>

        <footer class="workspace-foot">
          <span>CENJ Workspace · Quiet &amp; Focused</span>
        </footer>
      </div>
    </main>
  </div>

  <script type="module" src="./src/pages/index/main.ts"></script>
</body>
</html>
