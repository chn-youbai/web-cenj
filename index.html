<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>神秘小网站 - by 岑靖</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    html, body {
      width: 100%;
      height: 100%;
      height: 100dvh;
      overflow: hidden;
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      background: radial-gradient(circle at 50% 25%, #0f172a, #030712);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      color: #f8fafc;
      padding: 1rem;
      perspective: 1000px;
      position: relative;
    }
    /* 反重力动态粒子全屏画布 */
    #gravityCanvas {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 1;
    }
    /* 鼠标交互聚光灯背景光晕 */
    .mouse-glow {
      position: fixed;
      width: 600px;
      height: 600px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(56, 189, 248, 0.12) 0%, rgba(139, 92, 246, 0.05) 45%, transparent 70%);
      pointer-events: none;
      transform: translate(-50%, -50%);
      z-index: 1;
      transition: opacity 0.3s ease;
      will-change: transform;
    }
    .card {
      position: relative;
      z-index: 10;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      padding: 2rem 2.8rem;
      background: rgba(15, 23, 42, 0.65);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 28px;
      backdrop-filter: blur(25px);
      box-shadow: 0 25px 60px -15px rgba(0, 0, 0, 0.7), 0 0 40px rgba(56, 189, 248, 0.08);
      max-width: 520px;
      width: 90%;
      max-height: 94vh;
      max-height: 94dvh;
      transform-style: preserve-3d;
      transition: transform 0.15s ease-out, box-shadow 0.3s ease;
      will-change: transform;
    }
    .avatar-row {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 1rem;
      margin-bottom: 1rem;
      width: 100%;
    }
    .avatar-item {
      position: relative;
      border-radius: 18px;
      overflow: hidden;
      width: 110px;
      height: 110px;
      flex-shrink: 0;
      box-shadow: 0 12px 28px rgba(0, 0, 0, 0.4);
      border: 2px solid rgba(255, 255, 255, 0.16);
      transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1), border-color 0.3s ease, box-shadow 0.3s ease;
    }
    .avatar-item:hover {
      transform: translateY(-4px) scale(1.05);
      border-color: rgba(56, 189, 248, 0.6);
      box-shadow: 0 16px 36px rgba(0, 0, 0, 0.55);
    }
    .avatar-img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }
    h1 {
      font-size: 3rem;
      font-weight: 800;
      letter-spacing: 0.1em;
      background: linear-gradient(135deg, #00dfd8, #007cf0, #7928ca);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 0.3rem;
    }
    p {
      color: #94a3b8;
      font-size: 1.1rem;
      margin-bottom: 1.2rem;
    }
    .badge {
      display: inline-flex;
      align-items: center;
      gap: 0.6rem;
      padding: 0.45rem 1.1rem;
      border-radius: 9999px;
      background: rgba(0, 124, 240, 0.15);
      color: #38bdf8;
      font-size: 0.85rem;
      font-weight: 600;
      border: 1px solid rgba(0, 124, 240, 0.3);
      margin-bottom: 0.5rem;
    }
    .dot {
      width: 8px;
      height: 8px;
      background-color: #00dfd8;
      border-radius: 50%;
      box-shadow: 0 0 10px #00dfd8;
    }
    .btn-group {
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
      width: 100%;
      margin-top: 0.9rem;
    }
    .gallery-btn, .pan-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.6rem;
      padding: 0.75rem 1.6rem;
      border-radius: 9999px;
      color: #ffffff;
      font-size: 0.95rem;
      font-weight: 700;
      text-decoration: none;
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }
    .gallery-btn {
      background: linear-gradient(135deg, #007cf0, #00dfd8);
      box-shadow: 0 10px 25px rgba(0, 124, 240, 0.35);
    }
    .gallery-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 15px 30px rgba(0, 223, 216, 0.45);
      color: #ffffff;
    }
    .pan-btn {
      background: linear-gradient(135deg, #f59e0b, #ea580c);
      box-shadow: 0 10px 25px rgba(245, 158, 11, 0.35);
    }
    .pan-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 15px 30px rgba(234, 88, 12, 0.45);
      color: #ffffff;
    }
    .takeout-portal-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.6rem;
      padding: 0.75rem 1.6rem;
      border-radius: 9999px;
      color: #ffffff;
      font-size: 0.95rem;
      font-weight: 700;
      text-decoration: none;
      background: linear-gradient(135deg, #f97316, #ef4444);
      box-shadow: 0 10px 25px rgba(249, 115, 22, 0.35);
      border: none;
      cursor: pointer;
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }
    .takeout-portal-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 15px 30px rgba(239, 68, 68, 0.45);
      color: #ffffff;
    }
    .vocab-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.6rem;
      padding: 0.75rem 1.6rem;
      border-radius: 9999px;
      color: #ffffff;
      font-size: 0.95rem;
      font-weight: 700;
      text-decoration: none;
      background: linear-gradient(135deg, #007AFF, #4F46E5);
      box-shadow: 0 10px 25px rgba(0, 122, 255, 0.35);
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }
    .vocab-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 15px 30px rgba(79, 70, 229, 0.45);
      color: #ffffff;
    }

    /* 密码解锁模态弹窗 */
    .auth-modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(3, 7, 18, 0.75);
      backdrop-filter: blur(14px);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 1000;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s ease;
      padding: 1.2rem;
    }
    .auth-modal-backdrop.show {
      opacity: 1;
      pointer-events: auto;
    }
    .auth-modal-card {
      background: rgba(15, 23, 42, 0.9);
      border: 1px solid rgba(255, 255, 255, 0.16);
      border-radius: 24px;
      padding: 2rem 2.2rem;
      max-width: 420px;
      width: 100%;
      box-shadow: 0 25px 60px -15px rgba(0, 0, 0, 0.7), 0 0 40px rgba(249, 115, 22, 0.18);
      text-align: center;
      transform: scale(0.92) translateY(10px);
      transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
    }
    .auth-modal-backdrop.show .auth-modal-card {
      transform: scale(1) translateY(0);
    }
    .auth-title {
      font-size: 1.35rem;
      font-weight: 800;
      color: #fff;
      margin-bottom: 0.5rem;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
    }
    .auth-desc {
      font-size: 0.86rem;
      color: #94a3b8;
      line-height: 1.5;
      margin-bottom: 1.4rem;
    }
    .auth-input-wrap {
      position: relative;
      margin-bottom: 0.6rem;
    }
    .auth-input {
      width: 100%;
      padding: 0.85rem 1rem;
      background: rgba(30, 41, 59, 0.7);
      border: 1.5px solid rgba(255, 255, 255, 0.18);
      border-radius: 12px;
      color: #fff;
      font-size: 1.15rem;
      letter-spacing: 0.25em;
      text-align: center;
      outline: none;
      transition: border-color 0.25s, box-shadow 0.25s;
    }
    .auth-input:focus {
      border-color: #f97316;
      box-shadow: 0 0 0 3px rgba(249, 115, 22, 0.25);
    }
    .auth-error {
      color: #ef4444;
      font-size: 0.82rem;
      min-height: 1.3rem;
      margin-bottom: 0.6rem;
    }
    .auth-remember-row {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      font-size: 0.85rem;
      color: #cbd5e1;
      margin-bottom: 1.3rem;
      cursor: pointer;
    }
    .auth-btn-row {
      display: flex;
      gap: 0.8rem;
    }
    .auth-submit-btn {
      flex: 1;
      padding: 0.8rem;
      border-radius: 9999px;
      background: linear-gradient(135deg, #f97316, #ef4444);
      color: white;
      font-size: 0.95rem;
      font-weight: 700;
      border: none;
      cursor: pointer;
      box-shadow: 0 8px 20px rgba(249, 115, 22, 0.35);
      transition: transform 0.2s, box-shadow 0.2s;
    }
    .auth-submit-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 12px 25px rgba(249, 115, 22, 0.45);
    }
    .auth-cancel-btn {
      padding: 0.8rem 1.4rem;
      border-radius: 9999px;
      background: rgba(255, 255, 255, 0.1);
      color: #cbd5e1;
      font-size: 0.95rem;
      border: 1px solid rgba(255, 255, 255, 0.15);
      cursor: pointer;
      transition: background 0.2s;
    }
    .auth-cancel-btn:hover {
      background: rgba(255, 255, 255, 0.18);
    }
    /* 点赞互动按钮 */
    .like-btn {
      position: relative;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.65rem;
      padding: 0.75rem 1.6rem;
      border-radius: 9999px;
      background: linear-gradient(135deg, #ec4899, #8b5cf6, #3b82f6);
      background-size: 200% 200%;
      color: #ffffff;
      font-size: 0.95rem;
      font-weight: 700;
      border: none;
      cursor: pointer;
      box-shadow: 0 10px 25px rgba(236, 72, 153, 0.35);
      transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
      user-select: none;
      -webkit-tap-highlight-color: transparent;
      outline: none;
      overflow: visible;
    }
    .like-btn:hover {
      transform: translateY(-2px) scale(1.02);
      box-shadow: 0 15px 32px rgba(236, 72, 153, 0.5);
    }
    .like-btn:active {
      transform: scale(0.95);
    }
    .like-btn.burst {
      animation: heartBeat 0.45s ease-in-out;
    }
    .like-icon {
      font-size: 1.25rem;
      display: inline-block;
      transition: transform 0.25s ease;
    }
    .like-btn.burst .like-icon {
      transform: scale(1.4) rotate(-15deg);
    }
    .like-badge {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 38px;
      padding: 0.2rem 0.65rem;
      border-radius: 9999px;
      background: rgba(0, 0, 0, 0.28);
      border: 1px solid rgba(255, 255, 255, 0.25);
      font-size: 0.88rem;
      font-weight: 800;
      color: #ffffff;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      letter-spacing: 0.03em;
    }
    /* 浮动飞出动画气泡 */
    .float-particle {
      position: absolute;
      pointer-events: none;
      font-size: 1.3rem;
      animation: floatUpFade 0.85s cubic-bezier(0.22, 1, 0.36, 1) forwards;
      z-index: 50;
      user-select: none;
    }
    @keyframes heartBeat {
      0% { transform: scale(1); }
      30% { transform: scale(1.12); }
      50% { transform: scale(0.97); }
      75% { transform: scale(1.05); }
      100% { transform: scale(1); }
    }
    @keyframes floatUpFade {
      0% {
        opacity: 1;
        transform: translate(0, 0) scale(0.8) rotate(0deg);
      }
      50% {
        opacity: 0.9;
        transform: translate(var(--tx, 0px), -45px) scale(1.3) rotate(var(--rot, 0deg));
      }
      100% {
        opacity: 0;
        transform: translate(var(--tx, 0px), -85px) scale(1) rotate(var(--rot, 0deg));
      }
    }
    /* 移动端与短屏幕严格适配，永不产生滚动条 */
    @media (max-width: 520px), (max-height: 750px) {
      .card {
        padding: 1.5rem 1.2rem;
        border-radius: 24px;
        width: 92%;
      }
      .avatar-row {
        gap: 0.6rem;
        margin-bottom: 0.7rem;
      }
      .avatar-item {
        width: 78px;
        height: 78px;
        border-radius: 14px;
      }
      h1 {
        font-size: 2.3rem;
        margin-bottom: 0.2rem;
      }
      .btn-group {
        gap: 0.6rem;
        margin-top: 0.7rem;
      }
      .gallery-btn, .pan-btn, .like-btn, .vocab-btn {
        padding: 0.65rem 1.2rem;
        font-size: 0.9rem;
      }
    }
    @media (max-height: 600px) {
      .card {
        padding: 1rem 1rem;
      }
      .avatar-item {
        width: 60px;
        height: 60px;
      }
      h1 {
        font-size: 1.8rem;
      }
      .btn-group {
        gap: 0.45rem;
      }
      .gallery-btn, .pan-btn, .like-btn, .takeout-portal-btn, .vocab-btn {
        padding: 0.5rem 1rem;
        font-size: 0.82rem;
      }
    }
  </style>
</head>
<body>
  <!-- 反重力动态粒子全屏交互画布 -->
  <canvas id="gravityCanvas"></canvas>
  <!-- 鼠标交互光晕 -->
  <div class="mouse-glow" id="mouseGlow"></div>

  <div class="card" id="tiltCard">
    <div class="avatar-row">
      <div class="avatar-item">
        <img src="./left_avatar.png" alt="图片1" class="avatar-img">
      </div>
      <div class="avatar-item">
        <img src="./OIP-C.jpg" alt="展示图片" class="avatar-img" id="secretClashTrigger" style="cursor: pointer;">
      </div>
      <div class="avatar-item">
        <img src="./right_avatar.jpg" alt="图片2" class="avatar-img">
      </div>
    </div>
    <h1>你好</h1>


    <!-- 快捷功能入口按钮组 -->
    <div class="btn-group">
      <!-- 全网云端同步互动点赞按钮 -->
      <button class="like-btn" id="likeBtn" onclick="handleClick(event)">
        <span class="like-icon" id="likeIcon">💖</span>
        <span>为网站点赞</span>
        <span class="like-badge" id="likeCount">...</span>
      </button>

      <!-- 沙县外卖记账助手入口（密码鉴权保护） -->
      <button class="takeout-portal-btn" id="takeoutBtn" onclick="openTakeoutPortal()">
        <span> 账单</span>
        <span style="font-size: 0.82em; opacity: 0.9;">(安全登录) →</span>
      </button>

      <!-- 高中英语课本查词系统入口 -->
      <a href="./vocab.html" class="vocab-btn" id="vocabLink">
        <span>📖 高中英语课本查词</span>
        <span style="font-size: 0.85em; opacity: 0.9;">(人教版7册/批量检测) →</span>
      </a>

      <a href="./gallery.html" class="gallery-btn">
        <span>🖼️ 查看精选图库</span>
        <span style="font-size: 0.85em; opacity: 0.9;">(121张) →</span>
      </a>
      <a href="./pan.html" class="pan-btn">
        <span>📁 资源网盘下载</span>
        <span style="font-size: 0.85em; opacity: 0.9;">(100MB极速) →</span>
      </a>
    </div>
  </div>

  <!-- 密码验证解锁弹窗 -->
  <div class="auth-modal-backdrop" id="authModalBackdrop">
    <div class="auth-modal-card">
      <div class="auth-title">
        <span>🔐</span>
        <span>账单</span>
      </div>
      <div class="auth-desc">请输入独立访问密码以进入（初始默认密码：<strong>8888</strong>）</div>
      <div class="auth-input-wrap">
        <input type="password" id="takeoutAuthInput" class="auth-input" placeholder="输入密码" maxlength="20">
      </div>
      <div class="auth-error" id="authErrorMsg"></div>
      <label class="auth-remember-row">
        <input type="checkbox" id="authRememberCheck" checked>
        <span>记住解锁状态 (30天免密访问)</span>
      </label>
      <div class="auth-btn-row">
        <button class="auth-cancel-btn" onclick="closeTakeoutAuthModal()">取消</button>
        <button class="auth-submit-btn" onclick="submitTakeoutAuth()">解锁进入 🚀</button>
      </div>
    </div>
  </div>

  <script>
    // 计数器配置：优先调用 Cloudflare Pages 原生私有后端 /api/click，降级支持公共 API
    const LOCAL_API = '/api/click';
    const FALLBACK_API_BASE = 'https://countapi.mileshilliard.com/api/v1';
    const FALLBACK_KEY = 'web_cenj_shared_clicks_v1';

    const countEl = document.getElementById('likeCount');
    const likeBtn = document.getElementById('likeBtn');
    const likeIcon = document.getElementById('likeIcon');

    let currentVal = 0;
    const icons = ['💖', '🎉', '✨', '🔥', '👏', '🌟', '🚀', '💯'];

    // 格式化数字
    function formatCount(num) {
      return Number(num).toLocaleString();
    }

    // 初始化获取云端最新计次
    async function initCount() {
      try {
        const res = await fetch(`${LOCAL_API}?t=${Date.now()}`, { cache: 'no-store' });
        if (res.ok) {
          const data = await res.json();
          if (data && typeof data.value === 'number') {
            currentVal = data.value;
            countEl.textContent = formatCount(currentVal);
            return;
          }
        }
      } catch (e) {}

      // 备用降级逻辑
      try {
        const res = await fetch(`${FALLBACK_API_BASE}/get/${FALLBACK_KEY}?t=${Date.now()}`, { cache: 'no-store' });
        if (res.ok) {
          const data = await res.json();
          currentVal = data.value || 0;
          countEl.textContent = formatCount(currentVal);
        } else {
          countEl.textContent = '0';
        }
      } catch (err) {
        countEl.textContent = currentVal || '0';
      }
    }

    // 批量同步队列：防止快速连点丢失
    let pendingClicks = 0;
    let syncTimer = null;
    let isSyncing = false;

    async function flushClicks() {
      if (pendingClicks <= 0 || isSyncing) return;
      const countToSend = pendingClicks;
      pendingClicks = 0;
      isSyncing = true;

      try {
        const res = await fetch(LOCAL_API, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ amount: countToSend }),
          keepalive: true
        });
        if (res.ok) {
          const data = await res.json();
          if (data && typeof data.value === 'number') {
            currentVal = Math.max(currentVal, data.value + pendingClicks);
            countEl.textContent = formatCount(currentVal);
          }
        } else {
          // 若失败归还计数
          pendingClicks += countToSend;
        }
      } catch (e) {
        pendingClicks += countToSend;
      } finally {
        isSyncing = false;
        // 如果在发送期间又有新的点击，继续发送
        if (pendingClicks > 0) {
          syncTimer = setTimeout(flushClicks, 400);
        }
      }
    }

    // 页面跳转或切后台时，使用 sendBeacon / keepalive 立即刷入云端
    function flushOnLeave() {
      if (pendingClicks > 0) {
        const payload = JSON.stringify({ amount: pendingClicks });
        pendingClicks = 0;
        if (navigator.sendBeacon) {
          const blob = new Blob([payload], { type: 'application/json' });
          navigator.sendBeacon(LOCAL_API, blob);
        } else {
          fetch(LOCAL_API, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: payload,
            keepalive: true
          });
        }
      }
    }

    window.addEventListener('pagehide', flushOnLeave);
    window.addEventListener('beforeunload', flushOnLeave);
    document.addEventListener('visibilitychange', () => {
      if (document.visibilityState === 'hidden') {
        flushOnLeave();
      }
    });

    // 点击事件：动画特效 + 云端计数 +1
    function handleClick(e) {
      // 1. 瞬时界面反馈（视觉无延迟）
      currentVal++;
      pendingClicks++;
      countEl.textContent = formatCount(currentVal);

      // 2. 按钮波纹与弹跳动画
      likeBtn.classList.remove('burst');
      void likeBtn.offsetWidth; // 触发 reflow
      likeBtn.classList.add('burst');

      // 3. 产生漂浮粒子特效
      spawnParticle(e);

      // 4. 防抖批量同步：连点时 350ms 内合并批量提交，减少网络阻塞
      if (syncTimer) clearTimeout(syncTimer);
      syncTimer = setTimeout(flushClicks, 350);
    }

    // 漂浮飞升粒子特效
    function spawnParticle(e) {
      const rect = likeBtn.getBoundingClientRect();
      const p = document.createElement('span');
      p.className = 'float-particle';

      const randomEmoji = icons[Math.floor(Math.random() * icons.length)];
      p.textContent = randomEmoji;

      // 随机横向偏移 (-35px 到 +35px) 和随机旋转角度
      const tx = (Math.random() * 70 - 35) + 'px';
      const rot = (Math.random() * 60 - 30) + 'deg';
      p.style.setProperty('--tx', tx);
      p.style.setProperty('--rot', rot);

      // 定位在按钮中间偏上位置
      const clickX = e ? e.clientX - rect.left : rect.width / 2;
      p.style.left = `${clickX}px`;
      p.style.top = '10px';

      likeBtn.appendChild(p);

      // 动画结束后移除元素
      setTimeout(() => {
        p.remove();
      }, 850);
    }

    // 页面加载时拉取
    initCount();

    /* ========================================================
       🌌 Antigravity 官网风格鼠标交互特效引擎
       1. 鼠标悬停 3D 卡片倾斜与视差跟随 (3D Tilt & Parallax)
       2. 鼠标聚光灯光晕跟随 (Spotlight Glow)
       3. 动态反重力星尘粒子系统 (Floating Gravitational Particles)
          - 鼠标靠近时光速排斥 / 引力扩散 (Magnetic Repulsion)
          - 粒子连线形成动态神经网络星座 (Interactive Constellation)
       ======================================================== */

    // 1. 鼠标光晕与 3D 卡片倾斜效果
    const tiltCard = document.getElementById('tiltCard');
    const mouseGlow = document.getElementById('mouseGlow');
    let mouseX = window.innerWidth / 2;
    let mouseY = window.innerHeight / 2;

    window.addEventListener('mousemove', (e) => {
      mouseX = e.clientX;
      mouseY = e.clientY;

      // 移动光晕
      mouseGlow.style.left = `${mouseX}px`;
      mouseGlow.style.top = `${mouseY}px`;

      // 计算卡片 3D 偏转
      if (tiltCard) {
        const rect = tiltCard.getBoundingClientRect();
        const cardCenterX = rect.left + rect.width / 2;
        const cardCenterY = rect.top + rect.height / 2;
        const deltaX = (e.clientX - cardCenterX) / (window.innerWidth / 2);
        const deltaY = (e.clientY - cardCenterY) / (window.innerHeight / 2);

        // 最大倾斜角度 12 度
        const rotateY = deltaX * 10;
        const rotateX = -deltaY * 10;
        tiltCard.style.transform = `perspective(1000px) rotateX(${rotateX.toFixed(2)}deg) rotateY(${rotateY.toFixed(2)}deg) translateY(-4px)`;
      }
    });

    window.addEventListener('mouseleave', () => {
      if (tiltCard) {
        tiltCard.style.transform = 'perspective(1000px) rotateX(0deg) rotateY(0deg) translateY(0px)';
      }
    });

    // 2. 反重力动态粒子全屏交互引擎
    const canvas = document.getElementById('gravityCanvas');
    const ctx = canvas.getContext('2d');

    let width = (canvas.width = window.innerWidth);
    let height = (canvas.height = window.innerHeight);

    window.addEventListener('resize', () => {
      width = canvas.width = window.innerWidth;
      height = canvas.height = window.innerHeight;
      initParticles();
    });

    const particles = [];
    const PARTICLE_COUNT = Math.min(Math.floor((width * height) / 12000), 90);

    class Particle {
      constructor() {
        this.reset();
        this.y = Math.random() * height; // 初次随机高度
      }

      reset() {
        this.x = Math.random() * width;
        this.y = height + 10;
        // 反重力：向上缓慢漂浮
        this.vy = -(Math.random() * 0.7 + 0.3);
        this.vx = (Math.random() - 0.5) * 0.5;
        // 冲击外力速度
        this.blastVx = 0;
        this.blastVy = 0;
        this.baseSize = Math.random() * 2 + 1;
        this.size = this.baseSize;
        this.alpha = Math.random() * 0.5 + 0.2;
        this.color = Math.random() > 0.4 ? '56, 189, 248' : '168, 85, 247'; // 霓虹天蓝或浅紫
      }

      update() {
        // 自然向上浮动与冲击力衰减
        this.y += this.vy + this.blastVy;
        this.x += this.vx + this.blastVx;

        // 冲击波惯性物理阻尼衰减
        this.blastVx *= 0.92;
        this.blastVy *= 0.92;

        // 鼠标常规悬停交互：反重力排斥力场
        const dx = this.x - mouseX;
        const dy = this.y - mouseY;
        const dist = Math.sqrt(dx * dx + dy * dy);
        const maxDist = 130;

        if (dist < maxDist) {
          const force = (1 - dist / maxDist) * 3.5;
          const angle = Math.atan2(dy, dx);
          this.x += Math.cos(angle) * force;
          this.y += Math.sin(angle) * force;
          this.size = this.baseSize * 1.5;
        } else {
          this.size = this.baseSize;
        }

        // 飞出屏幕边缘后循环到底部重置
        if (this.y < -20 || this.x < -30 || this.x > width + 30 || this.y > height + 30) {
          this.reset();
        }
      }

      // 施加冲击波爆炸推力
      applyBlast(bx, by, power, maxRadius) {
        const dx = this.x - bx;
        const dy = this.y - by;
        const dist = Math.sqrt(dx * dx + dy * dy);
        if (dist < maxRadius && dist > 1) {
          const force = (1 - dist / maxRadius) * power;
          const angle = Math.atan2(dy, dx);
          this.blastVx += Math.cos(angle) * force;
          this.blastVy += Math.sin(angle) * force;
        }
      }

      draw() {
        ctx.beginPath();
        ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
        ctx.fillStyle = `rgba(${this.color}, ${this.alpha})`;
        ctx.shadowBlur = 8;
        ctx.shadowColor = `rgba(${this.color}, 0.8)`;
        ctx.fill();
        ctx.shadowBlur = 0;
      }
    }

    // 冲击波能量环系统
    const shockwaves = [];
    class Shockwave {
      constructor(x, y) {
        this.x = x;
        this.y = y;
        this.radius = 5;
        this.maxRadius = 240;
        this.speed = 10;
        this.alpha = 0.8;
      }
      update() {
        this.radius += this.speed;
        this.alpha = (1 - this.radius / this.maxRadius) * 0.8;
      }
      draw() {
        if (this.alpha <= 0) return;
        ctx.beginPath();
        ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
        ctx.strokeStyle = `rgba(56, 189, 248, ${this.alpha * 0.6})`;
        ctx.lineWidth = 2.5;
        ctx.shadowBlur = 12;
        ctx.shadowColor = 'rgba(56, 189, 248, 0.8)';
        ctx.stroke();
        ctx.shadowBlur = 0;
      }
    }

    // 监听全屏点击：若点击卡片外的空白区域，触发强力冲击波冲开粒子
    window.addEventListener('pointerdown', (e) => {
      // 判断点击是否在卡片内部（如果在卡片内，则保持卡片按钮的原有交互，不触发全屏冲击）
      if (tiltCard && tiltCard.contains(e.target)) {
        return;
      }

      const clickX = e.clientX;
      const clickY = e.clientY;

      // 1. 生成向外扩散的科技冲击波能量光环
      shockwaves.push(new Shockwave(clickX, clickY));

      // 2. 强力冲开四周的粒子（高能引力爆破）
      particles.forEach(p => {
        p.applyBlast(clickX, clickY, 22, 280);
      });

      // 3. 产生额外的冲击火花碎片
      for (let i = 0; i < 18; i++) {
        const spark = new Particle();
        spark.x = clickX + (Math.random() - 0.5) * 15;
        spark.y = clickY + (Math.random() - 0.5) * 15;
        const angle = Math.random() * Math.PI * 2;
        const speed = Math.random() * 12 + 4;
        spark.blastVx = Math.cos(angle) * speed;
        spark.blastVy = Math.sin(angle) * speed;
        spark.size = Math.random() * 2.5 + 1.2;
        spark.alpha = 0.9;
        particles.push(spark);
      }
    });

    function initParticles() {
      particles.length = 0;
      for (let i = 0; i < PARTICLE_COUNT; i++) {
        particles.push(new Particle());
      }
    }

    function renderParticles() {
      ctx.clearRect(0, 0, width, height);

      // 绘制并更新冲击波能量环
      for (let i = shockwaves.length - 1; i >= 0; i--) {
        shockwaves[i].update();
        shockwaves[i].draw();
        if (shockwaves[i].radius >= shockwaves[i].maxRadius) {
          shockwaves.splice(i, 1);
        }
      }

      // 限制粒子总数，防止爆炸碎片无限累积
      if (particles.length > PARTICLE_COUNT + 60) {
        particles.splice(0, particles.length - (PARTICLE_COUNT + 40));
      }

      // 绘制粒子间连线（距离近时产生连接星座效果）
      for (let i = 0; i < particles.length; i++) {
        for (let j = i + 1; j < particles.length; j++) {
          const dx = particles[i].x - particles[j].x;
          const dy = particles[i].y - particles[j].y;
          const dist = Math.sqrt(dx * dx + dy * dy);
          if (dist < 95) {
            ctx.beginPath();
            ctx.moveTo(particles[i].x, particles[i].y);
            ctx.lineTo(particles[j].x, particles[j].y);
            ctx.strokeStyle = `rgba(56, 189, 248, ${(1 - dist / 95) * 0.18})`;
            ctx.lineWidth = 0.8;
            ctx.stroke();
          }
        }
      }

      // 更新和绘制每个粒子
      for (let i = 0; i < particles.length; i++) {
        particles[i].update();
        particles[i].draw();
      }

      requestAnimationFrame(renderParticles);
    }

    // ==================== 沙县外卖记账助手 密码鉴权系统 ====================
    const TAKEOUT_AUTH_KEY = 'takeout_auth_token_v1';
    const TAKEOUT_PWD_KEY = 'takeout_custom_password_v1';
    const TAKEOUT_DEFAULT_PWD = '8888';

    function isTakeoutAuthorized() {
      const token = localStorage.getItem(TAKEOUT_AUTH_KEY) || sessionStorage.getItem(TAKEOUT_AUTH_KEY);
      if (!token) return false;
      try {
        const data = JSON.parse(token);
        if (Date.now() - data.time < 30 * 24 * 60 * 60 * 1000) {
          return true;
        }
        localStorage.removeItem(TAKEOUT_AUTH_KEY);
        sessionStorage.removeItem(TAKEOUT_AUTH_KEY);
        return false;
      } catch (e) {
        return false;
      }
    }

    function openTakeoutPortal() {
      if (isTakeoutAuthorized()) {
        window.location.href = './takeout.html';
        return;
      }
      openTakeoutAuthModal();
    }

    function openTakeoutAuthModal() {
      const modal = document.getElementById('authModalBackdrop');
      const input = document.getElementById('takeoutAuthInput');
      const err = document.getElementById('authErrorMsg');
      if (err) {
        err.style.color = '#ef4444';
        err.textContent = '';
      }
      if (input) input.value = '';
      if (modal) modal.classList.add('show');
      setTimeout(() => { if (input) input.focus(); }, 150);
    }

    function closeTakeoutAuthModal() {
      const modal = document.getElementById('authModalBackdrop');
      if (modal) modal.classList.remove('show');
    }

    function submitTakeoutAuth() {
      const input = document.getElementById('takeoutAuthInput');
      const err = document.getElementById('authErrorMsg');
      const remember = document.getElementById('authRememberCheck').checked;
      const pwd = input ? input.value.trim() : '';

      const targetPwd = localStorage.getItem(TAKEOUT_PWD_KEY) || TAKEOUT_DEFAULT_PWD;

      if (!pwd) {
        if (err) {
          err.style.color = '#ef4444';
          err.textContent = '请输入访问密码';
        }
        return;
      }

      if (pwd === targetPwd) {
        const payload = JSON.stringify({ time: Date.now() });
        if (remember) {
          localStorage.setItem(TAKEOUT_AUTH_KEY, payload);
        } else {
          sessionStorage.setItem(TAKEOUT_AUTH_KEY, payload);
        }
        if (err) {
          err.style.color = '#10b981';
          err.textContent = '验证成功，正在进入...';
        }
        setTimeout(() => {
          window.location.href = './takeout.html';
        }, 250);
      } else {
        if (err) {
          err.style.color = '#ef4444';
          err.textContent = '密码错误，请重新输入（初始密码：8888）';
        }
        if (input) input.select();
      }
    }

    // 回车直接提交验证
    document.getElementById('takeoutAuthInput')?.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') {
        submitTakeoutAuth();
      }
    });

    // 检查 URL 是否带 need_auth 参数（从内部未授权被重定向回来时自动弹窗）
    try {
      const urlParams = new URLSearchParams(window.location.search);
      if (urlParams.get('need_auth') === '1') {
        openTakeoutAuthModal();
        const err = document.getElementById('authErrorMsg');
        if (err) err.textContent = '请先输入访问密码解锁进入';
      }
    } catch (e) {}
    // --- Clash Verge 远程控制 5次点击暗号与多Tab交互 ---
    let clashClickCount = 0;
    let clashClickTimer = null;
    let currentClashTab = 'hub';
    const triggerImg = document.getElementById('secretClashTrigger');

    if (triggerImg) {
      triggerImg.addEventListener('click', (e) => {
        clashClickCount++;
        clearTimeout(clashClickTimer);
        
        triggerImg.style.transform = `scale(${1 + clashClickCount * 0.05})`;
        setTimeout(() => { triggerImg.style.transform = ''; }, 150);

        if (clashClickCount >= 5) {
          clashClickCount = 0;
          window.open('./clash.html', '_blank');
        } else {
          clashClickTimer = setTimeout(() => {
            clashClickCount = 0;
          }, 1500);
        }
      });
    }

    function openClashModal() {
      const modal = document.getElementById('clashControlModal');
      if (modal) {
        modal.style.display = 'flex';
        const savedPwd = localStorage.getItem('clash_remote_pwd') || '8888';
        document.getElementById('clashPwdInput').value = savedPwd;
        switchClashTab('hub');
        refreshClashStatus();
      }
    }

    function closeClashModal() {
      const modal = document.getElementById('clashControlModal');
      if (modal) modal.style.display = 'none';
    }

    function switchClashTab(tabName) {
      currentClashTab = tabName;
      document.querySelectorAll('.clash-tab-btn').forEach(btn => {
        btn.classList.toggle('active', btn.getAttribute('data-tab') === tabName);
      });
      document.getElementById('clashTabHub').style.display = (tabName === 'hub') ? 'block' : 'none';
      document.getElementById('clashTabSpeed').style.display = (tabName === 'speed') ? 'block' : 'none';
      document.getElementById('clashTabSubs').style.display = (tabName === 'subs') ? 'block' : 'none';
      document.getElementById('clashTabNodes').style.display = (tabName === 'nodes') ? 'block' : 'none';
    }

    async function refreshClashStatus() {
      const pwd = document.getElementById('clashPwdInput').value.trim();
      const statusEl = document.getElementById('clashStatusText');
      const pcHbEl = document.getElementById('clashPCHb');
      const latestResultEl = document.getElementById('clashLatestResult');

      if (!pwd) return;
      statusEl.textContent = '🔄 同步中...';

      try {
        const res = await fetch(`/api/clash?pwd=${encodeURIComponent(pwd)}`);
        const data = await res.json();
        if (data.status === 'ok') {
          localStorage.setItem('clash_remote_pwd', pwd);
          statusEl.innerHTML = '<span style="color:#10b981;">● 已连接云端中继 (已激活动态高频同步)</span>';
          
          if (data.heartbeat) {
            const hb = data.heartbeat;
            if (hb.status === 'online') {
              pcHbEl.innerHTML = `💻 电脑状态：<span style="color:#10b981; font-weight:700;">● 在线</span> <span style="color:#cbd5e1; font-size:0.78rem;">(${hb.result.replace('在线 | ', '')})</span> <span style="font-size:0.72rem; color:#94a3b8;">(${hb.diff_sec}秒前活跃)</span>`;
            } else {
              const diffText = hb.diff_sec < 60 ? `${hb.diff_sec}秒前` : (hb.diff_sec < 3600 ? `${Math.round(hb.diff_sec/60)}分钟前` : `${Math.round(hb.diff_sec/3600)}小时前`);
              pcHbEl.innerHTML = `💻 电脑状态：<span style="color:#ef4444; font-weight:700;">○ 离线/已关机</span> <span style="font-size:0.75rem; color:#94a3b8;">(最后活跃于 ${diffText})</span>`;
            }
          } else {
            pcHbEl.innerHTML = `💻 电脑状态：<span style="color:#94a3b8;">暂无心跳记录</span>`;
          }

          if (data.latest_command) {
            const cmd = data.latest_command;
            const isDone = cmd.status === 'done';
            const isPending = cmd.status === 'pending';
            const badge = isDone ? '<span style="color:#10b981;">✅ 完成</span>' : (isPending ? '<span style="color:#f59e0b;">⏳ 电脑高速执行中</span>' : '<span style="color:#ef4444;">❌ 失败</span>');
            
            const formatT = (isoStr) => {
              if (!isoStr) return '';
              const d = new Date(isoStr);
              if (isNaN(d.getTime())) return isoStr;
              const pad = n => String(n).padStart(2, '0');
              return `${pad(d.getHours())}:${pad(d.getMinutes())}:${pad(d.getSeconds())}`;
            };

            const dispatchText = cmd.dispatched_at ? formatT(cmd.dispatched_at) : (cmd.updated_at || '刚刚');
            let responseText = '';
            let durationText = '';

            if (cmd.responded_at) {
              responseText = formatT(cmd.responded_at);
              if (cmd.dispatched_at) {
                const dur = Math.max(0, Math.round((new Date(cmd.responded_at) - new Date(cmd.dispatched_at)) / 1000));
                durationText = ` <span style="color:#60a5fa;">(耗时 ${dur}秒)</span>`;
              }
            } else if (isPending) {
              if (cmd.dispatched_at) {
                const wait = Math.max(0, Math.round((Date.now() - new Date(cmd.dispatched_at)) / 1000));
                responseText = `<span style="color:#fbbf24;">等待中... (已等 ${wait}秒)</span>`;
              } else {
                responseText = '<span style="color:#fbbf24;">等待响应...</span>';
              }
            } else {
              responseText = cmd.updated_at || '-';
            }

            latestResultEl.innerHTML = `
              <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:0.3rem;">
                <span style="font-weight:700; color:#fff;">最近指令: [${cmd.command}]</span>
                <span style="font-weight:700; font-size:0.8rem;">${badge}</span>
              </div>
              <div style="font-size:0.75rem; color:#94a3b8; display:flex; flex-wrap:wrap; gap:0.8rem; margin-bottom:0.3rem; background:rgba(0,0,0,0.3); padding:0.3rem 0.5rem; border-radius:6px;">
                <span>📤 下发: <strong style="color:#e2e8f0;">${dispatchText}</strong></span>
                <span>📥 回应: <strong style="color:#10b981;">${responseText}</strong>${durationText}</span>
              </div>
              <div style="color:#93c5fd; font-size:0.78rem;">${cmd.result || ''}</div>
            `;
          }

          renderSpeedList(data.speed_data);
          renderProfilesList(data.profiles_data);
          renderNodesList(data.nodes_data);
        } else {
          statusEl.innerHTML = `<span style="color:#ef4444;">❌ ${data.message || '密码错误'}</span>`;
        }
      } catch (e) {
        statusEl.innerHTML = `<span style="color:#ef4444;">❌ 网络异常</span>`;
      }
    }

    function renderSpeedList(speedData) {
      const container = document.getElementById('clashSpeedContainer');
      if (!speedData || !speedData.regions_summary || speedData.regions_summary.length === 0) {
        container.innerHTML = '<div style="color:#94a3b8; font-size:0.82rem; text-align:center; padding:1.5rem 0;">暂无常用地区测速，点击右上角【⚡ 刷新测速】获取...</div>';
        return;
      }

      let html = `<div style="font-size:0.75rem; color:#64748b; margin-bottom:0.6rem; text-align:right;">上次测速时间：${speedData.updated_at || '刚刚'}</div>`;
      
      speedData.regions_summary.forEach(reg => {
        const isBestValid = reg.best_delay && reg.best_delay !== '超时' && reg.best_delay !== '-';
        const delayBadgeColor = isBestValid ? (parseInt(reg.best_delay) < 100 ? '#10b981' : '#38bdf8') : '#ef4444';
        const safeBestNode = (reg.best_node || '').replace(/'/g, "\\'");

        html += `
          <div style="background:#1e293b; border:${reg.active ? '1px solid #0284c7' : '1px solid #334155'}; border-radius:10px; padding:0.75rem; margin-bottom:0.6rem;">
            <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:0.4rem;">
              <span style="font-weight:700; color:#f8fafc; font-size:0.92rem; display:inline-flex; align-items:center; gap:0.4rem;">
                ${reg.label}
                <span style="font-size:0.75rem; color:#94a3b8; font-weight:normal;">(${reg.node_count}个节点)</span>
              </span>
              <span style="background:rgba(15,23,42,0.6); color:${delayBadgeColor}; font-weight:700; font-size:0.85rem; padding:0.2rem 0.55rem; border-radius:6px; border:1px solid ${delayBadgeColor}44;">
                ${reg.best_delay}
              </span>
            </div>
            
            <div style="display:flex; justify-content:space-between; align-items:center; margin-top:0.35rem;">
              <span style="font-size:0.78rem; color:#94a3b8; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; max-width:65%;">
                最快: <span style="color:#cbd5e1;">${reg.best_node || '暂无'}</span>
              </span>
              ${reg.best_node ? `
                <button onclick="sendClashCommand('switch_node', '${safeBestNode}')" style="background:#0284c7; border:none; color:#fff; font-size:0.72rem; font-weight:600; padding:0.25rem 0.55rem; border-radius:4px; cursor:pointer;">
                  一键切此最快
                </button>
              ` : ''}
            </div>
          </div>
        `;
      });

      container.innerHTML = html;
    }

    function renderProfilesList(profilesData) {
      const container = document.getElementById('clashProfilesContainer');
      if (!profilesData || !profilesData.items || profilesData.items.length === 0) {
        container.innerHTML = '<div style="color:#94a3b8; font-size:0.85rem; text-align:center; padding:1.5rem 0;">电脑端正在初次同步订阅列表，稍等片刻后刷新...</div>';
        return;
      }

      let html = '';
      profilesData.items.forEach(p => {
        const activeBadge = p.is_active ? 
          '<span style="background:#0284c7; color:#fff; font-size:0.72rem; padding:0.2rem 0.5rem; border-radius:4px; font-weight:700;">当前生效中</span>' : 
          `<button onclick="sendClashCommand('switch_profile', '${p.uid}')" style="background:#334155; border:none; color:#f8fafc; font-size:0.75rem; padding:0.25rem 0.6rem; border-radius:6px; cursor:pointer; font-weight:600;">切换到此订阅</button>`;

        html += `
          <div style="background:#1e293b; border:${p.is_active ? '1px solid #0284c7' : '1px solid #334155'}; border-radius:10px; padding:0.75rem; margin-bottom:0.6rem;">
            <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:0.4rem;">
              <span style="font-weight:700; color:#f8fafc; font-size:0.92rem;">${p.name || p.uid}</span>
              ${activeBadge}
            </div>
            <div style="font-size:0.8rem; color:#94a3b8; line-height:1.5;">
              <div>流量：<span style="color:#38bdf8;">${p.used_gb} GB</span> / ${p.total_gb > 0 ? p.total_gb + ' GB' : '不限'} | 到期：<span style="color:#e2e8f0;">${p.expire}</span></div>
              <div style="word-break:break-all; font-size:0.75rem; color:#64748b; margin-top:0.25rem;">${p.url || ''}</div>
            </div>
          </div>
        `;
      });
      container.innerHTML = html;
    }

    function renderNodesList(nodesData) {
      const container = document.getElementById('clashNodesContainer');
      if (!nodesData || !nodesData.regions) {
        container.innerHTML = '<div style="color:#94a3b8; font-size:0.85rem; text-align:center; padding:1.5rem 0;">电脑端正在测速并汇总节点，请稍后刷新...</div>';
        return;
      }

      let html = '';
      const nowNode = nodesData.now || '';

      for (const [region, nodes] of Object.entries(nodesData.regions)) {
        if (!nodes || nodes.length === 0) continue;
        const count = nodes.length;
        const containsActive = nodes.some(n => n.name === nowNode);
        
        html += `
          <details ${containsActive ? 'open' : ''} style="background:#1e293b; border-radius:8px; margin-bottom:0.6rem; border:1px solid #334155; overflow:hidden;">
            <summary style="padding:0.6rem 0.8rem; font-size:0.88rem; font-weight:700; color:#cbd5e1; cursor:pointer; background:#182234; display:flex; justify-content:space-between; align-items:center; list-style:none;">
              <span>${region} (${count})</span>
              ${containsActive ? '<span style="color:#38bdf8; font-size:0.75rem; font-weight:normal;">● 正在使用此区域</span>' : '<span style="color:#64748b; font-size:0.75rem;">展开 ▼</span>'}
            </summary>
            <div style="padding:0.5rem; max-height:220px; overflow-y:auto;">
        `;

        nodes.forEach(n => {
          const isCurrent = (n.name === nowNode);
          const safeName = n.name.replace(/'/g, "\\'");
          html += `
            <div onclick="sendClashCommand('switch_node', '${safeName}')" style="display:flex; justify-content:space-between; align-items:center; padding:0.45rem 0.6rem; margin-bottom:0.35rem; border-radius:6px; cursor:pointer; background:${isCurrent ? 'rgba(2, 132, 199, 0.25)' : '#0f172a'}; border:${isCurrent ? '1px solid #0284c7' : '1px solid rgba(255,255,255,0.05)'};">
              <span style="font-size:0.82rem; color:${isCurrent ? '#38bdf8' : '#e2e8f0'}; font-weight:${isCurrent ? '700' : '400'}; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; max-width:70%;">
                ${isCurrent ? '✔ ' : ''}${n.name}
              </span>
              <span style="font-size:0.75rem; color:${n.delay_num < 100 ? '#10b981' : (n.delay_num < 250 ? '#38bdf8' : '#94a3b8')}; font-weight:600;">
                ${n.delay}
              </span>
            </div>
          `;
        });

        html += `
            </div>
          </details>
        `;
      }
      container.innerHTML = html;
    }

    async function sendClashCommand(command, payload = '') {
      const pwd = document.getElementById('clashPwdInput').value.trim();
      const statusEl = document.getElementById('clashStatusText');
      if (!pwd) {
        alert('请输入控制密码');
        return;
      }

      statusEl.innerHTML = '⚡ 正在下发指令并触发电脑高频执行...';

      try {
        const res = await fetch('/api/clash', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ pwd, action: 'dispatch_command', command, payload })
        });
        const data = await res.json();
        if (data.status === 'ok') {
          statusEl.innerHTML = '<span style="color:#10b981;">🚀 指令已直达云端！电脑秒级响应中...</span>';
          refreshClashStatus();
          setTimeout(refreshClashStatus, 1200);
          setTimeout(refreshClashStatus, 2500);
          setTimeout(refreshClashStatus, 4500);
          setTimeout(refreshClashStatus, 7000);
        } else {
          statusEl.innerHTML = `<span style="color:#ef4444;">❌ 失败: ${data.message}</span>`;
        }
      } catch (e) {
        statusEl.innerHTML = `<span style="color:#ef4444;">❌ 网络请求失败</span>`;
      }
    }

    function submitNewSub() {
      const url = document.getElementById('newSubUrlInput').value.trim();
      if (!url || !url.startsWith('http')) {
        alert('请输入有效的 http/https 订阅链接');
        return;
      }
      sendClashCommand('update_sub', url);
      document.getElementById('newSubUrlInput').value = '';
    }

    initParticles();
    renderParticles();
  </script>

  <!-- Clash Verge 隐藏控制终端弹窗 (Tab化专业管理面板) -->
  <style>
    .clash-tab-btn {
      flex: 1;
      background: transparent;
      border: none;
      color: #94a3b8;
      font-weight: 600;
      font-size: 0.85rem;
      padding: 0.5rem;
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.2s ease;
    }
    .clash-tab-btn.active {
      background: #0284c7;
      color: #ffffff;
      box-shadow: 0 2px 8px rgba(2, 132, 199, 0.4);
    }
  </style>

  <div id="clashControlModal" style="display:none; position:fixed; inset:0; z-index:99999; background:rgba(10, 15, 29, 0.85); backdrop-filter:blur(16px); -webkit-backdrop-filter:blur(16px); align-items:center; justify-content:center; padding:0.8rem;">
    <div style="background:#0f172a; border:1px solid rgba(56, 189, 248, 0.35); border-radius:18px; max-width:480px; width:100%; box-shadow:0 20px 50px rgba(0,0,0,0.6); padding:1.2rem; color:#f8fafc; font-family:-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,sans-serif; position:relative; max-height:92vh; display:flex; flex-direction:column;">
      
      <!-- 弹窗标题栏 -->
      <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:0.75rem; border-bottom:1px solid rgba(255,255,255,0.1); padding-bottom:0.6rem;">
        <div style="display:flex; align-items:center; gap:0.5rem; font-weight:700; font-size:1.05rem; color:#38bdf8;">
          <span>⚡</span>
          <span>Clash Verge 智能云控终端</span>
        </div>
        <button onclick="closeClashModal()" style="background:transparent; border:none; color:#94a3b8; font-size:1.5rem; cursor:pointer; line-height:1;">&times;</button>
      </div>

      <!-- 选项卡导航栏 (4个Tab) -->
      <div style="display:flex; background:#1e293b; padding:0.25rem; border-radius:10px; margin-bottom:0.8rem; gap:0.25rem;">
        <button class="clash-tab-btn active" data-tab="hub" onclick="switchClashTab('hub')">⚡ 中枢</button>
        <button class="clash-tab-btn" data-tab="speed" onclick="switchClashTab('speed')">🚀 常用测速</button>
        <button class="clash-tab-btn" data-tab="subs" onclick="switchClashTab('subs')">📋 订阅</button>
        <button class="clash-tab-btn" data-tab="nodes" onclick="switchClashTab('nodes')">🌍 节点</button>
      </div>

      <!-- 状态指示条 -->
      <div style="margin-bottom:0.8rem;">
        <div style="display:flex; gap:0.5rem; align-items:center; margin-bottom:0.4rem;">
          <input type="password" id="clashPwdInput" placeholder="密码(8888)" style="flex:1; background:#1e293b; border:1px solid #334155; border-radius:6px; padding:0.4rem 0.6rem; color:#fff; font-size:0.85rem; outline:none;">
          <button onclick="refreshClashStatus()" style="background:#0284c7; border:none; color:#fff; border-radius:6px; padding:0.4rem 0.75rem; font-size:0.82rem; font-weight:600; cursor:pointer;">刷新同步</button>
          <button onclick="sendClashCommand('check_delay')" style="background:linear-gradient(135deg, #10b981, #059669); border:none; color:#fff; border-radius:6px; padding:0.4rem 0.75rem; font-size:0.82rem; font-weight:700; cursor:pointer; box-shadow:0 2px 8px rgba(16,185,129,0.35); display:inline-flex; align-items:center; gap:0.25rem;">
            <span>⚡</span>
            <span>测速刷新</span>
          </button>
        </div>
        <div id="clashStatusText" style="font-size:0.78rem; color:#94a3b8;">正在检测云端连接...</div>
        <div id="clashPCHb" style="font-size:0.8rem; background:#1e293b; padding:0.4rem 0.6rem; border-radius:6px; color:#cbd5e1; margin-top:0.3rem;">💻 电脑状态：获取中...</div>
      </div>

      <!-- 可滚动内容区 -->
      <div style="flex:1; overflow-y:auto; padding-right:0.2rem;">

        <!-- TAB 1: 控制中枢 -->
        <div id="clashTabHub">
          <!-- 快速换新订阅 -->
          <div style="background:rgba(30, 41, 59, 0.7); border:1px solid rgba(56, 189, 248, 0.2); border-radius:10px; padding:0.8rem; margin-bottom:0.8rem;">
            <div style="font-size:0.85rem; font-weight:600; color:#e2e8f0; margin-bottom:0.4rem;">🔗 远程添加/更新订阅链接</div>
            <input type="text" id="newSubUrlInput" placeholder="粘贴新订阅链接 (https://...)" style="width:100%; box-sizing:border-box; background:#0f172a; border:1px solid #334155; border-radius:6px; padding:0.5rem 0.6rem; color:#fff; font-size:0.82rem; margin-bottom:0.5rem; outline:none;">
            <button onclick="submitNewSub()" style="width:100%; background:linear-gradient(135deg, #0284c7, #06b6d4); border:none; color:#fff; border-radius:6px; padding:0.55rem; font-weight:700; font-size:0.85rem; cursor:pointer;">🚀 极速下发电脑生效</button>
          </div>

          <!-- 常用地区快捷切节点 -->
          <div style="margin-bottom:0.8rem;">
            <div style="font-size:0.85rem; font-weight:600; color:#cbd5e1; margin-bottom:0.4rem;">🌍 快捷切换常用区域</div>
            <div style="display:grid; grid-template-columns:1fr 1fr; gap:0.4rem;">
              <button onclick="sendClashCommand('switch_node', 'Singapore')" style="background:#1e293b; border:1px solid #334155; color:#f1f5f9; padding:0.5rem; border-radius:6px; font-size:0.82rem; font-weight:600; cursor:pointer;">🇸🇬 新加坡节点</button>
              <button onclick="sendClashCommand('switch_node', 'Hong Kong')" style="background:#1e293b; border:1px solid #334155; color:#f1f5f9; padding:0.5rem; border-radius:6px; font-size:0.82rem; font-weight:600; cursor:pointer;">🇭🇰 香港节点</button>
              <button onclick="sendClashCommand('switch_node', 'Japan')" style="background:#1e293b; border:1px solid #334155; color:#f1f5f9; padding:0.5rem; border-radius:6px; font-size:0.82rem; font-weight:600; cursor:pointer;">🇯🇵 日本节点</button>
              <button onclick="sendClashCommand('switch_node', 'auto_lowest')" style="background:#1e293b; border:1px solid #0284c7; color:#38bdf8; padding:0.5rem; border-radius:6px; font-size:0.82rem; font-weight:600; cursor:pointer;">⚡ 自动选最低延迟</button>
            </div>
          </div>

          <!-- 快捷操作按钮 -->
          <div style="display:flex; gap:0.4rem; margin-bottom:0.8rem;">
            <button onclick="sendClashCommand('check_delay')" style="flex:1; background:#334155; border:none; color:#f8fafc; padding:0.5rem; border-radius:6px; font-size:0.8rem; cursor:pointer;">📡 全量测速</button>
            <button onclick="sendClashCommand('sync_all')" style="flex:1; background:#0369a1; border:none; color:#f8fafc; padding:0.5rem; border-radius:6px; font-size:0.8rem; cursor:pointer;">🔄 同步订阅列表</button>
            <button onclick="sendClashCommand('restart')" style="flex:1; background:#475569; border:none; color:#f8fafc; padding:0.5rem; border-radius:6px; font-size:0.8rem; cursor:pointer;">⚙️ 重启内核</button>
          </div>
        </div>

        <!-- TAB: 常用测速 (专为6大核心常用地区定制) -->
        <div id="clashTabSpeed" style="display:none;">
          <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:0.6rem;">
            <span style="font-size:0.85rem; font-weight:600; color:#cbd5e1;">🚀 常用核心地区延迟看板</span>
            <button onclick="sendClashCommand('check_delay')" style="background:linear-gradient(135deg, #10b981, #059669); border:none; color:#fff; font-size:0.75rem; padding:0.25rem 0.6rem; border-radius:6px; cursor:pointer; font-weight:700;">⚡ 刷新测速</button>
          </div>
          <div id="clashSpeedContainer">
            <div style="color:#94a3b8; font-size:0.82rem; text-align:center; padding:1.5rem 0;">点击下方刷新状态或刷新测速获取...</div>
          </div>
        </div>

        <!-- TAB 2: 订阅管理 -->
        <div id="clashTabSubs" style="display:none;">
          <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:0.6rem;">

            <div style="color:#94a3b8; font-size:0.82rem; text-align:center; padding:1.5rem 0;">点击下方刷新状态获取订阅...</div>
          </div>
        </div>

        <!-- TAB 3: 节点列表 -->
        <div id="clashTabNodes" style="display:none;">
          <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:0.6rem;">

          <div id="clashNodesContainer">
            <div style="color:#94a3b8; font-size:0.82rem; text-align:center; padding:1.5rem 0;">点击刷新状态获取节点...</div>
          </div>

      </div>

        最近指令反馈将显示在这里...
      </div>

    </div>
  </div>
</body>
