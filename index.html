<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#faf9f5">
  <meta name="description" content="数字工作台：即输即查英语词典、智能过词、视界画廊、资源网盘与游乐场。">
  <title>Cenj · 数字工作台</title>
  <link rel="icon" href="./OIP-C.jpg" type="image/jpeg">
  <script>
    (function(){try{var t=localStorage.getItem("cenj_theme_v1");var d=t==="dark"||(t!=="light"&&window.matchMedia("(prefers-color-scheme: dark)").matches);document.documentElement.dataset.theme=d?"dark":"light";document.documentElement.classList.toggle("dark",d);var m=document.querySelector('meta[name="theme-color"]');if(m)m.content=d?"#262624":"#faf9f5";}catch(e){}})();
  </script>
  <link rel="preconnect" href="https://fonts.loli.net" crossorigin>
  <link rel="stylesheet" href="https://fonts.loli.net/css2?family=Noto+Serif+SC:wght@400;500;600;700&display=swap">
  <link rel="stylesheet" href="./src/styles/base.css">
  <link rel="stylesheet" href="./src/styles/shell.css">
  <link rel="stylesheet" href="./src/styles/index.css">
</head>
<body>
  <main class="workspace-stage" id="tiltCard">
    <!-- 顶部轻量栏（手机端由 shell.ts 顶栏承接） -->
    <header class="workspace-topbar">
      <div class="avatar-cluster" aria-label="站点标识">
        <span class="edition-tag">EDITION · CENJ</span>
      </div>

      <div class="topbar-actions">
        <button type="button" class="like-btn" id="likeBtn" aria-label="点赞" title="点赞">
          <span class="like-icon" id="likeIcon" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg>
          </span>
          <span class="like-badge" id="likeCount">···</span>
        </button>
        <button type="button" class="theme-toggle-btn" data-theme-toggle aria-label="切换深浅色主题" title="切换深浅色主题">
          <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.65" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
          <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.65" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"/></svg>
        </button>
      </div>
    </header>

    <!-- Claude 风格居中主舞台 -->
    <section class="claude-centerpiece" aria-labelledby="greetingTitle">
      <div class="greeting-header">
        <span class="greeting-star" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="currentColor">
            <path d="M12 2L13.7 9.1L20.1 5.6L15.2 11.1L22 12L15.2 12.9L20.1 18.4L13.7 14.9L12 22L10.3 14.9L3.9 18.4L8.8 12.9L2 12L8.8 11.1L3.9 5.6L10.3 9.1Z"/>
          </svg>
        </span>
        <h1 id="greetingTitle">你好</h1>
      </div>
      <p class="greeting-sub">在这里直接输入英文即时查词，或输入关键词直达全站页面</p>

      <!-- 居中万能直达框 (Claude Composer 质感) -->
      <div class="omnibox-shell">
        <form class="omnibox-card" id="omniboxForm" role="search">
          <div class="omnibox-input-row">
            <svg class="omnibox-lead-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <circle cx="11" cy="11" r="7"/>
              <path d="M21 21l-4.35-4.35"/>
            </svg>
            <input
              type="text"
              id="omniboxInput"
              class="omnibox-input"
              placeholder="输入英文单词即输即查（如 abandon），或搜索页面名称..."
              autocomplete="off"
              spellcheck="false"
            >
            <button type="button" id="omniboxClearBtn" class="omnibox-clear-btn" style="display: none;" aria-label="清空输入">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M18 6L6 18M6 6l12 12"/></svg>
            </button>
            <button type="submit" class="omnibox-submit-btn" aria-label="立即查询或前往">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 5l7 7-7 7"/></svg>
            </button>
          </div>

          <div class="omnibox-hints">
            <span class="hint-label">试一试：</span>
            <button type="button" class="sample-chip" data-omni-sample="abandon">abandon</button>
            <button type="button" class="sample-chip" data-omni-sample="resilient">resilient</button>
            <button type="button" class="sample-chip" data-omni-sample="persuade">persuade</button>
            <button type="button" class="sample-chip" data-cmd-open>⌘K 命令面板</button>
          </div>
        </form>

        <!-- 即时查词与页面匹配结果面板 -->
        <div class="omnibox-results" id="omniboxResults" aria-live="polite"></div>
      </div>
    </section>

    <footer class="workspace-foot">EDITION CENJ · 按 <kbd>⌘K</kbd> 随时唤起全局命令面板</footer>
  </main>

  <script type="module" src="./src/pages/index/main.ts"></script>
</body>
</html>
