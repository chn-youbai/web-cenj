<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#f5f5f7">
  <title>精彩图库 - Photo Gallery</title>
  <link rel="stylesheet" href="./css/base.css">
  <style>
    *,
    *::before,
    *::after {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      min-height: 100vh;
      min-height: 100dvh;
      background: var(--c-bg);
      font-family: var(--font-sans);
      color: var(--c-label);
      line-height: 1.47;
      padding-bottom: calc(var(--sp-10) + var(--safe-bottom));
    }

    /* ---------- 页头：大标题 + 操作 ---------- */
    .header {
      max-width: 1200px;
      margin: 0 auto;
      padding: calc(var(--sp-8) + var(--safe-top)) max(var(--sp-4), var(--safe-right)) var(--sp-4) max(var(--sp-4), var(--safe-left));
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      flex-wrap: wrap;
      gap: var(--sp-4);
    }
    .title-group {
      min-width: 0;
      flex: 1 1 280px;
    }
    .title-group h1 {
      font-size: clamp(28px, 7vw, 40px);
      font-weight: 700;
      letter-spacing: -0.02em;
      line-height: 1.12;
      color: var(--c-label);
      overflow-wrap: anywhere;
      margin-bottom: var(--sp-1);
    }
    .title-group p {
      color: var(--c-label-2);
      font-size: 15px;
      line-height: 1.4;
      overflow-wrap: anywhere;
    }
    .header-actions {
      display: flex;
      gap: var(--sp-2);
      flex-wrap: wrap;
      align-items: center;
    }

    /* 按钮：主要 (accent) / 次要 (fill) */
    .upload-link-btn,
    .back-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      min-height: var(--tap);
      padding: 0 var(--sp-5);
      border-radius: var(--r-pill);
      border: none;
      text-decoration: none;
      font-size: 15px;
      font-weight: 600;
      letter-spacing: -0.01em;
      white-space: nowrap;
      cursor: pointer;
      transition: background-color var(--dur-1) var(--ease), transform var(--dur-1) var(--ease);
    }
    .upload-link-btn {
      background: var(--c-accent);
      color: #fff;
    }
    .back-btn {
      background: var(--c-fill);
      color: var(--c-label);
    }
    @media (hover: hover) {
      .upload-link-btn:hover { background: var(--c-accent-hover); }
      .back-btn:hover { background: var(--c-fill-strong); }
    }
    .upload-link-btn:active { background: var(--c-accent-press); transform: scale(0.97); }
    .back-btn:active { background: var(--c-fill-strong); transform: scale(0.97); }

    /* ---------- 分类选项卡：吸顶毛玻璃条 ---------- */
    .category-tabs {
      position: sticky;
      top: 0;
      z-index: 50;
      display: flex;
      gap: var(--sp-2);
      padding: calc(var(--sp-2) + var(--safe-top)) max(var(--sp-4), var(--safe-right), calc((100% - 1200px) / 2 + var(--sp-4))) var(--sp-2) max(var(--sp-4), var(--safe-left), calc((100% - 1200px) / 2 + var(--sp-4)));
      margin-bottom: var(--sp-4);
      background: var(--c-material);
      -webkit-backdrop-filter: saturate(180%) blur(20px);
      backdrop-filter: saturate(180%) blur(20px);
      border-bottom: 0.5px solid var(--c-separator);
      overflow-x: auto;
      scrollbar-width: none;
    }
    .category-tabs::-webkit-scrollbar { display: none; }
    .cat-tab {
      flex: 0 0 auto;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      min-height: 36px;
      padding: 0 var(--sp-4);
      border: none;
      border-radius: var(--r-pill);
      background: var(--c-fill);
      color: var(--c-label);
      font-family: inherit;
      font-size: 15px;
      font-weight: 500;
      white-space: nowrap;
      cursor: pointer;
      position: relative;
      transition: background-color var(--dur-1) var(--ease), color var(--dur-1) var(--ease), transform var(--dur-1) var(--ease);
    }
    /* 扩大触控热区到 44px，而不改变视觉尺寸 */
    .cat-tab::after {
      content: "";
      position: absolute;
      inset: -4px 0;
    }
    .cat-tab.active {
      background: var(--c-label);
      color: #fff;
    }
    @media (hover: hover) {
      .cat-tab:not(.active):hover { background: var(--c-fill-strong); }
    }
    .cat-tab:active { transform: scale(0.97); }

    /* ---------- 照片网格：iOS 相册式紧凑方格 ---------- */
    .gallery-grid {
      max-width: 1200px;
      margin: 0 auto;
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 2px;
    }
    .gallery-item {
      position: relative;
      overflow: hidden;
      aspect-ratio: 1 / 1;
      background: var(--c-fill);
      cursor: pointer;
      min-width: 0;
    }
    .gallery-item img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      transition: transform var(--dur-2) var(--ease), opacity var(--dur-1) var(--ease);
    }
    .gallery-item:active img { opacity: 0.8; }
    .overlay {
      position: absolute;
      inset: 0;
      background: linear-gradient(to top, rgba(0, 0, 0, 0.45) 0%, rgba(0, 0, 0, 0) 45%);
      opacity: 0;
      transition: opacity var(--dur-2) var(--ease);
      display: flex;
      align-items: flex-end;
      padding: var(--sp-2) var(--sp-3);
      pointer-events: none;
    }
    .overlay span {
      font-size: 13px;
      color: #fff;
      font-weight: 500;
      text-overflow: ellipsis;
      overflow: hidden;
      white-space: nowrap;
      min-width: 0;
    }
    @media (hover: hover) {
      .gallery-item:hover img { transform: scale(1.03); }
      .gallery-item:hover .overlay { opacity: 1; }
    }
    .gallery-item:focus-visible { outline-offset: -3px; }

    @media (min-width: 600px) {
      .gallery-grid {
        grid-template-columns: repeat(4, minmax(0, 1fr));
        gap: 4px;
        padding: 0 var(--sp-4);
      }
    }
    @media (min-width: 900px) {
      .gallery-grid { grid-template-columns: repeat(5, minmax(0, 1fr)); }
    }

    /* ---------- 视频卡片网格 ---------- */
    .video-grid {
      max-width: 1200px;
      margin: 0 auto;
      padding: 0 max(var(--sp-4), var(--safe-right)) 0 max(var(--sp-4), var(--safe-left));
      display: none;
      grid-template-columns: repeat(auto-fill, minmax(min(100%, 300px), 1fr));
      gap: var(--sp-4);
    }
    .video-item-card {
      position: relative;
      min-width: 0;
      border-radius: var(--r-lg);
      overflow: hidden;
      background: var(--c-surface);
      box-shadow: var(--sh-1);
      cursor: pointer;
      display: flex;
      flex-direction: column;
      transition: transform var(--dur-2) var(--ease), box-shadow var(--dur-2) var(--ease);
    }
    @media (hover: hover) {
      .video-item-card:hover { box-shadow: var(--sh-2); transform: translateY(-2px); }
      .video-item-card:hover .video-thumb-wrap img { transform: scale(1.02); }
    }
    .video-item-card:active { transform: scale(0.98); }
    .video-thumb-wrap {
      position: relative;
      width: 100%;
      aspect-ratio: 16 / 9;
      background: #000;
      overflow: hidden;
    }
    .video-thumb-wrap img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      transition: transform var(--dur-2) var(--ease);
    }
    .video-play-badge {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 52px;
      height: 52px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.72);
      -webkit-backdrop-filter: saturate(180%) blur(20px);
      backdrop-filter: saturate(180%) blur(20px);
      color: var(--c-label);
      font-size: 18px;
      line-height: 1;
      padding-left: 3px;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 2px 12px rgba(0, 0, 0, 0.15);
      pointer-events: none;
    }
    .video-duration-pill {
      position: absolute;
      bottom: var(--sp-2);
      right: var(--sp-2);
      background: rgba(0, 0, 0, 0.55);
      -webkit-backdrop-filter: blur(8px);
      backdrop-filter: blur(8px);
      color: #fff;
      font-size: 12px;
      font-weight: 600;
      font-variant-numeric: tabular-nums;
      padding: 2px var(--sp-2);
      border-radius: 6px;
    }
    .video-info-box {
      padding: var(--sp-3) var(--sp-4) var(--sp-4);
      display: flex;
      flex-direction: column;
      gap: var(--sp-1);
      min-width: 0;
    }
    .video-title {
      font-size: 17px;
      font-weight: 600;
      letter-spacing: -0.01em;
      color: var(--c-label);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .video-meta-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: var(--sp-2);
      flex-wrap: wrap;
      font-size: 13px;
      color: var(--c-label-2);
    }

    /* ---------- 视频播放弹窗（保持深色） ---------- */
    .video-modal {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.88);
      -webkit-backdrop-filter: blur(20px);
      backdrop-filter: blur(20px);
      display: none;
      justify-content: center;
      align-items: center;
      z-index: 1100;
      padding: calc(var(--sp-4) + var(--safe-top)) max(var(--sp-4), var(--safe-right)) calc(var(--sp-4) + var(--safe-bottom)) max(var(--sp-4), var(--safe-left));
    }
    .video-modal.active { display: flex; }
    .video-modal-card {
      width: 100%;
      max-width: 960px;
      background: #1c1c1e;
      border-radius: var(--r-lg);
      overflow: hidden;
      display: flex;
      flex-direction: column;
      box-shadow: var(--sh-3);
      position: relative;
    }
    .video-modal-header {
      padding: var(--sp-2) var(--sp-2) var(--sp-2) var(--sp-4);
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: var(--sp-3);
      border-bottom: 0.5px solid rgba(255, 255, 255, 0.12);
    }
    .video-modal-title {
      font-size: 17px;
      font-weight: 600;
      color: #f5f5f7;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      min-width: 0;
    }
    .video-modal-close,
    .close-btn {
      flex: 0 0 auto;
      width: var(--tap);
      height: var(--tap);
      border-radius: 50%;
      border: none;
      background: rgba(255, 255, 255, 0.14);
      color: #f5f5f7;
      font-family: inherit;
      font-size: 24px;
      line-height: 1;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background-color var(--dur-1) var(--ease), transform var(--dur-1) var(--ease);
    }
    @media (hover: hover) {
      .video-modal-close:hover,
      .close-btn:hover { background: rgba(255, 255, 255, 0.24); }
    }
    .video-modal-close:active,
    .close-btn:active { transform: scale(0.94); background: rgba(255, 255, 255, 0.28); }
    .video-modal-player-wrap {
      position: relative;
      width: 100%;
      background: #000;
      min-height: 200px;
      max-height: 72vh;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
    }
    .video-modal-player-wrap video {
      max-width: 100%;
      max-height: 72vh;
      width: auto;
      height: auto;
      display: block;
      outline: none;
      object-fit: contain;
    }
    .video-modal-footer {
      padding: var(--sp-3) var(--sp-4);
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: var(--sp-3);
    }
    .video-modal-meta {
      font-size: 13px;
      color: rgba(235, 235, 245, 0.6);
      font-variant-numeric: tabular-nums;
      min-width: 0;
      overflow-wrap: anywhere;
    }
    .download-video-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      min-height: var(--tap);
      padding: 0 var(--sp-5);
      background: var(--c-accent);
      color: #fff;
      text-decoration: none;
      font-size: 15px;
      font-weight: 600;
      border-radius: var(--r-pill);
      white-space: nowrap;
      transition: background-color var(--dur-1) var(--ease), transform var(--dur-1) var(--ease);
    }
    @media (hover: hover) {
      .download-video-btn:hover { background: var(--c-accent-hover); }
    }
    .download-video-btn:active { background: var(--c-accent-press); transform: scale(0.97); }

    /* ---------- 照片大图浏览（iOS 相册式全黑） ---------- */
    .lightbox {
      position: fixed;
      inset: 0;
      background: #000;
      display: none;
      justify-content: center;
      align-items: center;
      z-index: 1000;
      padding: calc(var(--sp-4) + var(--safe-top)) var(--safe-right) calc(var(--sp-4) + var(--safe-bottom)) var(--safe-left);
      user-select: none;
      -webkit-user-select: none;
      touch-action: none;
    }
    .lightbox.active { display: flex; }
    .lightbox-content {
      position: relative;
      display: flex;
      justify-content: center;
      align-items: center;
      max-width: 100vw;
      max-height: 86vh;
    }
    .lightbox img {
      max-width: 100vw;
      max-height: 82vh;
      max-height: 82dvh;
      object-fit: contain;
      transition: opacity var(--dur-2) var(--ease), transform var(--dur-2) var(--ease);
      touch-action: pan-y;
      display: block;
    }
    .close-btn {
      position: absolute;
      top: calc(var(--sp-3) + var(--safe-top));
      right: max(var(--sp-3), var(--safe-right));
      z-index: 1020;
    }
    .nav-arrow {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      width: var(--tap);
      height: var(--tap);
      border-radius: 50%;
      border: none;
      background: rgba(255, 255, 255, 0.14);
      -webkit-backdrop-filter: blur(20px);
      backdrop-filter: blur(20px);
      color: #f5f5f7;
      font-size: 16px;
      line-height: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      z-index: 1010;
      user-select: none;
      transition: background-color var(--dur-1) var(--ease), transform var(--dur-1) var(--ease);
    }
    @media (hover: hover) {
      .nav-arrow:hover { background: rgba(255, 255, 255, 0.24); }
    }
    .nav-arrow:active { transform: translateY(-50%) scale(0.94); background: rgba(255, 255, 255, 0.28); }
    .nav-arrow.prev { left: max(var(--sp-3), var(--safe-left)); }
    .nav-arrow.next { right: max(var(--sp-3), var(--safe-right)); }
    .lightbox-counter {
      position: absolute;
      bottom: calc(var(--sp-4) + var(--safe-bottom));
      left: 50%;
      transform: translateX(-50%);
      padding: var(--sp-1) var(--sp-3);
      background: rgba(255, 255, 255, 0.14);
      -webkit-backdrop-filter: blur(20px);
      backdrop-filter: blur(20px);
      border-radius: var(--r-pill);
      color: #f5f5f7;
      font-size: 13px;
      font-weight: 600;
      font-variant-numeric: tabular-nums;
      z-index: 1010;
      pointer-events: none;
    }
    .lightbox :focus-visible,
    .video-modal :focus-visible {
      outline-color: rgba(255, 255, 255, 0.7);
    }

    .video-state {
      grid-column: 1 / -1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: var(--sp-3);
      text-align: center;
      color: var(--c-label-2);
      padding: 56px var(--sp-4);
      font-size: 15px;
    }
    .video-state.error {
      color: var(--c-danger);
    }

    @media (min-width: 768px) {
      .nav-arrow { width: 52px; height: 52px; font-size: 18px; }
      .nav-arrow.prev { left: var(--sp-6); }
      .nav-arrow.next { right: var(--sp-6); }
      .lightbox img { max-width: 86vw; }
    }
    @media (max-width: 480px) {
      .header { padding-top: calc(var(--sp-6) + var(--safe-top)); }
      .header-actions { width: 100%; }
      .header-actions > a { flex: 1 1 0; min-width: 0; padding: 0 var(--sp-3); }
      .video-modal { padding-left: 0; padding-right: 0; }
      .video-modal-card { border-radius: var(--r-md); }
      .download-video-btn { width: 100%; }
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="title-group">
      <h1>视界画廊与视频专区</h1>
      <p>精选航拍照片与高清视频 · 在线秒播与原画下载</p>
    </div>
    <div class="header-actions">
      <a href="./upload.html" class="upload-link-btn">
        <span>+</span> 投递视频
      </a>
      <a href="./index.html" class="back-btn">
        <span>←</span> 返回主页
      </a>
    </div>
  </div>

  <!-- 分类选项卡 -->
  <div class="category-tabs">
    <button class="cat-tab active" id="tabPhotoBtn" onclick="switchCategory('photo')">
      <span>📷</span> 精选摄影 (<span id="photoCount">121</span>)
    </button>
    <button class="cat-tab" id="tabVideoBtn" onclick="switchCategory('video')">
      <span>🎬</span> 视频专区 (<span id="videoCount">0</span>)
    </button>
  </div>

  <!-- 图片瀑布流 -->
  <div class="gallery-grid" id="galleryGrid"></div>

  <!-- 视频卡片流 -->
  <div class="video-grid" id="videoGrid"></div>

  <!-- 视频大屏播放弹窗 -->

      <div class="video-modal-header">
        <div class="video-modal-title" id="videoModalTitle">视频播放</div>
        <button class="video-modal-close" onclick="closeVideoModal()" aria-label="关闭">&times;</button>
      </div>
      <div class="video-modal-player-wrap">
        <video id="activePlayer" controls playsinline preload="metadata"></video>
      </div>
      <div class="video-modal-footer">
        <div class="video-modal-meta" id="videoModalMeta">时长: -- · 体积: --</div>
        <a id="videoDownloadBtn" href="#" class="download-video-btn" download target="_blank">
          <span>📥</span> 下载原始视频 (原画)
        </a>
      </div>
    </div>
  </div>

  <div class="lightbox" id="lightbox" onclick="closeLightbox(event)">
    <button class="close-btn" onclick="closeLightbox()" aria-label="关闭">&times;</button>
    <button class="nav-arrow prev" onclick="prevImage(event)" aria-label="上一张">&#10094;</button>
    
    <div class="lightbox-content" onclick="event.stopPropagation()">
      <img id="lightboxImg" src="" alt="大图预览">
    </div>

    <button class="nav-arrow next" onclick="nextImage(event)" aria-label="下一张">&#10095;</button>
    <div class="lightbox-counter" id="lightboxCounter">1 / 23</div>
  </div>

    const grid = document.getElementById('galleryGrid');
    const lightbox = document.getElementById('lightbox');
    const lightboxImg = document.getElementById('lightboxImg');
    const counterEl = document.getElementById('lightboxCounter');
    let currentIndex = 0;

    function renderGallery() {
      const pCountEl = document.getElementById('photoCount');
      if (pCountEl) pCountEl.textContent = images.length;
      grid.innerHTML = '';
      images.forEach((imgName, index) => {
        const item = document.createElement('div');
        item.className = 'gallery-item';
        item.onclick = () => openLightbox(index);

        item.innerHTML = `
          <img src="${getImageUrl(imgName)}" alt="照片 ${index + 1}" loading="lazy">
          <div class="overlay">
            <span>作品 #${index + 1}</span>
          </div>
        `;
        grid.appendChild(item);
      });
    }

    renderGallery();

    // 动态同步云端最新相册目录
    fetch(`${IMAGE_CDN_BASE}/images.json`)
      .then(res => res.ok ? res.json() : null)
      .then(cloudImages => {
        if (Array.isArray(cloudImages) && cloudImages.length > 0) {
          if (cloudImages.length !== images.length || cloudImages[0] !== images[0]) {
            images = cloudImages;
            renderGallery();
          }
        }
      })
      .catch(err => console.debug('Using cached/embedded image list'));

    function updateLightbox(direction = 0) {
      const targetSrc = getImageUrl(images[currentIndex]);
      if (direction !== 0) {
        lightboxImg.style.opacity = '0';
        lightboxImg.style.transform = `translateX(${direction > 0 ? '25px' : '-25px'}) scale(0.96)`;
        setTimeout(() => {
          lightboxImg.src = targetSrc;
          counterEl.textContent = `${currentIndex + 1} / ${images.length}`;
          lightboxImg.style.opacity = '1';
          lightboxImg.style.transform = 'translateX(0) scale(1)';
        }, 120);
      } else {
        lightboxImg.src = targetSrc;
        counterEl.textContent = `${currentIndex + 1} / ${images.length}`;
        lightboxImg.style.opacity = '1';
        lightboxImg.style.transform = 'none';
      }
    }

    function openLightbox(index) {
      currentIndex = index;
      updateLightbox(0);
      lightbox.classList.add('active');
      document.body.style.overflow = 'hidden'; // 防止背景滚动
    }

    function closeLightbox(e) {
      if (!e || e.target === lightbox || e.target.classList.contains('close-btn')) {
        lightbox.classList.remove('active');
        lightboxImg.src = '';
        document.body.style.overflow = '';
      }
    }

    function prevImage(e) {
      if (e) e.stopPropagation();
      currentIndex = (currentIndex - 1 + images.length) % images.length;
      updateLightbox(-1);
    }

    function nextImage(e) {
      if (e) e.stopPropagation();
      currentIndex = (currentIndex + 1) % images.length;
      updateLightbox(1);
    }

    // 键盘左右方向键与 ESC 支持
    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape' && videoModal.classList.contains('active')) {
        closeVideoModal();
        return;
      }
      if (!lightbox.classList.contains('active')) return;
      if (e.key === 'ArrowLeft') prevImage();
      else if (e.key === 'ArrowRight') nextImage();
      else if (e.key === 'Escape') closeLightbox();
    });

    // 触摸屏幕左右滑动手势（手机端流畅滑动支持）
    let touchStartX = 0;
    let touchStartY = 0;
    let touchEndX = 0;
    let touchEndY = 0;

    lightbox.addEventListener('touchstart', (e) => {
      touchStartX = e.changedTouches[0].screenX;
      touchStartY = e.changedTouches[0].screenY;
    }, { passive: true });

    lightbox.addEventListener('touchend', (e) => {
      touchEndX = e.changedTouches[0].screenX;
      touchEndY = e.changedTouches[0].screenY;
      handleSwipe();
    }, { passive: true });

    function handleSwipe() {
      const diffX = touchEndX - touchStartX;
      const diffY = touchEndY - touchStartY;
      const threshold = 40; // 滑动阈值 40px

      // 确保水平滑动幅度明显大于垂直滑动幅度
      if (Math.abs(diffX) > Math.abs(diffY) && Math.abs(diffX) > threshold) {
        if (diffX < 0) {
          nextImage(); // 向左滑 -> 下一张
        } else {
          prevImage(); // 向右滑 -> 上一张
        }
      }
    }

    // ==========================================
    // 视频专区业务逻辑 (Cloudflare D1 + Range)
    // ==========================================
    let currentCategory = 'photo';
    let loadedVideos = [];

    function formatDuration(sec) {
      sec = Math.round(sec || 0);
      const m = Math.floor(sec / 60);
      const s = sec % 60;
      return `${m < 10 ? '0' : ''}${m}:${s < 10 ? '0' : ''}${s}`;
    }

    function formatBytes(bytes) {
      if (!bytes || bytes === 0) return '未知大小';
      const mb = bytes / (1024 * 1024);
      if (mb >= 1000) return (mb / 1024).toFixed(2) + ' GB';
      return mb.toFixed(1) + ' MB';
    }

    function switchCategory(cat) {
      currentCategory = cat;
      const photoBtn = document.getElementById('tabPhotoBtn');
      const videoBtn = document.getElementById('tabVideoBtn');
      const photoGrid = document.getElementById('galleryGrid');
      const videoGrid = document.getElementById('videoGrid');

      if (cat === 'photo') {
        photoBtn.classList.add('active');
        videoBtn.classList.remove('active');
        photoGrid.style.display = 'grid';
        videoGrid.style.display = 'none';
      } else {
        videoBtn.classList.add('active');
        photoBtn.classList.remove('active');
        photoGrid.style.display = 'none';
        videoGrid.style.display = 'grid';
        if (loadedVideos.length > 0) {
          renderVideos();
        } else {
          fetchVideos();
        }
      }
    }

    async function fetchVideos() {
      const vGrid = document.getElementById('videoGrid');
      vGrid.innerHTML = '<div class="video-state"><span class="ui-spinner" aria-hidden="true"></span><span>加载视频专区中...</span></div>';

      try {
        const res = await fetch('/api/videos?t=' + Date.now());
        const data = await res.json();
        loadedVideos = data.videos || [];
        document.getElementById('videoCount').textContent = loadedVideos.length;
        renderVideos();
      } catch (err) {
        vGrid.innerHTML = '<div class="video-state error">视频加载失败，请刷新重试</div>';
      }
    }

    function renderVideos() {
      const vGrid = document.getElementById('videoGrid');
      if (loadedVideos.length === 0) {
        vGrid.innerHTML = `
          <div class="video-state">
            <div style="font-size: 2.5rem; line-height: 1;">🎬</div>
            <p style="font-size: 17px; font-weight: 600; color: var(--c-label);">暂无已上架的视频</p>
            <p style="font-size: 14px; color: var(--c-label-2); max-width: 320px;">点击右上角「+ 投递视频」直接从手机相册上传 500MB~2GB 航拍大作</p>
            <a href="./upload.html" class="upload-link-btn" style="margin-top: 4px;">去手机相册上传视频 &rarr;</a>
          </div>
        `;
        return;
      }

      vGrid.innerHTML = '';
      loadedVideos.forEach((v) => {
        const card = document.createElement('div');
        card.className = 'video-item-card';
        card.onclick = () => openVideoModal(v);

        const durationStr = formatDuration(v.duration);
        const sizeStr = formatBytes(v.file_size);
        const posterSrc = v.poster_url || './favicon.ico';

        card.innerHTML = `
          <div class="video-thumb-wrap">
            <img src="${posterSrc}" alt="${v.title}" loading="lazy">
            <div class="video-play-badge">▶</div>
            <div class="video-duration-pill">${durationStr}</div>
          </div>
          <div class="video-info-box">
            <div class="video-title">${v.title}</div>
            <div class="video-meta-row">
              <span>文件: ${sizeStr}</span>
              <span>原画秒播 / 下载</span>
            </div>
          </div>
        `;
        vGrid.appendChild(card);
      });
    }

    const videoModal = document.getElementById('videoModal');
    const activePlayer = document.getElementById('activePlayer');
    const videoModalTitle = document.getElementById('videoModalTitle');
    const videoModalMeta = document.getElementById('videoModalMeta');
    const videoDownloadBtn = document.getElementById('videoDownloadBtn');

    function openVideoModal(v) {
      videoModalTitle.textContent = v.title;
      videoModalMeta.textContent = `时长: ${formatDuration(v.duration)} · 体积: ${formatBytes(v.file_size)}`;

      const ext = (v.asset_url || '').toLowerCase().endsWith('.mov') ? 'video.mov' : 'video.mp4';
      const streamUrl = `/api/video?id=${v.id}&name=${ext}`;
      const downloadUrl = `/api/video?id=${v.id}&download=1`;

      activePlayer.poster = v.poster_url || '';
      activePlayer.src = streamUrl;
      activePlayer.load();
      videoDownloadBtn.href = downloadUrl;

      videoModal.classList.add('active');
      document.body.style.overflow = 'hidden';
      activePlayer.play().catch((err) => {
        console.warn('Autoplay prevented, user can tap play:', err);
      });
    }

    function closeVideoModal(e) {
      if (!e || e.target === videoModal || e.target.classList.contains('video-modal-close')) {
        videoModal.classList.remove('active');
        activePlayer.pause();
        activePlayer.src = '';
        document.body.style.overflow = '';
      }
    }

    // 后台预拉取视频数量徽章
    fetch('/api/videos?t=' + Date.now())
      .then(r => r.json())
      .then(d => {
        if (d && Array.isArray(d.videos)) {
          loadedVideos = d.videos;
          const vCountEl = document.getElementById('videoCount');
          if (vCountEl) vCountEl.textContent = d.videos.length;
          if (currentCategory === 'video') {
            renderVideos();
          }
        }
      }).catch(() => {});

  </script>
