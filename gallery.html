<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#f5f5f7">
  <title>精彩图库 - Photo Gallery</title>
  <link rel="stylesheet" href="./src/styles/base.css">
  <link rel="stylesheet" href="./src/styles/gallery.css">
</head>
<body>
  <div class="header">
    <div class="title-group">
      <h1>视界画廊与视频专区</h1>
      <p>精选航拍照片与高清视频 · 在线秒播与原画下载</p>
    </div>
    <div class="header-actions">
      <a href="./upload.html" class="upload-link-btn">
        <span>+</span> 投递视频
      </a>
      <a href="./index.html" class="back-btn">
        <span>←</span> 返回主页
      </a>
    </div>
  </div>

  <!-- 分类选项卡 -->
  <div class="category-tabs">
    <button type="button" class="cat-tab active" id="tabPhotoBtn">
      <span>📷</span> 精选摄影 (<span id="photoCount">121</span>)
    </button>
    <button type="button" class="cat-tab" id="tabVideoBtn">
      <span>🎬</span> 视频专区 (<span id="videoCount">0</span>)
    </button>
  </div>

  <!-- 图片瀑布流 -->
  <div class="gallery-grid" id="galleryGrid"></div>

  <!-- 视频卡片流 -->
  <div class="video-grid" id="videoGrid"></div>

  <!-- 视频大屏播放弹窗 -->
  <div class="video-modal" id="videoModal">
    <div class="video-modal-card">
      <div class="video-modal-header">
        <div class="video-modal-title" id="videoModalTitle">视频播放</div>
        <button type="button" class="video-modal-close" aria-label="关闭">&times;</button>
      </div>
      <div class="video-modal-player-wrap">
        <video id="activePlayer" controls playsinline preload="metadata"></video>
      </div>
      <div class="video-modal-footer">
        <div class="video-modal-meta" id="videoModalMeta">时长: -- · 体积: --</div>
        <a id="videoDownloadBtn" href="#" class="download-video-btn" download target="_blank" rel="noopener noreferrer">
          <span>📥</span> 下载原始视频 (原画)
        </a>
      </div>
    </div>
  </div>

  <!-- 照片大图浏览 -->
  <div class="lightbox" id="lightbox">
    <button type="button" class="close-btn" aria-label="关闭">&times;</button>
    <button type="button" class="nav-arrow prev" aria-label="上一张">&#10094;</button>

    <div class="lightbox-content">
      <img id="lightboxImg" src="" alt="大图预览">
    </div>

    <button type="button" class="nav-arrow next" aria-label="下一张">&#10095;</button>
    <div class="lightbox-counter" id="lightboxCounter">1 / 121</div>
  </div>

  <script type="module" src="./src/pages/gallery/main.ts"></script>
</body>
</html>
