  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      min-height: 100vh;
      background: radial-gradient(circle at 50% 10%, #1e293b, #0f172a);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      color: #f8fafc;
      padding: 2rem 1.5rem;
    }
    .header {
      max-width: 1300px;
      margin: 0 auto 2.5rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 1rem;
      padding-bottom: 1.5rem;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
    }
    .title-group h1 {
      font-size: 2.2rem;
      font-weight: 800;
      background: linear-gradient(135deg, #00dfd8, #007cf0, #7928ca);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 0.3rem;
    }
    .title-group p {
      color: #94a3b8;
      font-size: 0.95rem;
    }
    .back-btn {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      padding: 0.7rem 1.4rem;
      border-radius: 9999px;
      background: rgba(255, 255, 255, 0.08);
      color: #f8fafc;
      text-decoration: none;
      font-weight: 600;
      font-size: 0.95rem;
      border: 1px solid rgba(255, 255, 255, 0.15);
      backdrop-filter: blur(10px);
      transition: all 0.25s ease;
    }
    .back-btn:hover {
      background: rgba(0, 124, 240, 0.25);
      border-color: #007cf0;
      color: #38bdf8;
      transform: translateX(-4px);
    }
    .gallery-grid {
      max-width: 1300px;
      margin: 0 auto;
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 1.5rem;
    }
    .gallery-item {
      position: relative;
      border-radius: 20px;
      overflow: hidden;
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(255, 255, 255, 0.08);
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.35);
      cursor: pointer;
      aspect-ratio: 4 / 3;
      transition: transform 0.3s ease, box-shadow 0.3s ease, border-color 0.3s ease;
    }
    .gallery-item:hover {
      transform: translateY(-6px);
      box-shadow: 0 20px 40px rgba(0, 124, 240, 0.25);
      border-color: rgba(56, 189, 248, 0.5);
    }
    .gallery-item img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      transition: transform 0.4s ease;
    }
    .gallery-item:hover img {
      transform: scale(1.06);
    }
    .overlay {
      position: absolute;
      inset: 0;
      background: linear-gradient(to top, rgba(15, 23, 42, 0.8) 0%, transparent 60%);
      opacity: 0;
      transition: opacity 0.3s ease;
      display: flex;
      align-items: flex-end;
      padding: 1rem;
    }
    .gallery-item:hover .overlay {
      opacity: 1;
    }
    .overlay span {
      font-size: 0.85rem;
      color: #e2e8f0;
      font-weight: 500;
      text-overflow: ellipsis;
      overflow: hidden;
      white-space: nowrap;
    }
    /* Lightbox Modal */
    .lightbox {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.94);
      backdrop-filter: blur(16px);
      display: none;
      justify-content: center;
      align-items: center;
      z-index: 1000;
      padding: 1.5rem;
      user-select: none;
      touch-action: none;
    }
    .lightbox.active {
      display: flex;
    }
    .lightbox-content {
      position: relative;
      display: flex;
      justify-content: center;
      align-items: center;
      max-width: 92vw;
      max-height: 86vh;
    }
    .lightbox img {
      max-width: 92vw;
      max-height: 84vh;
      border-radius: 16px;
      box-shadow: 0 25px 60px rgba(0, 0, 0, 0.8);
      object-fit: contain;
      transition: opacity 0.25s ease, transform 0.25s ease;
      touch-action: pan-y;
      display: block;
    }
    /* 宸﹀彸鍒囨崲绠ご鎸夐挳 */
    .nav-arrow {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      width: 52px;
      height: 52px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.14);
      border: 1px solid rgba(255, 255, 255, 0.25);
      color: #ffffff;
      font-size: 1.6rem;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      backdrop-filter: blur(10px);
      transition: all 0.25s ease;
      z-index: 1010;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }
    .nav-arrow:hover {
      background: rgba(56, 189, 248, 0.35);
      border-color: #38bdf8;
      color: #38bdf8;
      transform: translateY(-50%) scale(1.1);
    }
    .nav-arrow.prev {
      left: 1.5rem;
    }
    .nav-arrow.next {
      right: 1.5rem;
    }
    /* 搴曢儴璁℃暟鍣ㄥ窘绔?*/
    .lightbox-counter {
      position: absolute;
      bottom: 1.5rem;
      left: 50%;
      transform: translateX(-50%);
      padding: 0.4rem 1.1rem;
      background: rgba(0, 0, 0, 0.55);
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 9999px;
      color: #f1f5f9;
      font-size: 0.9rem;
      font-weight: 600;
      letter-spacing: 0.05em;
      backdrop-filter: blur(8px);
      z-index: 1010;
      pointer-events: none;
    }
    .close-btn {
      position: absolute;
      top: 1.5rem;
      right: 1.8rem;
      background: rgba(255, 255, 255, 0.15);
      border: 1px solid rgba(255, 255, 255, 0.2);
      color: #fff;
      font-size: 1.8rem;
      width: 48px;
      height: 48px;
      border-radius: 50%;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.2s, transform 0.2s;
      z-index: 1020;
    }
    .close-btn:hover {
      background: rgba(239, 68, 68, 0.8);
      transform: scale(1.08);
    }
    @media (max-width: 640px) {
      .nav-arrow {
        width: 42px;
        height: 42px;
        font-size: 1.3rem;
      }
      .nav-arrow.prev { left: 0.6rem; }
      .nav-arrow.next { right: 0.6rem; }
      .close-btn { top: 1rem; right: 1rem; width: 40px; height: 40px; font-size: 1.5rem; }
    }
  </style>

];

    document.getElementById('count').textContent = images.length;
    const grid = document.getElementById('galleryGrid');

    images.forEach((imgName, index) => {
      const item = document.createElement('div');
      item.className = 'gallery-item';
      item.onclick = () => openLightbox(index);

      item.innerHTML = `
        <img src="./p/${imgName}" alt="鐓х墖 ${index + 1}" loading="lazy">
        <div class="overlay">
          <span>浣滃搧 #${index + 1}</span>
        </div>
      `;
      grid.appendChild(item);
    });

    const lightbox = document.getElementById('lightbox');
    const lightboxImg = document.getElementById('lightboxImg');
    const counterEl = document.getElementById('lightboxCounter');
    let currentIndex = 0;

    function updateLightbox(direction = 0) {
      if (direction !== 0) {
        // 杞诲井鍒囧浘鍔ㄦ晥
        lightboxImg.style.opacity = '0';
        lightboxImg.style.transform = `translateX(${direction > 0 ? '25px' : '-25px'}) scale(0.96)`;
        setTimeout(() => {
          lightboxImg.src = `./p/${images[currentIndex]}`;
          counterEl.textContent = `${currentIndex + 1} / ${images.length}`;
          lightboxImg.style.opacity = '1';
          lightboxImg.style.transform = 'translateX(0) scale(1)';
        }, 120);
      } else {
        lightboxImg.src = `./p/${images[currentIndex]}`;
        counterEl.textContent = `${currentIndex + 1} / ${images.length}`;
        lightboxImg.style.opacity = '1';
        lightboxImg.style.transform = 'none';
      }
    }

    function openLightbox(index) {
      currentIndex = index;
      updateLightbox(0);
      lightbox.classList.add('active');
      document.body.style.overflow = 'hidden'; // 闃叉鑳屾櫙婊氬姩
    }

    function closeLightbox(e) {
      if (!e || e.target === lightbox || e.target.classList.contains('close-btn')) {
        lightbox.classList.remove('active');
        lightboxImg.src = '';
        document.body.style.overflow = '';
      }
    }

    function prevImage(e) {
      if (e) e.stopPropagation();
      currentIndex = (currentIndex - 1 + images.length) % images.length;
      updateLightbox(-1);
    }

    function nextImage(e) {
      if (e) e.stopPropagation();
      currentIndex = (currentIndex + 1) % images.length;
      updateLightbox(1);
    }

    // 閿洏宸﹀彸鏂瑰悜閿笌 ESC 鏀寔
    document.addEventListener('keydown', (e) => {
      if (!lightbox.classList.contains('active')) return;
      if (e.key === 'ArrowLeft') prevImage();
      else if (e.key === 'ArrowRight') nextImage();
      else if (e.key === 'Escape') closeLightbox();
    });

    // 瑙︽懜灞忓箷宸﹀彸婊戝姩鎵嬪娍锛堟墜鏈虹娴佺晠婊戝姩鏀寔锛?    let touchStartX = 0;
    let touchStartY = 0;
    let touchEndX = 0;
    let touchEndY = 0;

    lightbox.addEventListener('touchstart', (e) => {
      touchStartX = e.changedTouches[0].screenX;
      touchStartY = e.changedTouches[0].screenY;
    }, { passive: true });

    lightbox.addEventListener('touchend', (e) => {
      touchEndX = e.changedTouches[0].screenX;
      touchEndY = e.changedTouches[0].screenY;
      handleSwipe();
    }, { passive: true });

    function handleSwipe() {
      const diffX = touchEndX - touchStartX;
      const diffY = touchEndY - touchStartY;
      const threshold = 40; // 婊戝姩闃堝€?40px

      // 纭繚姘村钩婊戝姩骞呭害鏄庢樉澶т簬鍨傜洿婊戝姩骞呭害
      if (Math.abs(diffX) > Math.abs(diffY) && Math.abs(diffX) > threshold) {
        if (diffX < 0) {
          nextImage(); // 鍚戝乏婊?-> 涓嬩竴寮?        } else {
          prevImage(); // 鍚戝彸婊?-> 涓婁竴寮?        }
      }
    }
