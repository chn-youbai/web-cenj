<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#faf9f5">
  <title>视界画廊与视频专区 - Photo Gallery</title>
  <link rel="icon" href="./OIP-C.jpg" type="image/jpeg">
  <script>
    (function(){try{var t=localStorage.getItem("cenj_theme_v1");var d=t==="dark"||(t!=="light"&&window.matchMedia("(prefers-color-scheme: dark)").matches);document.documentElement.dataset.theme=d?"dark":"light";document.documentElement.classList.toggle("dark",d);var m=document.querySelector('meta[name="theme-color"]');if(m)m.content=d?"#262624":"#faf9f5";}catch(e){}})();
  </script>
  <link rel="preconnect" href="https://fonts.loli.net" crossorigin>
  <link rel="stylesheet" href="https://fonts.loli.net/css2?family=Noto+Serif+SC:wght@400;500;600;700&display=swap">
  <link rel="stylesheet" href="./src/styles/base.css">
  <link rel="stylesheet" href="./src/styles/shell.css">
  <link rel="stylesheet" href="./src/styles/gallery.css">
</head>
<body>
  <header class="header">
    <div class="title-group">
      <div class="eyebrow">ARCHIVE · GALLERY</div>
      <h1>视界画廊与视频专区</h1>
      <p>精选航拍照片与高清视频 · 在线秒播与原画下载</p>
    </div>
    <div class="header-actions">
      <a href="./upload.html" class="upload-link-btn">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
        <span>投递视频</span>
      </a>
    </div>
  </header>

  <!-- 分类选项卡 -->
  <nav class="category-tabs" aria-label="画廊分类">
    <button type="button" class="cat-tab active" id="tabPhotoBtn">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="3"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="M21 15l-5-5L5 21"/></svg>
      <span>精选摄影</span>
      <span class="tab-count" id="photoCount">121</span>
    </button>
    <button type="button" class="cat-tab" id="tabVideoBtn">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="2" y="4" width="20" height="16" rx="2.5"/><path d="M10 9l5 3-5 3V9z"/></svg>
      <span>视频专区</span>
      <span class="tab-count" id="videoCount">0</span>
    </button>
  </nav>

  <!-- 图片瀑布流 -->
  <div class="gallery-grid" id="galleryGrid"></div>

  <!-- 视频卡片流 -->
  <div class="video-grid" id="videoGrid"></div>

  <!-- 视频大屏播放弹窗 -->
  <div class="video-modal" id="videoModal">
    <div class="video-modal-card">
      <div class="video-modal-header">
        <div class="video-modal-title" id="videoModalTitle">视频播放</div>
        <button type="button" class="video-modal-close" aria-label="关闭">&times;</button>
      </div>
      <div class="video-modal-player-wrap">
        <video id="activePlayer" controls playsinline preload="metadata"></video>
      </div>
      <div class="video-modal-footer">
        <div class="video-modal-meta" id="videoModalMeta">时长: -- · 体积: --</div>
        <a id="videoDownloadBtn" href="#" class="download-video-btn" download target="_blank" rel="noopener noreferrer">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><path d="M7 10l5 5 5-5"/><path d="M12 15V3"/></svg>
          <span>下载原始视频 (原画)</span>
        </a>
      </div>
    </div>
  </div>

  <!-- 照片大图浏览 -->
  <div class="lightbox" id="lightbox">
    <button type="button" class="close-btn" aria-label="关闭">&times;</button>
    <button type="button" class="nav-arrow prev" aria-label="上一张">&#10094;</button>

    <div class="lightbox-content">
      <img id="lightboxImg" src="" alt="大图预览">
    </div>

    <button type="button" class="nav-arrow next" aria-label="下一张">&#10095;</button>
    <div class="lightbox-counter" id="lightboxCounter">1 / 121</div>
  </div>

  <script type="module" src="./src/pages/gallery/main.ts"></script>
</body>
</html>
