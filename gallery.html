<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>精彩图库 - Photo Gallery</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      min-height: 100vh;
      background: radial-gradient(circle at 50% 10%, #1e293b, #0f172a);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      color: #f8fafc;
      padding: 2rem 1.5rem;
    }
    .header {
      max-width: 1300px;
      margin: 0 auto 2.5rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 1rem;
      padding-bottom: 1.5rem;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
    }
    .title-group h1 {
      font-size: 2.2rem;
      font-weight: 800;
      background: linear-gradient(135deg, #00dfd8, #007cf0, #7928ca);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 0.3rem;
    }
    .title-group p {
      color: #94a3b8;
      font-size: 0.95rem;
    }
    .back-btn {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      padding: 0.7rem 1.4rem;
      border-radius: 9999px;
      background: rgba(255, 255, 255, 0.08);
      color: #f8fafc;
      text-decoration: none;
      font-weight: 600;
      font-size: 0.95rem;
      border: 1px solid rgba(255, 255, 255, 0.15);
      backdrop-filter: blur(10px);
      transition: all 0.25s ease;
    }
    .back-btn:hover {
      background: rgba(0, 124, 240, 0.25);
      border-color: #007cf0;
      color: #38bdf8;
      transform: translateX(-4px);
    }
    .gallery-grid {
      max-width: 1300px;
      margin: 0 auto;
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 1.5rem;
    }
    .gallery-item {
      position: relative;
      border-radius: 20px;
      overflow: hidden;
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(255, 255, 255, 0.08);
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.35);
      cursor: pointer;
      aspect-ratio: 4 / 3;
      transition: transform 0.3s ease, box-shadow 0.3s ease, border-color 0.3s ease;
    }
    .gallery-item:hover {
      transform: translateY(-6px);
      box-shadow: 0 20px 40px rgba(0, 124, 240, 0.25);
      border-color: rgba(56, 189, 248, 0.5);
    }
    .gallery-item img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      transition: transform 0.4s ease;
    }
    .gallery-item:hover img {
      transform: scale(1.06);
    }
    .overlay {
      position: absolute;
      inset: 0;
      background: linear-gradient(to top, rgba(15, 23, 42, 0.8) 0%, transparent 60%);
      opacity: 0;
      transition: opacity 0.3s ease;
      display: flex;
      align-items: flex-end;
      padding: 1rem;
    }
    .gallery-item:hover .overlay {
      opacity: 1;
    }
    .overlay span {
      font-size: 0.85rem;
      color: #e2e8f0;
      font-weight: 500;
      text-overflow: ellipsis;
      overflow: hidden;
      white-space: nowrap;
    }
    /* Lightbox Modal */
    .lightbox {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.92);
      backdrop-filter: blur(16px);
      display: none;
      justify-content: center;
      align-items: center;
      z-index: 1000;
      padding: 2rem;
    }
    .lightbox.active {
      display: flex;
    }
    .lightbox img {
      max-width: 92vw;
      max-height: 88vh;
      border-radius: 16px;
      box-shadow: 0 25px 60px rgba(0, 0, 0, 0.8);
      object-fit: contain;
    }
    .close-btn {
      position: absolute;
      top: 1.5rem;
      right: 2rem;
      background: rgba(255, 255, 255, 0.15);
      border: 1px solid rgba(255, 255, 255, 0.2);
      color: #fff;
      font-size: 1.8rem;
      width: 48px;
      height: 48px;
      border-radius: 50%;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.2s;
    }
    .close-btn:hover {
      background: rgba(239, 68, 68, 0.8);
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="title-group">
      <h1>📷 精彩摄影图库</h1>
      <p>精选照片展示 · 共 <span id="count">0</span> 张作品</p>
    </div>
    <div style="display: flex; gap: 0.8rem; flex-wrap: wrap;">
      <a href="./index.html" class="back-btn">
        <span>←</span> 返回主页
      </a>
    </div>
  </div>

  <div class="gallery-grid" id="galleryGrid"></div>

  <div class="lightbox" id="lightbox" onclick="closeLightbox(event)">
    <button class="close-btn" onclick="closeLightbox()">&times;</button>
    <img id="lightboxImg" src="" alt="大图预览">
  </div>

  <script>
    const images = [
      "DJI_20260402150308_0942_D.JPG",
      "DJI_20260407162817_0988_D.JPG",
      "DJI_20260407185959_0995_D.JPG",
      "DJI_20260408102025_0013_D.JPG",
      "DJI_20260408102051_0015_D.JPG",
      "DJI_20260409112109_0035_D.JPG",
      "DJI_20260415150747_0133_D_edit_123733433409913.jpg",
      "DJI_20260415203400_0139_D.JPG",
      "DJI_20260416085446_0141_D_edit_123724521604989.jpg",
      "DJI_20260430093149_0221_D.JPG",
      "DJI_20260430093211_0222_D.JPG",
      "DJI_20260430093218_0223_D.JPG",
      "retouch_2026050915542361.jpg",
      "Videoframe_20260403_154700_com.huawei.himovie.jpg",
      "Videoframe_20260417_165442_com.huawei.himovie.jpg",
      "Videoframe_20260417_165444_com.huawei.himovie.jpg",
      "Videoframe_20260417_165447_com.huawei.himovie.jpg",
      "Videoframe_20260417_165453_com.huawei.himovie.jpg",
      "Videoframe_20260508_183914_com.huawei.himovie.jpg",
      "Videoframe_20260508_183917_com.huawei.himovie.jpg",
      "Videoframe_20260508_183933_com.huawei.himovie.jpg",
      "Videoframe_20260508_183938_com.huawei.himovie.jpg",
      "Videoframe_20260508_183956_com.huawei.himovie.jpg"
    ];

    document.getElementById('count').textContent = images.length;
    const grid = document.getElementById('galleryGrid');

    images.forEach((imgName, index) => {
      const item = document.createElement('div');
      item.className = 'gallery-item';
      item.onclick = () => openLightbox(`./s/${imgName}`);

      item.innerHTML = `
        <img src="./s/${imgName}" alt="照片 ${index + 1}" loading="lazy">
        <div class="overlay">
          <span>作品 #${index + 1}</span>
        </div>
      `;
      grid.appendChild(item);
    });

    const lightbox = document.getElementById('lightbox');
    const lightboxImg = document.getElementById('lightboxImg');

    function openLightbox(src) {
      lightboxImg.src = src;
      lightbox.classList.add('active');
    }

    function closeLightbox(e) {
      if (!e || e.target === lightbox || e.target.classList.contains('close-btn')) {
        lightbox.classList.remove('active');
        lightboxImg.src = '';
      }
    }

    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') closeLightbox();
    });
  </script>
</body>
</html>
