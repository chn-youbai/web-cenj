<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#faf9f5">
  <title>秘密留言板 · 畅所欲言</title>
  <link rel="icon" href="./OIP-C.jpg" type="image/jpeg">
  <script>
    (function(){try{var t=localStorage.getItem("cenj_theme_v1");var d=t==="dark"||(t!=="light"&&window.matchMedia("(prefers-color-scheme: dark)").matches);document.documentElement.dataset.theme=d?"dark":"light";if(d)document.documentElement.classList.add("dark");var m=document.querySelector('meta[name="theme-color"]');if(m)m.content=d?"#262624":"#faf9f5";}catch(e){}})();
  </script>
  <link rel="preconnect" href="https://fonts.loli.net" crossorigin>
  <link rel="stylesheet" href="https://fonts.loli.net/css2?family=Noto+Serif+SC:wght@400;500;600;700&display=swap">
  <link rel="stylesheet" href="./src/styles/base.css">
  <link rel="stylesheet" href="./src/styles/shell.css">
  <link rel="stylesheet" href="./src/styles/board.css">
</head>
<body>

  <div class="board-container">
    <!-- 顶部导航栏 -->
    <header class="board-header">
      <div class="header-title-box">
        <h1 class="header-title">
          <span>💬</span>
          <span>秘密留言板</span>
        </h1>
        <p class="header-subtitle">
          <span id="totalBadge">正在加载留言...</span>
        </p>
      </div>
      <button type="button" class="btn-refresh" id="btnRefresh" title="刷新留言列表">
        <span>🔄</span>
      </button>
    </header>

    <!-- 主发言区域 (发表顶层留言) -->
    <section class="composer-card">
      <div class="composer-meta-row">
        <div class="nickname-wrapper">
          <span class="avatar-badge" id="avatarBadge" title="随机切换头像">🚀</span>
          <input type="text" id="nicknameInput" class="nickname-input" placeholder="输入昵称" maxlength="25">
          <button type="button" class="btn-dice" id="btnRandomNick" title="换一个趣味随机昵称">🎲 随机换</button>
        </div>
        <div class="quick-emojis">
          <span class="emoji-pill" data-emoji="✨">✨</span>
          <span class="emoji-pill" data-emoji="🍉">🍉</span>
          <span class="emoji-pill" data-emoji="🚀">🚀</span>
          <span class="emoji-pill" data-emoji="🐱">🐱</span>
          <span class="emoji-pill" data-emoji="🔥">🔥</span>
          <span class="emoji-pill" data-emoji="❤️">❤️</span>
        </div>
      </div>

      <textarea id="contentInput" class="composer-textarea" placeholder="留下一句属于你的足迹吧（文明友善交流）..." maxlength="500"></textarea>

      <div class="composer-footer">
        <span class="char-counter" id="charCounter">0 / 500</span>
        <div class="composer-actions">
          <button type="button" class="btn-submit" id="btnSubmitMsg">
            <span>🚀</span>
            <span>发布留言</span>
          </button>
        </div>
      </div>
    </section>

    <!-- 留言与楼中楼树状列表容器 -->
    <main id="threadsContainer" class="threads-container">
      <div class="loading-pulse">
        <div class="spinner"></div>
      </div>
    </main>
  </div>

  <!-- Toast 提示框 -->
  <div id="toast" class="toast"></div>

  <script type="module" src="/src/pages/board/main.ts"></script>
</body>
</html>
