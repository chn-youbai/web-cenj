<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#faf9f5">
  <title>资源网盘 · 云端文件库</title>
  <link rel="icon" href="./OIP-C.jpg" type="image/jpeg">
  <script>
    (function(){try{var t=localStorage.getItem("cenj_theme_v1");var d=t==="dark"||(t!=="light"&&window.matchMedia("(prefers-color-scheme: dark)").matches);document.documentElement.dataset.theme=d?"dark":"light";document.documentElement.classList.toggle("dark",d);var m=document.querySelector('meta[name="theme-color"]');if(m)m.content=d?"#262624":"#faf9f5";}catch(e){}})();
  </script>
  <link rel="preconnect" href="https://fonts.loli.net" crossorigin>
  <link rel="stylesheet" href="https://fonts.loli.net/css2?family=Noto+Serif+SC:wght@400;500;600;700&display=swap">
  <link rel="stylesheet" href="./src/styles/base.css">
  <link rel="stylesheet" href="./src/styles/shell.css">
  <link rel="stylesheet" href="./src/styles/pan.css">
</head>
<body>
  <div class="pan-stage">
    <!-- 顶部出版物页头（与全站 Claude Editorial 风格统一） -->
    <header class="pan-header">
      <div class="pan-header-title">
        <div class="pan-eyebrow">ARCHIVE · CLOUD DRIVE</div>
        <h1>资源网盘</h1>
        <p class="pan-stats-line" id="panStatsLine">正在加载文件库...</p>
      </div>

      <div class="pan-header-actions">
        <button type="button" class="pan-btn pan-btn-ghost" id="btnToggleAdmin">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/>
            <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
          </svg>
          <span id="btnToggleAdminText">私密解锁</span>
        </button>
        <button type="button" class="pan-btn pan-btn-ghost" id="btnOpenLinkModal">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/>
            <path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/>
          </svg>
          <span>添加外链</span>
        </button>
        <button type="button" class="pan-btn pan-btn-primary" id="btnTriggerUpload">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
            <polyline points="17 8 12 3 7 8"/>
            <line x1="12" y1="3" x2="12" y2="15"/>
          </svg>
          <span>上传文件</span>
        </button>
        <input type="file" id="panFileInput" multiple hidden>
      </div>
    </header>

    <!-- 工具栏：搜索 + 排序 + 分类胶囊 + 权限开关 -->
    <section class="pan-toolbar" aria-label="筛选与检索">
      <div class="pan-toolbar-top">
        <div class="pan-search-wrap">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <circle cx="11" cy="11" r="7"/>
            <path d="M21 21l-4.35-4.35"/>
          </svg>
          <input type="text" id="panSearchInput" class="pan-search-input" placeholder="搜索文件名、备注或类型...">
          <button type="button" class="pan-clear-btn" id="panSearchClear" hidden aria-label="清空搜索">✕</button>
        </div>

        <div class="pan-toolbar-right">
          <div class="pan-vis-switch" id="panVisSwitch" hidden role="group" aria-label="可见性筛选">
            <button type="button" class="pan-seg-btn active" data-vis="all">全部</button>
            <button type="button" class="pan-seg-btn" data-vis="public">公开</button>
            <button type="button" class="pan-seg-btn" data-vis="private">私密</button>
          </div>

          <select id="panSortSelect" class="pan-select" aria-label="排序方式">
            <option value="newest">最新上传</option>
            <option value="downloads">下载最多</option>
            <option value="size">文件最大</option>
            <option value="name">名称排序</option>
          </select>
        </div>
      </div>

      <div class="pan-category-row">
        <div class="pan-cat-chips" id="panCatChips" role="tablist" aria-label="文件分类">
          <button type="button" class="pan-chip active" data-cat="all">全部</button>
          <button type="button" class="pan-chip" data-cat="software">软件</button>
          <button type="button" class="pan-chip" data-cat="document">文档</button>
          <button type="button" class="pan-chip" data-cat="image">图片</button>
          <button type="button" class="pan-chip" data-cat="archive">压缩包</button>
          <button type="button" class="pan-chip" data-cat="media">影音</button>
          <button type="button" class="pan-chip" data-cat="other">其他</button>
        </div>

        <label class="pan-upload-vis-toggle" id="uploadVisToggleWrap" hidden>
          <input type="checkbox" id="uploadPrivateCheck">
          <span>本次上传设为私密</span>
        </label>
      </div>
    </section>

    <!-- 拖拽上传轻提示条 -->
    <div class="pan-drop-bar" id="panDropBar" role="button" tabindex="0" aria-label="拖拽或点击选择文件上传">
      <span>拖拽任意文件到此处或点击上传 · ≤20MB 走 CF 边缘极速，>20MB 自动走 GitHub 直传/分片</span>
    </div>

    <!-- 上传任务队列 -->
    <section class="pan-queue" id="panQueue" hidden aria-label="上传队列">
      <div class="pan-queue-head">
        <span id="panQueueTitle">上传队列</span>
        <button type="button" class="pan-text-btn" id="btnClearQueue">清除已完成</button>
      </div>
      <div class="pan-queue-list" id="panQueueList"></div>
    </section>

    <!-- 主文件列表 -->
    <main class="pan-list-wrap" aria-live="polite">
      <div class="pan-list" id="panFileList"></div>
      <div class="pan-empty" id="panEmptyState" hidden>
        <p class="pan-empty-title" id="panEmptyTitle">暂无文件</p>
        <p class="pan-empty-sub" id="panEmptySub">拖拽文件到页面或点击右上角「上传文件」即可开始使用</p>
      </div>
    </main>
  </div>

  <!-- 全局拖拽蒙层 -->
  <div class="pan-drag-overlay" id="panDragOverlay" hidden>
    <div class="pan-drag-box">
      <p class="pan-drag-title">松手立即上传至云端文件库</p>
      <p class="pan-drag-sub" id="panDragSub">≤ 20 MB 自动存入 CF 边缘极速库，> 20 MB 自动走 GitHub 高速通道</p>
    </div>
  </div>

  <!-- 模态窗 1：管理解锁 -->
  <div class="pan-modal-backdrop" id="adminModal" hidden role="dialog" aria-modal="true" aria-labelledby="adminModalTitle">
    <div class="pan-modal pan-modal-sm">
      <div class="pan-modal-head">
        <h3 id="adminModalTitle">解锁私密与管理权限</h3>
        <button type="button" class="pan-icon-close" data-close-modal="adminModal" aria-label="关闭">✕</button>
      </div>
      <p class="pan-modal-desc">输入管理密码后可查看/下载/上传私密文件，以及切换公开私密、编辑和删除文件（仅当前标签页有效）。</p>
      <form id="adminUnlockForm" class="pan-form">
        <input type="password" id="adminPasswordInput" class="pan-input" placeholder="请输入管理密码 (ADMIN_PASSWORD)" autocomplete="current-password">
        <div class="pan-modal-actions">
          <button type="button" class="pan-btn pan-btn-ghost" data-close-modal="adminModal">取消</button>
          <button type="submit" class="pan-btn pan-btn-primary" id="adminSubmitBtn">解锁</button>
        </div>
      </form>
    </div>
  </div>

  <!-- 模态窗 2：添加外链资源 -->
  <div class="pan-modal-backdrop" id="linkModal" hidden role="dialog" aria-modal="true" aria-labelledby="linkModalTitle">
    <div class="pan-modal">
      <div class="pan-modal-head">
        <h3 id="linkModalTitle">添加外链资源</h3>
        <button type="button" class="pan-icon-close" data-close-modal="linkModal" aria-label="关闭">✕</button>
      </div>
      <form id="linkForm" class="pan-form">
        <label class="pan-field">
          <span>资源名称</span>
          <input type="text" id="linkNameInput" class="pan-input" placeholder="例如：Clash Verge 安装包" required>
        </label>
        <label class="pan-field">
          <span>直链或分享 URL</span>
          <input type="url" id="linkUrlInput" class="pan-input" placeholder="https://..." required>
        </label>
        <div class="pan-field-row">
          <label class="pan-field">
            <span>分类</span>
            <select id="linkCatSelect" class="pan-select">
              <option value="software">软件</option>
              <option value="document">文档</option>
              <option value="image">图片</option>
              <option value="archive">压缩包</option>
              <option value="media">影音</option>
              <option value="other" selected>其他</option>
            </select>
          </label>
          <label class="pan-field" id="linkVisField" hidden>
            <span>可见性</span>
            <select id="linkVisSelect" class="pan-select">
              <option value="public">公开</option>
              <option value="private">私密</option>
            </select>
          </label>
        </div>
        <label class="pan-field">
          <span>备注 / 提取码（可选）</span>
          <input type="text" id="linkNoteInput" class="pan-input" placeholder="如：提取码 pass、适用系统说明...">
        </label>
        <div class="pan-modal-actions">
          <button type="button" class="pan-btn pan-btn-ghost" data-close-modal="linkModal">取消</button>
          <button type="submit" class="pan-btn pan-btn-primary" id="linkSubmitBtn">保存资源</button>
        </div>
      </form>
    </div>
  </div>

  <!-- 模态窗 3：编辑文件信息 -->
  <div class="pan-modal-backdrop" id="editModal" hidden role="dialog" aria-modal="true" aria-labelledby="editModalTitle">
    <div class="pan-modal">
      <div class="pan-modal-head">
        <h3 id="editModalTitle">编辑文件信息</h3>
        <button type="button" class="pan-icon-close" data-close-modal="editModal" aria-label="关闭">✕</button>
      </div>
      <form id="editForm" class="pan-form">
        <input type="hidden" id="editFileId">
        <label class="pan-field">
          <span>文件名称</span>
          <input type="text" id="editNameInput" class="pan-input" required>
        </label>
        <div class="pan-field-row">
          <label class="pan-field">
            <span>分类</span>
            <select id="editCatSelect" class="pan-select">
              <option value="software">软件</option>
              <option value="document">文档</option>
              <option value="image">图片</option>
              <option value="archive">压缩包</option>
              <option value="media">影音</option>
              <option value="other">其他</option>
            </select>
          </label>
          <label class="pan-field">
            <span>可见性</span>
            <select id="editVisSelect" class="pan-select">
              <option value="public">公开</option>
              <option value="private">私密</option>
            </select>
          </label>
        </div>
        <label class="pan-field">
          <span>备注</span>
          <input type="text" id="editNoteInput" class="pan-input" placeholder="可选备注说明">
        </label>
        <div class="pan-modal-actions">
          <button type="button" class="pan-btn pan-btn-ghost" data-close-modal="editModal">取消</button>
          <button type="submit" class="pan-btn pan-btn-primary" id="editSubmitBtn">保存修改</button>
        </div>
      </form>
    </div>
  </div>

  <!-- 模态窗 4：在线预览 -->
  <div class="pan-modal-backdrop" id="previewModal" hidden role="dialog" aria-modal="true" aria-labelledby="previewModalTitle">
    <div class="pan-modal pan-modal-lg">
      <div class="pan-modal-head">
        <div class="pan-preview-head-meta">
          <h3 id="previewModalTitle">文件预览</h3>
          <span class="pan-preview-sub" id="previewModalSub"></span>
        </div>
        <button type="button" class="pan-icon-close" data-close-modal="previewModal" aria-label="关闭">✕</button>
      </div>
      <div class="pan-preview-body" id="previewModalBody"></div>
      <div class="pan-modal-actions">
        <a id="previewOpenRawLink" class="pan-btn pan-btn-ghost" href="#" target="_blank" rel="noopener noreferrer">新窗口打开</a>
        <a id="previewDownloadLink" class="pan-btn pan-btn-primary" href="#" download>高速下载</a>
      </div>
    </div>
  </div>

  <div class="toast" id="toast">已复制到剪贴板</div>

  <script type="module" src="./src/pages/pan/main.ts"></script>
</body>
</html>
