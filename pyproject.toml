[project]
name = "web-cenj"
version = "2.0.0"
description = "AI Exam Typesetter Cloud Engine"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn>=0.28.0",
    "python-multipart>=0.0.9",
    "python-docx>=1.1.0",
    "pypdf>=4.0.0",
    "latex2mathml>=3.77.0",
    "mathml2omml>=0.0.1",
    "lxml>=5.0.0",
    "requests>=2.31.0",
    "httpx>=0.27.0"
]

[tool.vercel]
entrypoint = "api/index.py"
